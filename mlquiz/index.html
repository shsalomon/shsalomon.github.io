on the same sequences","Keep complete driving sequences in separate splits","Randomly split individual frames"],"correctIndex":2,"explanation":"Neighboring frames can be near duplicates; grouping by sequence reduces this leakage."},{"id":13,"category":"ML fundamentals and evaluation","question":"A detector produces 80 true positives and 20 false positives. What is its precision?","options":["20%","80%","Cannot be calculated without false negatives","60%"],"correctIndex":1,"explanation":"Precision = TP / (TP + FP) = 80 / 100."},{"id":14,"category":"ML fundamentals and evaluation","question":"A detector finds 60 of 100 actual positives. What is its recall?","options":["60%","40%","Cannot be calculated without true negatives","100%"],"correctIndex":0,"explanation":"Recall = TP / (TP + FN), so 60 / 100."},{"id":15,"category":"ML fundamentals and evaluation","question":"With fixed binary classifier scores, lowering the positive threshold makes recall do what?","options":["Become equal to precision","Always decrease","Always increase strictly","Stay the same or increase"],"correctIndex":3,"explanation":"The predicted-positive set can only expand as the threshold falls."},{"id":16,"category":"ML fundamentals and evaluation","question":"Only 1% of samples are positive. A model always predicts negative. What is its accuracy?","options":["0%","50%","1%","99%"],"correctIndex":3,"explanation":"High accuracy can hide complete failure to detect the rare positive class."},{"id":17,"category":"ML fundamentals and evaluation","question":"When should a feature standardizer's mean and variance be fitted?","options":["On training data only","Separately on each test sample","On the test set only","On the full dataset before splitting"],"correctIndex":0,"explanation":"Use training statistics to transform validation and test data without leaking their distribution into fitting."},{"id":18,"category":"ML fundamentals and evaluation","question":"What is the main role of a validation set during model development?","options":["Guarantee performance after deployment","Provide the final untouched performance estimate","Select hyperparameters and model variants","Replace the training set"],"correctIndex":2,"explanation":"The test set should remain separate from model selection."},{"id":19,"category":"ML fundamentals and evaluation","question":"A model trained in sunny weather performs poorly in fog. Which issue is most directly illustrated?","options":["A proof that the training loss was wrong","An increase in label accuracy","Distribution shift","A guaranteed optimizer bug"],"correctIndex":2,"explanation":"Deployment inputs can differ from the training distribution."},{"id":20,"category":"ML fundamentals and evaluation","question":"Model A is more accurate and lower-latency than model B. Considering only these two objectives, which statement is true?","options":["B Pareto-dominates A","A and B are necessarily equivalent","Both must be Pareto-optimal","A Pareto-dominates B"],"correctIndex":3,"explanation":"A is better on both objectives, so B offers no trade-off advantage."},{"id":21,"category":"Deep learning and transformers","question":"What does backpropagation primarily use to compute gradients through composed operations?","options":["A matrix determinant","The chain rule","Bayes' rule","The central limit theorem"],"correctIndex":1,"explanation":"It combines local derivatives along the computation graph."},{"id":22,"category":"Deep learning and transformers","question":"What is the derivative of ReLU(x) for x < 0?","options":["\u22121","0","x","1"],"correctIndex":1,"explanation":"ReLU is constant at zero on the negative half-line."},{"id":23,"category":"Deep learning and transformers","question":"For L = L1 + 2L2, what is its gradient with respect to shared parameters \u03b8?","options":["\u2207\u03b8L1 \u00d7 \u2207\u03b8L2","2\u2207\u03b8L1 + \u2207\u03b8L2","\u2207\u03b8L1 + 2\u2207\u03b8L2","\u2207\u03b8L1 + \u2207\u03b8L2"],"correctIndex":2,"explanation":"Differentiation is linear; the loss weight also scales its gradient contribution."},{"id":24,"category":"Deep learning and transformers","question":"Which task-gradient relationship can cause conflict during multi-task training?","options":["Both gradients being zero","A negative dot product","A positive dot product","Identical gradients"],"correctIndex":1,"explanation":"A small step that decreases one loss can increase the other when their gradients oppose."},{"id":25,"category":"Deep learning and transformers","question":"What is a key optimization benefit of a residual connection y = x + F(x)?","options":["It removes all nonlinearities","It makes network depth irrelevant","It supplies a direct identity path for gradients","It guarantees zero training error"],"correctIndex":2,"explanation":"The derivative includes an identity contribution in addition to the residual branch."},{"id":26,"category":"Deep learning and transformers","question":"In a standard transformer, LayerNorm over the hidden dimension computes statistics across what?","options":["The complete training dataset","All examples in the batch","Class labels in the batch","Features within each token's representation"],"correctIndex":3,"explanation":"The usual LayerNorm configuration normalizes each token independently across its hidden features."},{"id":27,"category":"Deep learning and transformers","question":"A 224\u00d7224 image is divided into non-overlapping 16\u00d716 patches. How many patch tokens result, excluding special tokens?","options":["256","197","14","196"],"correctIndex":3,"explanation":"There are 224/16 = 14 patches along each side, so 14\u00b2 = 196."},{"id":28,"category":"Deep learning and transformers","question":"If token count doubles, how does the number of pairwise scores in dense self-attention change?","options":["It doubles","It stays unchanged","It becomes four times as large","It becomes eight times as large"],"correctIndex":2,"explanation":"The attention score matrix has N\u00d7N entries; this refers to pairwise scores, not necessarily total runtime."},{"id":29,"category":"Deep learning and transformers","question":"In standard scaled dot-product attention, QK\u1d40 is divided by what?","options":["\u221ad_k, where d_k is the key dimension","The number of classes","The batch size","d_k\u00b2"],"correctIndex":0,"explanation":"The scaling moderates dot-product magnitudes and helps avoid saturated softmax outputs."},{"id":30,"category":"Deep learning and transformers","question":"In cross-attention where camera tokens query LiDAR tokens, where do keys and values come from?","options":["Camera tokens only","Ground-truth labels only","LiDAR tokens","The optimizer state"],"correctIndex":2,"explanation":"Queries come from one stream; keys and values come from the stream being attended to."},{"id":31,"category":"PyTorch","question":"What does model.eval() do by itself?","options":["Freezes every parameter permanently","Changes training-specific layer behavior; it does not disable autograd","Disables all gradient tracking","Moves the model to the CPU"],"correctIndex":1,"explanation":"Standard dropout and batch normalization change behavior; gradient tracking is a separate setting."},{"id":32,"category":"PyTorch","question":"Which context disables reverse-mode autograd recording for ordinary tensor operations during evaluation?","options":["optimizer.zero_grad()","torch.no_grad()","torch.enable_grad()","model.train()"],"correctIndex":1,"explanation":"Use it alongside model.eval() when evaluation does not need gradients."},{"id":33,"category":"PyTorch","question":"What should normally be supplied as the input to nn.CrossEntropyLoss?","options":["One-hot predictions","Argmax class indices","Raw class logits","Softmax probabilities"],"correctIndex":2,"explanation":"The loss handles the log-softmax computation internally."},{"id":34,"category":"PyTorch","question":"If gradients are not cleared between two backward passes on separate losses, what happens to a leaf parameter's .grad?","options":["The new gradient is added to the existing gradient","It is automatically divided by two","It is always overwritten","The parameter is removed from the optimizer"],"correctIndex":0,"explanation":"Accumulation is useful deliberately, but accidental accumulation changes the update."},{"id":35,"category":"PyTorch","question":"Does x.detach() create independent storage for the tensor's data?","options":["Yes; it always deep-copies the data","Only when x requires gradients","No; it shares storage with x","Yes; it moves the data to the CPU"],"correctIndex":2,"explanation":"detach cuts the autograd connection; use detach().clone() when an independent copy is needed."},{"id":36,"category":"PyTorch","question":"Two tensors each have shape (2, 3). What is torch.cat([a, b], dim=0).shape?","options":["(4, 3)","(2, 6)","(6, 2)","(2, 2, 3)"],"correctIndex":0,"explanation":"Concatenation extends an existing dimension."},{"id":37,"category":"PyTorch","question":"Two tensors each have shape (2, 3). What is torch.stack([a, b], dim=0).shape?","options":["(4, 3)","(2, 6)","(2, 3)","(2, 2, 3)"],"correctIndex":3,"explanation":"Stacking inserts a new dimension for the tensors being combined."},{"id":38,"category":"PyTorch","question":"Why can x.transpose(0, 1).view(-1) fail for a 2D tensor?","options":["Every transpose changes the number of elements","view cannot operate on floating-point tensors","The transposed strides may be incompatible with the requested view","transpose deletes the underlying data"],"correctIndex":2,"explanation":"reshape may copy when needed; contiguous().view(-1) is another option."},{"id":39,"category":"PyTorch","question":"In standard DistributedDataParallel without custom communication hooks, what is normally synchronized during backward?","options":["Python random-number generators","Every intermediate activation","Parameter gradients across workers","Every worker's complete dataset"],"correctIndex":2,"explanation":"Default DDP reduces gradients across workers; matching data partitioning still needs to be arranged."},{"id":40,"category":"PyTorch","question":"In ordinary full-precision training, when should gradient-norm clipping occur?","options":["Before any forward pass","After backward() and before optimizer.step()","Instead of computing the loss","After optimizer.step() only"],"correctIndex":1,"explanation":"Clipping must act on computed gradients before the optimizer uses them."},{"id":41,"category":"Python and NumPy","question":"After a = [1, 2]; b = a; b.append(3), what is a?","options":["None","[1, 2]","[3]","[1, 2, 3]"],"correctIndex":3,"explanation":"Both variables refer to the same mutable list."},{"id":42,"category":"Python and NumPy","question":"Why is a mutable default such as def f(items=[]): potentially problematic?","options":["The same default list is reused across calls","Lists cannot be function arguments","The default is evaluated only when the function returns","A new list is made for every call"],"correctIndex":0,"explanation":"Defaults are evaluated when the function is defined; use None and initialize inside when needed."},{"id":43,"category":"Python and NumPy","question":"After a = [[0]]; b = a.copy(); b[0][0] = 7, what is a[0][0]?","options":["An IndexError is raised","7","0","None"],"correctIndex":1,"explanation":"A shallow copy duplicates the outer list while retaining references to nested objects."},{"id":44,"category":"Python and NumPy","question":"What does Python's is operator compare?","options":["Numerical closeness","Object identity","String length","Elementwise array equality"],"correctIndex":1,"explanation":"Use == for value equality and is for identity checks."},{"id":45,"category":"Python and NumPy","question":"For a built-in dictionary with well-behaved hashes, what is the average-case lookup complexity in the number of keys?","options":["O(n log n)","O(log n)","O(1)","O(n)"],"correctIndex":2,"explanation":"Hash-table lookup is constant on average; worst-case behavior can be linear."},{"id":46,"category":"Python and NumPy","question":"Which built-in object can be a dictionary key?","options":["{1, 2}","[1, 2]","{'x': 1}","(1, 2)"],"correctIndex":3,"explanation":"The tuple contains only hashable integers; lists, sets, and dictionaries are unhashable."},{"id":47,"category":"Python and NumPy","question":"What is a key property of a generator expression?","options":["It computes and stores every value immediately","It can never be exhausted","It automatically runs on another thread","It produces values lazily when iterated"],"correctIndex":3,"explanation":"Lazy evaluation avoids constructing the full result collection upfront."},{"id":48,"category":"Python and NumPy","question":"What shape results when NumPy arrays of shapes (4, 1) and (1, 3) are added?","options":["(1, 1)","A shape error always occurs","(4, 1)","(4, 3)"],"correctIndex":3,"explanation":"Broadcasting expands dimensions of size one to match the other array."},{"id":49,"category":"Python and NumPy","question":"For a NumPy ndarray, does a basic slice such as b = a[1:3] normally share data with a?","options":["Only if a contains strings","Only after calling copy()","Yes; b is a view","No; every slice is a deep copy"],"correctIndex":2,"explanation":"Changing elements through the slice can change the original array."},{"id":50,"category":"Python and NumPy","question":"For a NumPy numeric array x, which expression performs elementwise testing that 0 < x < 1?","options":["0 < x < 1","(x > 0) & (x < 1)","(x > 0) or (x < 1)","(x > 0) and (x < 1)"],"correctIndex":1,"explanation":"Use elementwise operators with parenthesized comparisons; Python and/or require scalar truth evaluation."},{"id":51,"category":"C++ and algorithms","question":"What is the central idea of RAII in C++?","options":["Tie resource ownership and cleanup to object lifetime","Replace all pointers with global variables","Release resources only at program shutdown","Use garbage collection for every allocation"],"correctIndex":0,"explanation":"Constructors acquire resources and destructors release them, including during normal exception unwinding."},{"id":52,"category":"C++ and algorithms","question":"Which smart pointer expresses exclusive ownership?","options":["T*","std::shared_ptr<T>","std::weak_ptr<T>","std::unique_ptr<T>"],"correctIndex":3,"explanation":"A unique_ptr owns its resource exclusively and can transfer ownership by moving."},{"id":53,"category":"C++ and algorithms","question":"What does std::move(x) itself do?","options":["Casts x to an expression that can enable moving","Always moves x's data immediately","Always destroys x","Always sets x to zero"],"correctIndex":0,"explanation":"The receiving operation decides whether a move occurs; std::move itself is a cast."},{"id":54,"category":"C++ and algorithms","question":"Which parameter type usually avoids copying a large object when only read access is needed?","options":["T","const T&","T&& in every situation","volatile T"],"correctIndex":1,"explanation":"A const reference binds to the existing object without making a by-value copy."},{"id":55,"category":"C++ and algorithms","question":"For const int* p, which statement is correct?","options":["p can be reassigned, but *p cannot be modified through p","Both p and *p are immutable","Both p and *p may be freely modified through p","p cannot be reassigned, but *p can be modified"],"correctIndex":0,"explanation":"The const qualifies the pointed-to integer; int* const would instead make the pointer itself constant."},{"id":56,"category":"C++ and algorithms","question":"What is wrong with returning a reference to an ordinary local int variable?","options":["The integer is automatically copied to permanent storage","References are always heap-allocated","The compiler must turn the variable into static storage","The reference dangles after the function returns"],"correctIndex":3,"explanation":"The local object's lifetime ends at function return; later access through the reference is invalid."},{"id":57,"category":"C++ and algorithms","question":"In C++17, what is the value of the expression 5 / 2?","options":["Undefined behavior","2","2.5","3"],"correctIndex":1,"explanation":"Both operands are integers, so integer division discards the fractional part."},{"id":58,"category":"C++ and algorithms","question":"In standard C++17, what happens when signed int arithmetic overflows?","options":["It is guaranteed to wrap around","The result saturates at INT_MAX","The behavior is undefined","It always throws std::overflow_error"],"correctIndex":2,"explanation":"Unsigned arithmetic has modulo rules; signed overflow does not have that guarantee."},{"id":59,"category":"C++ and algorithms","question":"A Derived object is deleted through Base*. What should Base normally have to make this polymorphic deletion well-defined?","options":["Only a static destructor","A virtual destructor","No destructor","Only a virtual constructor"],"correctIndex":1,"explanation":"Without a virtual base destructor, this ordinary base-pointer deletion has undefined behavior."},{"id":60,"category":"C++ and algorithms","question":"When std::vector growth reallocates its element storage, what happens to existing element pointers and references?","options":["They remain valid until program exit","They are invalidated","Only pointers are invalidated","They automatically point to the new storage"],"correctIndex":1,"explanation":"Reallocation relocates elements; old addresses no longer designate the vector's elements."},{"id":61,"category":"C++ and algorithms","question":"After an empty std::vector<int> calls reserve(100), what is its size()?","options":["An implementation-defined positive number","100","0","1"],"correctIndex":2,"explanation":"reserve changes capacity as needed, not the number of elements."},{"id":62,"category":"C++ and algorithms","question":"Does sharing an object through std::shared_ptr automatically make concurrent mutation of that object safe?","options":["Only if the shared_ptr was copied","Yes; all pointee access is serialized","Yes, if use_count() is greater than one","No; the pointee still needs appropriate synchronization"],"correctIndex":3,"explanation":"Control-block ownership bookkeeping does not make the managed object's operations thread-safe."},{"id":63,"category":"C++ and algorithms","question":"What does std::lock_guard<std::mutex> do at the end of its scope?","options":["Deletes the protected data","Waits for every program thread to finish","Locks the mutex a second time","Unlocks the mutex it owns"],"correctIndex":3,"explanation":"Its destructor releases the lock using RAII."},{"id":64,"category":"C++ and algorithms","question":"Two threads increment the same ordinary int without synchronization. What is the language-level problem?","options":["Only a guaranteed one-count error","Automatic serialization by the compiler","A guaranteed deadlock","A data race causing undefined behavior"],"correctIndex":3,"explanation":"Conflicting unsynchronized non-atomic accesses are a data race."},{"id":65,"category":"C++ and algorithms","question":"What is the worst-case number of comparisons for binary search on a sorted random-access array of n elements?","options":["O(log n)","O(n)","O(n\u00b2)","O(1)"],"correctIndex":0,"explanation":"Each comparison approximately halves the remaining search range."},{"id":66,"category":"Computer vision and geometry","question":"Which pair belongs to a pinhole camera's intrinsic parameters?","options":["Object class and confidence","Vehicle speed and yaw rate","Camera-to-world rotation and translation","Focal lengths and principal point"],"correctIndex":3,"explanation":"Intrinsics govern how camera-coordinate rays map to image pixels."},{"id":67,"category":"Computer vision and geometry","question":"What do extrinsic calibration parameters between a camera and LiDAR describe?","options":["Their relative rotation and translation","The LiDAR's object-class vocabulary","The camera's focal length only","The neural network's learning rate"],"correctIndex":0,"explanation":"Extrinsics transform coordinates from one sensor frame into the other."},{"id":68,"category":"Computer vision and geometry","question":"Ignoring distortion, u = f_x X/Z + c_x. If f_x=800 px, X=1 m, Z=4 m, c_x=320 px, what is u?","options":["520 px","1120 px","200 px","320 px"],"correctIndex":0,"explanation":"800\u00d7(1/4) + 320 = 520."},{"id":69,"category":"Computer vision and geometry","question":"If world-to-camera coordinates obey x_c = R x_w + t, what is the camera center in world coordinates?","options":["\u2212t in every case","Rt","t","\u2212R\u1d40t"],"correctIndex":3,"explanation":"Set x_c = 0 and use R\u207b\u00b9 = R\u1d40 to solve for x_w."},{"id":70,"category":"Computer vision and geometry","question":"In rectified stereo, f=800 px, baseline B=0.2 m and disparity d=40 px. What is depth Z=fB/d?","options":["40 m","160 m","4 m","0.25 m"],"correctIndex":2,"explanation":"Depth is inversely proportional to disparity; 800\u00d70.2/40 = 4."},{"id":71,"category":"Computer vision and geometry","question":"Which matrix maps an undistorted pixel point in one image to its corresponding epipolar line in the other image?","options":["The covariance matrix P","The fundamental matrix F","The intrinsic matrix K alone","A scalar focal length"],"correctIndex":1,"explanation":"With a suitable convention, l\u2032 = Fx for homogeneous pixel coordinates; the essential matrix uses normalized coordinates."},{"id":72,"category":"Computer vision and geometry","question":"Without known scale cues, calibrated monocular structure-from-motion generally recovers the scene up to what?","options":["An unknown class-label permutation only","A fixed one-meter translation","An unknown global scale, as well as coordinate-frame choice","A uniquely determined metric scale"],"correctIndex":2,"explanation":"Image geometry alone cannot distinguish a scaled scene and proportionally scaled camera translations."},{"id":73,"category":"Computer vision and geometry","question":"Two boxes each have area 60 and their intersection has area 40. What is their IoU?","options":["0.5","2/3","0.8","1/3"],"correctIndex":0,"explanation":"Union area = 60+60\u221240 = 80; IoU = 40/80."},{"id":74,"category":"Computer vision and geometry","question":"In standard greedy NMS within one class, what happens after selecting the highest-scoring box?","options":["The highest-scoring box is always discarded","Lower-scoring boxes with excessive IoU overlap are suppressed","All boxes of other classes are removed","Every overlapping box is averaged into one"],"correctIndex":1,"explanation":"Non-maximum suppression removes redundant detections using an overlap threshold."},{"id":75,"category":"Computer vision and geometry","question":"Which task distinguishes two separate cars at the pixel-mask level?","options":["Instance segmentation","Image-level classification","Semantic segmentation alone","Camera calibration"],"correctIndex":0,"explanation":"Instance segmentation distinguishes individual objects that share the same semantic class."},{"id":76,"category":"Sensors, fusion, and tracking","question":"Which information does a standard RGB camera directly provide that a basic range-only LiDAR does not?","options":["A measurement unaffected by lighting","Direct radial Doppler velocity","Guaranteed metric depth per pixel","Color and visual texture"],"correctIndex":3,"explanation":"RGB appearance is useful for semantic cues such as traffic-light color."},{"id":77,"category":"Sensors, fusion, and tracking","question":"For a single radar sensor, Doppler shift primarily measures which velocity component?","options":["The full 3D velocity vector directly","Only vertical velocity in world coordinates","The object's absolute speed regardless of ego motion","Relative velocity along the sensor's line of sight"],"correctIndex":3,"explanation":"Radial velocity does not by itself reveal tangential motion."},{"id":78,"category":"Sensors, fusion, and tracking","question":"A pulsed LiDAR measures a round-trip travel time of 1 microsecond. With c\u22483\u00d710\u2078 m/s, what is the range?","options":["30 m","15 m","150 m","300 m"],"correctIndex":2,"explanation":"Range = c\u0394t/2; divide by two because the light travels to the target and back."},{"id":79,"category":"Sensors, fusion, and tracking","question":"An ideal accelerometer rests motionless on a table near Earth's surface. Ignoring bias, what is its measured specific-force magnitude?","options":["It grows linearly with time","Approximately 9.81 m/s\u00b2","0 m/s\u00b2","Approximately 19.62 m/s\u00b2"],"correctIndex":1,"explanation":"The table supplies the supporting force; an ideal accelerometer reads approximately zero in free fall."},{"id":80,"category":"Sensors, fusion, and tracking","question":"In the usual input/feature/decision-level taxonomy, what is early fusion?","options":["Training each modality and never combining them","Combining final independent detections","Combining raw or minimally processed sensor inputs","Combining only final tracking IDs"],"correctIndex":2,"explanation":"Fusion occurs before substantial modality-specific feature processing."},{"id":81,"category":"Sensors, fusion, and tracking","question":"In the same taxonomy, what is intermediate fusion?","options":["Combining learned features from different modalities","Combining only final class labels","Averaging final decisions only","Combining unprocessed inputs only"],"correctIndex":0,"explanation":"Feature-level fusion can learn interactions between sensor representations."},{"id":82,"category":"Sensors, fusion, and tracking","question":"In the same taxonomy, what is late fusion?","options":["Combining modality-specific predictions or decisions","Sharing only the training-data filenames","Concatenating raw input channels","Combining inputs before feature extraction"],"correctIndex":0,"explanation":"Each modality can make a prediction before a later combination step."},{"id":83,"category":"Sensors, fusion, and tracking","question":"A vehicle travels at 20 m/s. How far does it move during a 100 ms sensor timestamp mismatch?","options":["2 m","0.2 m","200 m","20 m"],"correctIndex":0,"explanation":"Displacement = speed \u00d7 time = 20\u00d70.1; synchronization matters even with correct spatial calibration."},{"id":84,"category":"Sensors, fusion, and tracking","question":"Which training approach specifically helps a fusion model cope with a missing sensor modality?","options":["Increase confidence whenever a sensor disappears","Train only with every sensor always present","Duplicate one modality and label it as the other","Simulate modality dropouts and provide missing-modality indicators"],"correctIndex":3,"explanation":"The model needs training and evaluation coverage for the missing-input situations it will encounter."},{"id":85,"category":"Sensors, fusion, and tracking","question":"What is a main reason to fuse camera and LiDAR features in a bird's-eye-view representation?","options":["To align information in a common spatial frame around the vehicle","To make all objects the same height","To eliminate the need for sensor calibration","To guarantee perfect depth estimates"],"correctIndex":0,"explanation":"A shared BEV representation supports spatial combination of complementary sensor information."},{"id":86,"category":"Sensors, fusion, and tracking","question":"In a linear Kalman filter with independent additive process noise, which is the predicted state-error covariance?","options":["P\u207b = FPF\u1d40 + Q","P\u207b = F + P + Q","P\u207b = R\u207b\u00b9","P\u207b = P \u2212 Q"],"correctIndex":0,"explanation":"F propagates the prior uncertainty; process-noise covariance Q adds uncertainty."},{"id":87,"category":"Sensors, fusion, and tracking","question":"For a scalar Kalman filter with H=1, prior variance P\u207b=4 and measurement-noise variance R=16, what is K?","options":["0.2","0.8","4","20"],"correctIndex":0,"explanation":"K = P\u207b/(P\u207b+R) = 4/20, so this noisy measurement receives relatively little weight."},{"id":88,"category":"Sensors, fusion, and tracking","question":"What is the innovation in a linear Kalman-filter measurement update?","options":["The elapsed time alone","z \u2212 Hx\u207b","The measurement covariance R alone","Hx\u207b \u2212 P"],"correctIndex":1,"explanation":"It is the observed measurement minus the measurement predicted from the prior state."},{"id":89,"category":"Sensors, fusion, and tracking","question":"How does an extended Kalman filter handle nonlinear transition and measurement models?","options":["Linearizes them locally using Jacobians","Replaces every distribution with a uniform distribution","Solves every nonlinear model exactly","Avoids all covariance calculations"],"correctIndex":0,"explanation":"The EKF propagates uncertainty using local linear approximations."},{"id":90,"category":"Sensors, fusion, and tracking","question":"What can happen if strongly correlated sensor errors are incorrectly treated as independent during fusion?","options":["The covariance must always increase","Uncertainty can be underestimated, producing overconfidence","The estimates become guaranteed unbiased","Correlation automatically disappears"],"correctIndex":1,"explanation":"Shared information may be counted twice if the cross-correlation is ignored."},{"id":91,"category":"Deployment and performance","question":"What is ONNX primarily used to represent?","options":["A GPU driver","An automatic proof of identical accuracy on all hardware","A model computation graph, operators, and parameters for interchange","A labeling interface"],"correctIndex":2,"explanation":"An ONNX model still needs a compatible execution backend."},{"id":92,"category":"Deployment and performance","question":"What is NVIDIA TensorRT primarily designed for?","options":["Collecting manual training labels","Providing source-control history","Replacing all training frameworks","Optimizing and running neural-network inference on NVIDIA hardware"],"correctIndex":3,"explanation":"It builds and executes optimized inference engines."},{"id":93,"category":"Deployment and performance","question":"If the same weights are stored as FP16 instead of FP32, what is their raw storage ratio, ignoring overhead?","options":["One half","Twice as much","One quarter","The same"],"correctIndex":0,"explanation":"FP16 uses 16 bits per value versus FP32's 32; this does not imply total runtime memory halves."},{"id":94,"category":"Deployment and performance","question":"In static post-training INT8 quantization, what is representative calibration data primarily used to estimate?","options":["The camera-to-LiDAR rotation","Activation ranges and quantization scales","A universally optimal batch size","The original ground-truth labels for every training sample"],"correctIndex":1,"explanation":"Representative ranges help choose mappings from real-valued activations to quantized values."},{"id":95,"category":"Deployment and performance","question":"Which check is essential after quantizing a perception model?","options":["Check only the model filename","Validate only that the model file is smaller","Re-evaluate task accuracy on representative held-out data","Assume accuracy is unchanged if export succeeded"],"correctIndex":2,"explanation":"Quantization changes numerical behavior, so successful conversion alone is insufficient."},{"id":96,"category":"Deployment and performance","question":"Why can a CPU timer around a CUDA model call underreport GPU execution time?","options":["CUDA kernels always execute instantaneously","GPU work is often asynchronous with respect to the CPU","CUDA automatically excludes all preprocessing","CPU clocks cannot measure milliseconds"],"correctIndex":1,"explanation":"Use appropriate synchronization for wall-clock timing, or CUDA events for device execution timing."},{"id":97,"category":"Deployment and performance","question":"Why warm up a model before measuring steady-state inference latency?","options":["To guarantee that every future input is cached","To remove all measurement variance","To separate one-time initialization and setup from steady-state work","To change the trained labels"],"correctIndex":2,"explanation":"Report cold-start latency separately when it matters."},{"id":98,"category":"Deployment and performance","question":"Why might setting many dense-model weights to zero fail to improve latency?","options":["Pruning always increases the parameter count","Zero-valued weights cannot be stored","Dense kernels may still perform the same computation","Every sparse model is necessarily slower"],"correctIndex":2,"explanation":"Speedups require exploitable structure and suitable kernels or hardware support."},{"id":99,"category":"Deployment and performance","question":"What is a common batching trade-off in online inference?","options":["Higher throughput may come with more latency while requests wait","Batching removes the need to measure latency","Batching guarantees lower peak memory","Higher throughput always means lower request latency"],"correctIndex":0,"explanation":"A batch can use hardware efficiently while delaying individual requests."},{"id":100,"category":"Deployment and performance","question":"At a target processing rate of 30 frames per second, what is the average time budget per frame for one serial processing path?","options":["About 33.3 ms","About 3.3 ms","About 300 ms","About 30 seconds"],"correctIndex":0,"explanation":"1/30 second \u2248 0.0333 second; other stages may need part of this budget."}]},{"stem":"ml_engineer_production_ai_systems","title":"Machine Learning Engineer","subtitle":"Production AI Systems","company":"NewNow","questions":[{"id":1,"category":"Python and numerical computing","question":"What does a Python generator provide when processing a large event file?","options":["Lazy iteration","Guaranteed constant processing time","Immutable records","Automatic parallel execution"],"correctIndex":0,"explanation":"Values are produced on demand, reducing the need to store the entire sequence."},{"id":2,"category":"Python and numerical computing","question":"Why use a context manager when opening a data file?","options":["It closes the resource on normal exit and exceptions","It encrypts the file","It validates every row","It makes reads asynchronous"],"correctIndex":0,"explanation":"The context manager handles cleanup even when processing raises an exception."},{"id":3,"category":"Python and numerical computing","question":"Two lists reference the same nested dictionary. What does a shallow outer copy preserve?","options":["A shared reference to that dictionary","A serialized dictionary","A frozen dictionary","A recursively independent dictionary"],"correctIndex":0,"explanation":"A shallow copy copies only the outer container; nested mutable objects remain shared."},{"id":4,"category":"Python and numerical computing","question":"NumPy arrays have shapes (8, 1) and (1, 5). What is the shape of their elementwise sum?","options":["(8, 5)","(8, 1)","(1, 5)","(13,)"],"correctIndex":0,"explanation":"Broadcasting expands dimensions of size one to the corresponding non-singleton sizes."},{"id":5,"category":"Python and numerical computing","question":"Which operation best removes a Python loop over numeric array elements?","options":["Adding a try/except block","Converting the array to strings","A suitable vectorized NumPy operation","Replacing the list with a tuple"],"correctIndex":2,"explanation":"Vectorization moves work to compiled array kernels, although memory use still matters."},{"id":6,"category":"Python and numerical computing","question":"A pipeline function catches every exception and returns an empty table. What is the main risk?","options":["Failures become indistinguishable from valid empty results","Every exception gets retried","The table becomes immutable","CPU usage necessarily doubles"],"correctIndex":0,"explanation":"Preserve error context so downstream stages do not silently treat failure as valid data."},{"id":7,"category":"Python and numerical computing","question":"Which dictionary key is valid in ordinary Python?","options":["A tuple of integers","A mutable set of integers","A dictionary of integers","A list of integers"],"correctIndex":0,"explanation":"A tuple of hashable values is hashable; the other listed containers are mutable and unhashable."},{"id":8,"category":"Python and numerical computing","question":"What does a Python type annotation guarantee by itself at runtime?","options":["No automatic enforcement of the annotated type","Validation of nested objects","Rejection of incompatible values","Conversion to that type"],"correctIndex":0,"explanation":"Type hints support tooling; explicit runtime validation is a separate responsibility."},{"id":9,"category":"Python and numerical computing","question":"A function uses an empty list as its default argument and appends to it. What can happen?","options":["Each call gets a new list","Python rejects the function","Later calls reuse the modified list","The list becomes read-only"],"correctIndex":2,"explanation":"Default expressions are evaluated when the function is defined, not at each call."},{"id":10,"category":"Python and numerical computing","question":"Why is a set useful for repeated membership checks over identifiers?","options":["It preserves duplicate counts","It always retains insertion order","Average lookup is constant time under normal hashing","Its worst-case lookup is logarithmic"],"correctIndex":2,"explanation":"Hash-based membership is normally O(1); sets do not preserve multiplicity."},{"id":11,"category":"PyTorch training and debugging","question":"What does model.eval() change independently of gradient recording?","options":["Every tensor to CPU memory","Training-dependent behavior such as dropout","The optimizer learning rate","All parameters to constants"],"correctIndex":1,"explanation":"Evaluation mode controls layer behavior. Use a separate no-grad context when gradients are unnecessary."},{"id":12,"category":"PyTorch training and debugging","question":"A leaf parameter already has a gradient. What does another backward pass normally do?","options":["Replaces the parameter value","Adds to its existing gradient","Updates the optimizer state","Clears the previous gradient first"],"correctIndex":1,"explanation":"PyTorch accumulates gradients, so clearing or deliberate accumulation must be managed explicitly."},{"id":13,"category":"PyTorch training and debugging","question":"What should a standard multiclass cross-entropy loss receive as model input?","options":["One-hot predictions","Predicted class indices","Rounded probabilities","Unnormalized logits"],"correctIndex":3,"explanation":"The loss applies the needed log-softmax internally; class indices are commonly used as targets."},{"id":14,"category":"PyTorch training and debugging","question":"What does x.detach() remove?","options":["The tensor's numeric precision","All shared storage","The autograd connection to x's history","The batch dimension"],"correctIndex":2,"explanation":"Detaching stops gradient propagation through that connection but does not make an independent data copy."},{"id":15,"category":"PyTorch training and debugging","question":"Why can a view operation fail after a tensor transpose?","options":["Transpose always deletes data","Views require integer tensors","The strides may be incompatible with the requested view","The tensor must have a gradient"],"correctIndex":2,"explanation":"A reshape may copy when needed; a contiguous copy can also provide compatible storage."},{"id":16,"category":"PyTorch training and debugging","question":"When clipping gradients during loss-scaled mixed-precision training, what comes first?","options":["Update parameters before backward","Reinitialize the scaler each step","Unscale the optimizer's gradients","Clip the scaled loss value"],"correctIndex":2,"explanation":"Clipping should use the true gradient magnitudes before the optimizer update."},{"id":17,"category":"PyTorch training and debugging","question":"Why might saving live loss tensors in a Python list grow GPU memory?","options":["Lists always copy model weights","Losses require a new optimizer","The tensors may retain computation graphs","GPU memory cannot be reused"],"correctIndex":2,"explanation":"Store detached values for logging when the graph is no longer needed."},{"id":18,"category":"PyTorch training and debugging","question":"What is the output shape of a linear layer mapping 32 features to 7, given input (16, 32)?","options":["(16, 32, 7)","(7, 16)","(16, 7)","(32, 7)"],"correctIndex":2,"explanation":"The batch dimension is preserved and the last feature dimension becomes seven."},{"id":19,"category":"PyTorch training and debugging","question":"Why first try to overfit a tiny fixed batch when debugging training?","options":["To choose deployment hardware","To test whether the model and training loop can learn at all","To eliminate label noise globally","To establish final generalization"],"correctIndex":1,"explanation":"Failure on a tiny batch often exposes target, gradient, loss, or optimization mistakes."},{"id":20,"category":"PyTorch training and debugging","question":"Which checkpoint best supports resuming interrupted training?","options":["A random seed without weights","Model weights only","Model, optimizer, scheduler, step, and relevant RNG states","Training accuracy only"],"correctIndex":2,"explanation":"Resumption needs both learned parameters and the evolving training state."},{"id":21,"category":"ML evaluation and generalization","question":"Where should a feature scaler be fitted during cross-validation?","options":["On the final test set","On each validation partition","Once on all rows","On each fold's training partition"],"correctIndex":3,"explanation":"Fitting inside each training fold prevents validation information from entering preprocessing."},{"id":22,"category":"ML evaluation and generalization","question":"A classifier has 90 true positives and 30 false positives. What is precision?","options":["90%","25%","30%","75%"],"correctIndex":3,"explanation":"Precision is 90 divided by 120 predicted positives."},{"id":23,"category":"ML evaluation and generalization","question":"A model finds 72 of 90 actual positive cases. What is recall?","options":["80%","90%","125%","72%"],"correctIndex":0,"explanation":"Recall divides true positives by all actual positives: 72/90."},{"id":24,"category":"ML evaluation and generalization","question":"What split best estimates performance on entirely new customers with many records per customer?","options":["Sort rows by target value","Randomly split individual records","Group the split by customer","Put every customer in every split"],"correctIndex":2,"explanation":"Group separation prevents memorized customer-specific patterns from inflating evaluation."},{"id":25,"category":"ML evaluation and generalization","question":"Training error falls while validation error rises. What is the most likely explanation?","options":["An unbiased test estimate","Overfitting","Perfect calibration","Insufficient model capacity in every case"],"correctIndex":1,"explanation":"The model fits training-specific patterns that do not generalize to the validation data."},{"id":26,"category":"ML evaluation and generalization","question":"When positive cases are rare, which curve focuses on positive prediction quality and coverage?","options":["Residual versus fitted value","Precision-recall","Training-loss versus epoch","Learning-rate versus step"],"correctIndex":1,"explanation":"Precision-recall exposes the trade-off between false positives and missed positives."},{"id":27,"category":"ML evaluation and generalization","question":"A model predicts 0.7 for many cases. What observation supports calibration?","options":["Their accuracy is exactly 100%","About 70% of those cases are positive","Their ranking is always correct","All are classified positive"],"correctIndex":1,"explanation":"Calibration compares predicted probabilities with empirical outcome frequencies."},{"id":28,"category":"ML evaluation and generalization","question":"Why keep a final test set separate from repeated model selection?","options":["It removes every source of bias","Repeated selection can overfit validation results","It guarantees future stationarity","Test labels must never exist"],"correctIndex":1,"explanation":"An untouched final test provides a less selection-biased assessment of the chosen procedure."},{"id":29,"category":"ML evaluation and generalization","question":"For squared-error regression, which constant prediction minimizes training loss?","options":["Zero regardless of targets","The training target mean","The largest target","The training target median"],"correctIndex":1,"explanation":"The derivative of the sum of squared errors vanishes at the arithmetic mean."},{"id":30,"category":"ML evaluation and generalization","question":"Which comparison demonstrates a useful model beyond a simple heuristic?","options":["Showing only training loss","Comparing different test sets","Reporting parameter count","Evaluation against a credible baseline on the same held-out data"],"correctIndex":3,"explanation":"A common evaluation set isolates whether the added complexity improves the relevant outcome."},{"id":31,"category":"Model APIs and service contracts","question":"What should an inference endpoint do with a request missing a required feature?","options":["Return the last user's prediction","Return a clear validation error","Retry indefinitely","Silently invent the value"],"correctIndex":1,"explanation":"A clear input contract prevents hidden assumptions from changing model behavior."},{"id":32,"category":"Model APIs and service contracts","question":"What does an idempotency key help prevent when a client retries a job submission?","options":["All network failures","Duplicate execution of the same intended operation","Expired authentication","Model drift"],"correctIndex":1,"explanation":"The service can recognize a repeated request and reuse its recorded result or job."},{"id":33,"category":"Model APIs and service contracts","question":"Which change is most likely to break an existing prediction API client?","options":["Adding optional documentation","Improving server logging","Reducing internal memory allocation","Renaming a required response field without compatibility"],"correctIndex":3,"explanation":"Clients depend on the documented response schema; incompatible changes need a migration strategy."},{"id":34,"category":"Model APIs and service contracts","question":"Why is a long-running training job often exposed as a job ID plus a status endpoint?","options":["HTTP cannot return numbers","Polling eliminates authentication","A job ID trains faster","The work outlives a normal request timeout"],"correctIndex":3,"explanation":"Asynchronous job contracts separate acceptance from execution and completion."},{"id":35,"category":"Model APIs and service contracts","question":"What should a readiness check establish for a model-serving instance?","options":["The instance can accept useful traffic","The operating system has booted","The training set is available","A log file exists"],"correctIndex":0,"explanation":"A live process may still lack a loaded model or a required dependency."},{"id":36,"category":"Model APIs and service contracts","question":"A dependency slows down severely. Which mechanism limits waiting resources?","options":["An unbounded request queue","A bounded timeout with a controlled failure path","A larger JSON payload","Unlimited retries"],"correctIndex":1,"explanation":"Timeouts bound resource occupation; fallback and retry policies should match the operation."},{"id":37,"category":"Model APIs and service contracts","question":"What is backpressure in a streaming inference service?","options":["Deleting every delayed result","Returning more verbose errors","Automatically lowering all model weights","Slowing intake when downstream capacity is exhausted"],"correctIndex":3,"explanation":"Backpressure prevents unbounded accumulation when producers outrun consumers."},{"id":38,"category":"Model APIs and service contracts","question":"Why include a model version in prediction records?","options":["To reduce input size","To avoid validation entirely","To trace outcomes to the model that produced them","To guarantee calibration"],"correctIndex":2,"explanation":"Version attribution is essential for audits, debugging, and comparing deployment cohorts."},{"id":39,"category":"Model APIs and service contracts","question":"A server uses an asynchronous route. What happens if it runs blocking CPU work on the event-loop thread?","options":["Other requests may be delayed","All workers gain more memory","The work becomes GPU accelerated","Blocking is automatically removed"],"correctIndex":0,"explanation":"Async syntax alone does not make blocking computation non-blocking."},{"id":40,"category":"Model APIs and service contracts","question":"Which service boundary belongs in a model API even when the caller is internal?","options":["Secrets embedded in responses","Implicit trust in any request","Authentication and authorization appropriate to the data","Unrestricted filesystem paths"],"correctIndex":2,"explanation":"Internal deployment does not remove the need to control who may perform which actions."},{"id":41,"category":"Data pipelines and reproducibility","question":"What makes a training dataset version reproducible?","options":["A screenshot of row counts","A mutable query without a timestamp","A folder named latest","A stable snapshot or manifest with transformations recorded"],"correctIndex":3,"explanation":"Reproduction requires identifying the exact data and processing steps used."},{"id":42,"category":"Data pipelines and reproducibility","question":"An ingestion job runs twice on the same input. Which property prevents duplicate records?","options":["Disabling transaction logs","Appending without checks","Idempotent writes using stable keys","Random record identifiers"],"correctIndex":2,"explanation":"Stable identity and deduplication or upsert logic make retries safe."},{"id":43,"category":"Data pipelines and reproducibility","question":"Which timestamp should define a historical feature's availability?","options":["When a future correction is published","The end of the target window","When the system could actually know it","When the model is evaluated"],"correctIndex":2,"explanation":"Point-in-time correctness requires using information available before the prediction decision."},{"id":44,"category":"Data pipelines and reproducibility","question":"What does a schema contract detect before training?","options":["Every causal confounder","Unexpected names, types, and required fields","Guaranteed model calibration","All mislabeled examples"],"correctIndex":1,"explanation":"Schema validation catches structural data changes, while semantic checks remain necessary."},{"id":45,"category":"Data pipelines and reproducibility","question":"Why track lineage from a prediction back to source data?","options":["To ensure zero drift","To investigate how inputs and transformations produced it","To replace all model evaluation","To avoid access control"],"correctIndex":1,"explanation":"Lineage records dependencies and transformations, supporting debugging and review."},{"id":46,"category":"Data pipelines and reproducibility","question":"What is a common danger of fitting missing-value imputation before splitting data?","options":["Missing values are restored exactly","All categorical values disappear","The model becomes deterministic","Validation information can influence training transforms"],"correctIndex":3,"explanation":"Even preprocessing statistics can leak information across the evaluation boundary."},{"id":47,"category":"Data pipelines and reproducibility","question":"Why use separate raw and curated data layers?","options":["To make all records public","To avoid versioning","To retain an auditable source and reproducible transformations","To guarantee half the storage cost"],"correctIndex":2,"explanation":"Raw retention allows corrections and reprocessing without losing the original evidence."},{"id":48,"category":"Data pipelines and reproducibility","question":"A streaming consumer commits progress before durably storing results. What failure can follow?","options":["Guaranteed duplicate outputs only","Lost results after a crash","Automatic transaction recovery across all systems","Faster model convergence"],"correctIndex":1,"explanation":"Progress and output commits must be coordinated to avoid acknowledging work that was not saved."},{"id":49,"category":"Data pipelines and reproducibility","question":"What should a backfill preserve when recomputing historical features?","options":["Random event ordering","Today's future labels in all rows","Historical availability and the intended feature definition","Only the newest customer state"],"correctIndex":2,"explanation":"Recomputed features must not gain future information that was unavailable at the original decision time."},{"id":50,"category":"Data pipelines and reproducibility","question":"Which first check helps diagnose a sudden drop in daily training rows?","options":["Increase model depth","Compare source counts and rejection counts by pipeline stage","Change the optimizer","Disable validation permanently"],"correctIndex":1,"explanation":"Stage-level counts locate where records stopped arriving or were filtered out."},{"id":51,"category":"Testing, reviews, and CI/CD","question":"What is the strongest unit test for an input normalizer?","options":["Known inputs with independently expected outputs","Checking only that a function exists","Repeating the same implementation in the test","Training a large model"],"correctIndex":0,"explanation":"A useful test checks observable behavior against an independent expectation."},{"id":52,"category":"Testing, reviews, and CI/CD","question":"What does an integration test of an inference service exercise?","options":["Only one arithmetic helper","Only documentation spelling","The entire market response","Interactions among preprocessing, model, and response handling"],"correctIndex":3,"explanation":"Integration tests expose mismatches at component boundaries that isolated tests miss."},{"id":53,"category":"Testing, reviews, and CI/CD","question":"Why include malformed and boundary inputs in API tests?","options":["To replace all load testing","To verify controlled failures as well as valid behavior","To guarantee absence of attacks","To improve training accuracy directly"],"correctIndex":1,"explanation":"Real callers send empty, oversized, missing, or invalid values; handling them is part of the contract."},{"id":54,"category":"Testing, reviews, and CI/CD","question":"Which artifact should a deployment promote after CI passes?","options":["Any image tagged latest","A developer's current notebook","A freshly rebuilt untracked image","The exact tested build with an immutable identifier"],"correctIndex":3,"explanation":"Rebuilding without identity can deploy something different from what was validated."},{"id":55,"category":"Testing, reviews, and CI/CD","question":"What does a contract test most directly detect?","options":["Hardware overheating","All statistical model errors","Data drift without labels","Incompatibility between a provider and its consumers"],"correctIndex":3,"explanation":"Contract tests verify assumptions about shared schemas and interface behavior."},{"id":56,"category":"Testing, reviews, and CI/CD","question":"A stochastic model test fails rarely. What is a better response than ignoring it?","options":["Run only on the author's laptop","Increase random seeds until one passes","Remove all assertions","Isolate randomness and test meaningful tolerances"],"correctIndex":3,"explanation":"Control known randomness and choose tolerances justified by the property being tested."},{"id":57,"category":"Testing, reviews, and CI/CD","question":"What should code review prioritize in an AI-generated data transformation?","options":["Correctness, edge cases, and data assumptions","The number of generated lines","Whether the code looks familiar","The tool's confident wording"],"correctIndex":0,"explanation":"Generated code needs the same independent verification as any other contribution."},{"id":58,"category":"Testing, reviews, and CI/CD","question":"Why separate fast deterministic CI checks from expensive benchmark runs?","options":["To make GPU runs deterministic automatically","To bypass approval rules","To give quick feedback while retaining deeper validation","To avoid model evaluation forever"],"correctIndex":2,"explanation":"Different checks have different costs; both can contribute to a defined release process."},{"id":59,"category":"Testing, reviews, and CI/CD","question":"What is a regression test intended to catch?","options":["Every unknown future requirement","Reappearance of a previously fixed failure","Any change in file size","Only syntax errors"],"correctIndex":1,"explanation":"A regression case preserves the expected behavior associated with a known defect."},{"id":60,"category":"Testing, reviews, and CI/CD","question":"Which evidence should block release of a supposedly improved model?","options":["A different random seed","A material regression on a required safety or business metric","A lower training loss","A shorter model name"],"correctIndex":1,"explanation":"Release criteria should include critical outcomes and guardrails, not just a headline improvement."},{"id":61,"category":"Deployment and operational reliability","question":"What distinguishes a canary deployment?","options":["Every user switches simultaneously","It skips production monitoring","It runs only on training data","A small traffic share receives the new version first"],"correctIndex":3,"explanation":"Limited exposure lets the team inspect behavior before broad rollout."},{"id":62,"category":"Deployment and operational reliability","question":"What is a shadow deployment?","options":["The new model receives copied traffic without controlling user outcomes","The model is trained without labels","Two models randomly split outcomes equally","The old model is removed"],"correctIndex":0,"explanation":"Shadowing measures behavior on real inputs while the existing system remains responsible for results."},{"id":63,"category":"Deployment and operational reliability","question":"Which rollback preparation is most useful?","options":["A compatible previous artifact plus tested routing and schema recovery","A deleted previous model","Only an old screenshot","A verbal promise to retrain"],"correctIndex":0,"explanation":"Rollback depends on artifacts, interfaces, and data compatibility, not just code history."},{"id":64,"category":"Deployment and operational reliability","question":"Why pin a container image by digest for a release?","options":["Tags never change","The digest identifies immutable image content","It guarantees hardware compatibility","It removes the need for tests"],"correctIndex":1,"explanation":"A digest prevents a mutable tag from silently referring to different content."},{"id":65,"category":"Deployment and operational reliability","question":"What usually improves resilience to a failed inference replica?","options":["A single larger process","Disabling health checks","A longer response schema","Multiple healthy replicas with suitable routing"],"correctIndex":3,"explanation":"Redundancy helps only if requests can reach healthy capacity and dependencies also remain available."},{"id":66,"category":"Deployment and operational reliability","question":"Why keep secrets outside a container image?","options":["Images cannot contain text","Environment settings are always public","Images can be copied and inspected beyond the running service","Secrets prevent GPU use"],"correctIndex":2,"explanation":"Use an appropriate secret store and controlled runtime access rather than embedding credentials."},{"id":67,"category":"Deployment and operational reliability","question":"What can excessive automatic retries do during an outage?","options":["Eliminate duplicate requests","Amplify load and delay recovery","Guarantee eventual success","Reduce all latency tails"],"correctIndex":1,"explanation":"Retry budgets, backoff, jitter, and idempotency limit retry storms."},{"id":68,"category":"Deployment and operational reliability","question":"Which autoscaling signal often captures queue overload better than CPU alone?","options":["Queue depth or waiting time","Model parameter count","Number of source files","Dataset license length"],"correctIndex":0,"explanation":"GPU-bound or dependency-bound services can build queues without high CPU utilization."},{"id":69,"category":"Deployment and operational reliability","question":"Why evaluate a model on the actual deployment hardware?","options":["Operators, precision, memory, and runtime behavior can differ","All CPUs match all GPUs","Export always improves latency","Training accuracy disappears on export"],"correctIndex":0,"explanation":"Portability of a model file does not guarantee equivalent accuracy or performance."},{"id":70,"category":"Deployment and operational reliability","question":"What should an incident runbook specify?","options":["Detection, ownership, mitigation, and recovery checks","Only a list of model papers","A mandatory full retrain for every error","Only a screenshot of the dashboard"],"correctIndex":0,"explanation":"A useful runbook helps responders make bounded, verifiable decisions under time pressure."},{"id":71,"category":"Latency, profiling, and efficiency","question":"Why can CPU wall-clock timing understate a CUDA call's execution time?","options":["GPU clocks always run slower","CPU timers count only instructions","CUDA removes all synchronization","GPU execution is asynchronous"],"correctIndex":3,"explanation":"Use appropriate synchronization or device events to measure completed GPU work."},{"id":72,"category":"Latency, profiling, and efficiency","question":"What does p95 latency describe?","options":["Maximum latency","The mean of the slowest 95 requests","Average GPU utilization","A threshold met by approximately 95% of requests"],"correctIndex":3,"explanation":"A percentile exposes tail behavior that a mean can hide."},{"id":73,"category":"Latency, profiling, and efficiency","question":"A serial inference stage takes 20 ms per item. Ignoring overhead, what is its maximum throughput?","options":["500 items/s","20 items/s","200 items/s","50 items/s"],"correctIndex":3,"explanation":"One second divided by 0.020 seconds gives 50 items."},{"id":74,"category":"Latency, profiling, and efficiency","question":"Why can larger batches hurt interactive response time?","options":["They necessarily change labels","They always reduce throughput","Requests may wait longer for a batch","They remove parallelism"],"correctIndex":2,"explanation":"Hardware efficiency and per-request waiting time are different objectives."},{"id":75,"category":"Latency, profiling, and efficiency","question":"Half of runtime can be accelerated by 4x. What is the total speedup under Amdahl's model?","options":["2x","1.6x","4x","8x"],"correctIndex":1,"explanation":"New relative time is 0.5 + 0.5/4 = 0.625; speedup is its reciprocal."},{"id":76,"category":"Latency, profiling, and efficiency","question":"What should be measured separately from warmed-up inference?","options":["Training epoch numbering","Number of Git branches","Cold-start latency","Alphabetical model order"],"correctIndex":2,"explanation":"Loading, initialization, and compilation can dominate the first request."},{"id":77,"category":"Latency, profiling, and efficiency","question":"Why might pruning weights to zero leave latency unchanged?","options":["Dense kernels still execute dense operations","A sparse model cannot run on GPUs","Pruning always changes batch size","Zero values use twice the memory"],"correctIndex":0,"explanation":"Practical speedups require supported sparsity structure and efficient kernels."},{"id":78,"category":"Latency, profiling, and efficiency","question":"What is a frequent cost of moving tensors between CPU and GPU inside every layer?","options":["Transfer and synchronization overhead","Automatic loss scaling","Reduced input size","Better statistical calibration"],"correctIndex":0,"explanation":"Repeated device transfers can dominate otherwise fast computation."},{"id":79,"category":"Latency, profiling, and efficiency","question":"Which first action best addresses a suspected performance bottleneck?","options":["Rewrite every function in C++","Double every timeout","Quantize without evaluation","Profile a representative workload"],"correctIndex":3,"explanation":"Measurement identifies the actual limiting stage before optimization effort is spent."},{"id":80,"category":"Latency, profiling, and efficiency","question":"FP32 weights occupy 400 MB. Ignoring metadata, how much do the same weights occupy in FP16?","options":["800 MB","100 MB","400 MB","200 MB"],"correctIndex":3,"explanation":"Halving bits per stored weight halves raw weight storage, not necessarily total runtime memory."},{"id":81,"category":"Transformers and representation learning","question":"What determines the number of pairwise entries in dense attention over N tokens?","options":["N squared","A constant independent of N","N","Log N"],"correctIndex":0,"explanation":"Every query can interact with every key, forming an N by N score matrix."},{"id":82,"category":"Transformers and representation learning","question":"Why divide attention dot products by the square root of key dimension?","options":["To remove position information","To double context length","To enforce binary attention","To moderate their scale"],"correctIndex":3,"explanation":"Scaling helps prevent excessively large logits and saturated softmax values."},{"id":83,"category":"Transformers and representation learning","question":"What does a causal attention mask prevent?","options":["Access to future tokens","Learning embeddings","Access to earlier tokens","Updating any weights"],"correctIndex":0,"explanation":"Autoregressive prediction must not inspect the target's future context."},{"id":84,"category":"Transformers and representation learning","question":"In cross-attention, what can come from a different modality than the queries?","options":["Keys and values","Only the optimizer state","Only the positional indices","Only the learning rate"],"correctIndex":0,"explanation":"Cross-attention lets one stream read information represented by another."},{"id":85,"category":"Transformers and representation learning","question":"Why add positional information to ordinary self-attention?","options":["Attention alone lacks an explicit token-order signal","It guarantees grammatical output","It removes all computation","It replaces token embeddings"],"correctIndex":0,"explanation":"Token positions need representation when the task depends on ordering or geometry."},{"id":86,"category":"Transformers and representation learning","question":"A 256 by 256 image uses 16 by 16 non-overlapping patches. How many patch tokens result?","options":["4096","256","32","16"],"correctIndex":1,"explanation":"There are 16 patches per side, giving 16 times 16 tokens."},{"id":87,"category":"Transformers and representation learning","question":"What does a residual connection provide to gradient flow?","options":["A replacement for the loss","An additional direct path","A fixed attention distribution","A guarantee against overfitting"],"correctIndex":1,"explanation":"The identity path helps optimization through deep compositions."},{"id":88,"category":"Transformers and representation learning","question":"What does contrastive learning encourage for matched image-text pairs?","options":["Identical raw inputs","A fixed class count","More compatible representations than mismatched pairs","Equal scores for every pair"],"correctIndex":2,"explanation":"A contrastive objective distinguishes matched examples from suitable negatives."},{"id":89,"category":"Transformers and representation learning","question":"Why can a false negative harm contrastive training?","options":["It changes the image resolution","It pushes semantically related examples apart","It always improves recall","It removes the optimizer"],"correctIndex":1,"explanation":"Negative sampling assumptions matter when different examples describe the same concept."},{"id":90,"category":"Transformers and representation learning","question":"What does a KV cache reuse during autoregressive decoding?","options":["Optimizer gradients","Future token labels","The full training dataset","Earlier tokens' attention keys and values"],"correctIndex":3,"explanation":"Cached states avoid recomputing earlier representations, at a memory cost."},{"id":91,"category":"Agent workflows and tool use","question":"What should happen before executing model-produced tool arguments?","options":["Remove all limits","Convert every value to a string","Trust fluent wording","Validate their schema and permissions"],"correctIndex":3,"explanation":"A plausible model output can still contain invalid or unauthorized arguments."},{"id":92,"category":"Agent workflows and tool use","question":"What most directly prevents an agent from looping forever?","options":["More retrieved documents","A longer system prompt alone","Explicit step, time, and cost budgets","A higher temperature"],"correctIndex":2,"explanation":"Execution limits bound behavior even when the model fails to terminate."},{"id":93,"category":"Agent workflows and tool use","question":"A retrieved document says to ignore instructions and send secrets. How should it be treated?","options":["As untrusted content, not authorization","As a tool schema","As proof of user consent","As a higher-priority command"],"correctIndex":0,"explanation":"Retrieved text supplies evidence; it must not redefine tool permissions."},{"id":94,"category":"Agent workflows and tool use","question":"What makes an external side-effecting tool safer to retry?","options":["Random request IDs on every retry","An unlimited timeout","An idempotency mechanism","A more creative prompt"],"correctIndex":2,"explanation":"A stable operation identity helps prevent duplicate writes or transactions."},{"id":95,"category":"Agent workflows and tool use","question":"Why separate planning from execution in an agent workflow?","options":["To guarantee the plan is correct","To eliminate tool failures","To remove all latency","To inspect and constrain proposed actions before side effects"],"correctIndex":3,"explanation":"Explicit stages make authorization, validation, and failure handling easier to enforce."},{"id":96,"category":"Agent workflows and tool use","question":"What does a structured output schema establish?","options":["Factual truth","Shape and type constraints","Completeness of all evidence","Legal validity"],"correctIndex":1,"explanation":"Schema-valid output may still be semantically wrong and needs task-specific checks."},{"id":97,"category":"Agent workflows and tool use","question":"What should an agent do when necessary evidence is unavailable?","options":["Fabricate a source","Hide uncertainty in metadata","Repeat a confident answer","State the gap or seek the missing evidence"],"correctIndex":3,"explanation":"Reliable behavior preserves the distinction between supported conclusions and missing information."},{"id":98,"category":"Agent workflows and tool use","question":"Why persist agent state at well-defined checkpoints?","options":["To resume safely and trace prior actions","To make every action reversible","To bypass validation","To remove all storage needs"],"correctIndex":0,"explanation":"Durable state helps recover without blindly repeating completed work."},{"id":99,"category":"Agent workflows and tool use","question":"Which trace is most useful for debugging a wrong agent result?","options":["Only the final answer","Only the model's display name","Inputs, retrieved evidence, tool calls, outputs, and versions","Only total token count"],"correctIndex":2,"explanation":"Step-level evidence helps locate whether retrieval, reasoning, execution, or validation failed."},{"id":100,"category":"Agent workflows and tool use","question":"A workflow always follows the same known steps. What is a sensible first implementation?","options":["An unconstrained autonomous loop","A tool with unrestricted shell access","A deterministic pipeline with bounded model calls","A new model trained from scratch"],"correctIndex":2,"explanation":"Use predictable control flow when the task does not require open-ended action selection."}]},{"stem":"founding_research_engineer_domain_adaptive_ai_agents","title":"Founding Research Engineer / Scientist","subtitle":"Domain-Adaptive AI & Agents","company":"Grubel","questions":[{"id":1,"category":"Training-data curation","question":"What should be established before creating a training set from evaluation examples?","options":["That every test item is copied into training","A separate protected evaluation boundary","That labels are hidden from reviewers","That the model has maximum context"],"correctIndex":1,"explanation":"Learning from evaluation feedback requires new held-out evidence to avoid contaminated conclusions."},{"id":2,"category":"Training-data curation","question":"Why split document families together when building a benchmark?","options":["Every document is independent","Related versions can leak answers across splits","Document length determines all labels","Grouping guarantees no bias"],"correctIndex":1,"explanation":"Drafts, amendments, and near-duplicates often share enough content to make random splits optimistic."},{"id":3,"category":"Training-data curation","question":"What is the risk of training mostly on a teacher model's confident outputs?","options":["Replicating systematic teacher errors","Automatic coverage of rare tasks","Elimination of selection bias","Guaranteed independent ground truth"],"correctIndex":0,"explanation":"Confidence is not proof of correctness; synthetic labels need targeted quality checks."},{"id":4,"category":"Training-data curation","question":"What should a curation rubric define?","options":["Only total dataset size","Inclusion, exclusion, labeling, and ambiguity rules","Only the optimizer","Only the training seed"],"correctIndex":1,"explanation":"Consistent criteria make data selection reviewable and reproducible."},{"id":5,"category":"Training-data curation","question":"Why retain source provenance for synthetic tasks?","options":["To make source access unrestricted","To trace their grounding and detect contamination","To avoid all validation","To guarantee every answer is correct"],"correctIndex":1,"explanation":"Knowing the parent evidence helps audit quality and separation between datasets."},{"id":6,"category":"Training-data curation","question":"How can active learning allocate expert review effort?","options":["Label only the easiest examples forever","Prioritize informative or uncertain examples","Randomly delete hard cases","Replace every expert label with a guess"],"correctIndex":1,"explanation":"Selection can focus scarce annotation effort, with checks for sampling bias."},{"id":7,"category":"Training-data curation","question":"What does low inter-annotator agreement suggest first?","options":["The model must be too small","More GPU memory is required","The task or rubric may be ambiguous","One annotator must be dishonest"],"correctIndex":2,"explanation":"Review disagreements and clarify definitions before treating all labels as definitive."},{"id":8,"category":"Training-data curation","question":"Why inspect label distributions after filtering a dataset?","options":["Every group should have identical prevalence","Dataset size alone proves quality","Quality filters can unintentionally remove important groups or tasks","Filters cannot affect balance"],"correctIndex":2,"explanation":"Cleaning may improve average quality while narrowing coverage."},{"id":9,"category":"Training-data curation","question":"What is a useful contamination search?","options":["Count folders","Sort by creation time","Compare only file extensions","Look for exact and semantic overlap with protected test tasks"],"correctIndex":3,"explanation":"Reworded or reformatted copies can leak evaluation content without identical bytes."},{"id":10,"category":"Training-data curation","question":"Why version both selection code and the selected-data manifest?","options":["It removes all stochasticity","A changed rule and changed inputs can produce different training sets","Code versions guarantee fixed inputs","A manifest makes source code irrelevant"],"correctIndex":1,"explanation":"Reproducibility needs the procedure and its actual selected inputs."},{"id":11,"category":"Retrieval-augmented generation","question":"What is the central role of retrieval in a RAG pipeline?","options":["Replace access control","Guarantee every answer is true","Update all model weights per query","Supply relevant external evidence to generation"],"correctIndex":3,"explanation":"Retrieved evidence can support an answer, but quality and grounding still require evaluation."},{"id":12,"category":"Retrieval-augmented generation","question":"Why combine lexical and dense retrieval?","options":["Either guarantees perfect recall","Their scores are always directly comparable","They eliminate chunking","They can recover complementary exact and semantic matches"],"correctIndex":3,"explanation":"Exact terms and semantic paraphrases have different retrieval strengths."},{"id":13,"category":"Retrieval-augmented generation","question":"What is a common chunk-size trade-off?","options":["Larger chunks always improve every metric","Context completeness versus retrieval specificity and budget","Smaller chunks guarantee correct answers","Chunk size changes user permissions"],"correctIndex":1,"explanation":"A chunk should preserve useful context without overwhelming the downstream prompt."},{"id":14,"category":"Retrieval-augmented generation","question":"What does a reranker do after initial retrieval?","options":["Trains the base LLM automatically","Guarantees citation support","Changes source permissions","Reorders candidates using a stronger relevance estimate"],"correctIndex":3,"explanation":"Reranking can improve ordering but depends on the candidates already retrieved."},{"id":15,"category":"Retrieval-augmented generation","question":"What does recall@k measure for retrieval?","options":["The number of unique users","The average API latency","The fraction of generated words that are correct","The fraction of relevant items recovered in the top k"],"correctIndex":3,"explanation":"Retrieval recall measures evidence coverage, distinct from answer quality."},{"id":16,"category":"Retrieval-augmented generation","question":"What should happen when a source document changes?","options":["Rename only the display title","Update or invalidate its derived chunks and embeddings","Retrain the entire LLM automatically","Keep stale embeddings forever"],"correctIndex":1,"explanation":"Index content must track the source version used for answers."},{"id":17,"category":"Retrieval-augmented generation","question":"Why retain stable source offsets or identifiers with chunks?","options":["To reduce all embedding dimensions","To avoid storing text","To reconstruct and verify citations","To guarantee passage truth"],"correctIndex":2,"explanation":"Citation provenance needs a reliable link back to the exact supporting content."},{"id":18,"category":"Retrieval-augmented generation","question":"What is
