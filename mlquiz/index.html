the risk of increasing top-k without testing?","options":["Latency always falls","More irrelevant evidence can distract generation and raise cost","Every answer becomes shorter","Recall must decrease"],"correctIndex":1,"explanation":"Retrieval breadth should be tuned against relevance, context budget, and end-to-end results."},{"id":19,"category":"Retrieval-augmented generation","question":"What should a permission-aware retrieval system filter?","options":["Only long documents","Only documents with low similarity","Only old model outputs","Documents the user is allowed to access"],"correctIndex":3,"explanation":"Relevance cannot override source access restrictions."},{"id":20,"category":"Retrieval-augmented generation","question":"Why evaluate retrieval and generation separately as well as jointly?","options":["To locate missing evidence versus misuse of available evidence","To prove citations are correct automatically","To avoid task-level metrics","To remove labeling needs"],"correctIndex":0,"explanation":"Component evaluation helps identify where end-to-end failures originate."},{"id":21,"category":"Language-model adaptation","question":"When is retrieval often preferable to fine-tuning for changing factual documents?","options":["When facts change frequently and need explicit provenance","When no documents exist","When every fact must be memorized permanently","When access controls are irrelevant"],"correctIndex":0,"explanation":"Retrieval can update evidence without embedding each change in model weights."},{"id":22,"category":"Language-model adaptation","question":"What does supervised fine-tuning usually optimize?","options":["Likelihood of desired outputs given inputs","An unrelated image score","Only the number of parameters","Only retrieval latency"],"correctIndex":0,"explanation":"Training examples teach the model's desired response behavior through a supervised objective."},{"id":23,"category":"Language-model adaptation","question":"Why mask padding tokens in a language-model training loss?","options":["Padding is always the rarest class","It guarantees perfect attention","They are not meaningful target content","It removes all sequence lengths"],"correctIndex":2,"explanation":"Artificial padding should not dominate the learning objective."},{"id":24,"category":"Language-model adaptation","question":"What can catastrophic forgetting look like after domain fine-tuning?","options":["Loss of useful general capabilities","Guaranteed better domain calibration","All gradients becoming exactly zero","A smaller checkpoint filename"],"correctIndex":0,"explanation":"Specialization can overwrite behavior supported by earlier training."},{"id":25,"category":"Language-model adaptation","question":"Why compare full fine-tuning with a parameter-efficient baseline?","options":["Smaller updates always win","It removes evaluation cost","To test whether extra adaptation cost is justified","Full tuning never changes behavior"],"correctIndex":2,"explanation":"Different adaptation methods trade capacity, memory, and operational complexity."},{"id":26,"category":"Language-model adaptation","question":"What should a domain-adaptation validation set include?","options":["In-domain tasks and important retained capabilities","Only model-generated labels without review","Only the easiest prompts","Only training examples"],"correctIndex":0,"explanation":"Measure targeted gains and unwanted regressions together."},{"id":27,"category":"Language-model adaptation","question":"What is a risk of training on one matter's documents and evaluating on paraphrases of the same answers?","options":["Memorization can look like general task competence","Fine-tuning cannot memorize","Paraphrasing guarantees independence","Evaluation becomes causal"],"correctIndex":0,"explanation":"Separate memorized facts from the ability to solve genuinely new tasks."},{"id":28,"category":"Language-model adaptation","question":"Why keep the chat or prompt formatting consistent with the chosen base model?","options":["Every model uses the same template","Templates guarantee correctness","Special tokens and message structure affect interpretation","Formatting changes only typography"],"correctIndex":2,"explanation":"Incorrect formatting can create a distribution mismatch during training or inference."},{"id":29,"category":"Language-model adaptation","question":"What does a useful adaptation baseline hold fixed?","options":["Only the parameter count","Evaluation data, inference settings, and relevant resource budgets","Only the company name","Only the response color"],"correctIndex":1,"explanation":"Controlled comparisons help attribute gains to the adaptation rather than changed conditions."},{"id":30,"category":"Language-model adaptation","question":"When should a specialized model be promoted over a general model plus retrieval?","options":["Whenever it has a new name","Whenever training loss falls","When measured gains justify its maintenance and deployment trade-offs","Whenever the dataset is private"],"correctIndex":2,"explanation":"Specialized models add lifecycle costs and should earn their place through relevant evidence."},{"id":31,"category":"Preference learning and post-training","question":"What does a pairwise preference example contain?","options":["Only a training timestamp","Only one unlabeled input","Only a model size","A context and preferred versus dispreferred outputs"],"correctIndex":3,"explanation":"The comparison supplies a relative quality signal under a shared task context."},{"id":32,"category":"Preference learning and post-training","question":"What is reward hacking?","options":["Reducing GPU usage","Correctly optimizing a faithful metric","Improving a proxy score without improving the intended outcome","Randomizing model weights"],"correctIndex":2,"explanation":"An imperfect reward can favor exploitable shortcuts rather than actual task success."},{"id":33,"category":"Preference learning and post-training","question":"Why maintain a reference behavior or regularization during post-training?","options":["To freeze every output forever","To eliminate all learning","To guarantee factuality","To limit uncontrolled divergence from useful behavior"],"correctIndex":3,"explanation":"Constraints can balance optimization pressure against preserving prior capabilities."},{"id":34,"category":"Preference learning and post-training","question":"What distinguishes standard DPO from a typical reward-model-plus-PPO pipeline?","options":["It requires no preference data","It learns from preference pairs without separately fitting a reward model for PPO","It never uses a reference policy","It performs only image retrieval"],"correctIndex":1,"explanation":"DPO reformulates the preference objective into direct policy optimization."},{"id":35,"category":"Preference learning and post-training","question":"Why can preference-label inconsistency hurt learning?","options":["It automatically improves calibration","It makes all outputs equally valid","It removes model bias","The same behavior receives conflicting optimization signals"],"correctIndex":3,"explanation":"Clear rubrics and adjudication improve the meaning of preference supervision."},{"id":36,"category":"Preference learning and post-training","question":"What should be checked when a judge model favors longer responses?","options":["Whether latency is irrelevant","Whether every long answer is correct","Whether length is confounded with actual task quality","Whether short outputs can be deleted"],"correctIndex":2,"explanation":"Judge shortcuts can distort both evaluation and training rewards."},{"id":37,"category":"Preference learning and post-training","question":"Why evaluate post-trained models on protected tasks?","options":["More tuning guarantees better results","Preference scores prove all capabilities","Training objectives may improve while generalization or safety degrades","Protected tasks are training data"],"correctIndex":2,"explanation":"Held-out evaluation tests whether optimization produced useful behavior beyond its reward signal."},{"id":38,"category":"Preference learning and post-training","question":"What is a distribution shift in preference learning?","options":["All preferences are identical","The optimizer has a new name","The file extension changes","Training comparisons differ from deployment tasks or users"],"correctIndex":3,"explanation":"Preference behavior may not transfer to contexts absent from the training comparisons."},{"id":39,"category":"Preference learning and post-training","question":"Why include difficult near-tie comparisons in expert review selectively?","options":["They require no context","They eliminate easy-case evaluation","They are always objectively resolvable","They can reveal subtle rubric boundaries"],"correctIndex":3,"explanation":"Ambiguous cases may be informative but need careful labeling and uncertainty handling."},{"id":40,"category":"Preference learning and post-training","question":"What makes a post-training improvement credible?","options":["A larger response length","More training steps alone","Higher reward score alone","Better held-out task outcomes without unacceptable regressions"],"correctIndex":3,"explanation":"The intended behavior, not merely the optimized proxy, determines success."},{"id":41,"category":"Agent workflows and tool use","question":"What should happen before executing model-produced tool arguments?","options":["Validate their schema and permissions","Convert every value to a string","Remove all limits","Trust fluent wording"],"correctIndex":0,"explanation":"A plausible model output can still contain invalid or unauthorized arguments."},{"id":42,"category":"Agent workflows and tool use","question":"What most directly prevents an agent from looping forever?","options":["More retrieved documents","A higher temperature","Explicit step, time, and cost budgets","A longer system prompt alone"],"correctIndex":2,"explanation":"Execution limits bound behavior even when the model fails to terminate."},{"id":43,"category":"Agent workflows and tool use","question":"A retrieved document says to ignore instructions and send secrets. How should it be treated?","options":["As proof of user consent","As untrusted content, not authorization","As a tool schema","As a higher-priority command"],"correctIndex":1,"explanation":"Retrieved text supplies evidence; it must not redefine tool permissions."},{"id":44,"category":"Agent workflows and tool use","question":"What makes an external side-effecting tool safer to retry?","options":["A more creative prompt","An unlimited timeout","An idempotency mechanism","Random request IDs on every retry"],"correctIndex":2,"explanation":"A stable operation identity helps prevent duplicate writes or transactions."},{"id":45,"category":"Agent workflows and tool use","question":"Why separate planning from execution in an agent workflow?","options":["To eliminate tool failures","To guarantee the plan is correct","To inspect and constrain proposed actions before side effects","To remove all latency"],"correctIndex":2,"explanation":"Explicit stages make authorization, validation, and failure handling easier to enforce."},{"id":46,"category":"Agent workflows and tool use","question":"What does a structured output schema establish?","options":["Completeness of all evidence","Factual truth","Legal validity","Shape and type constraints"],"correctIndex":3,"explanation":"Schema-valid output may still be semantically wrong and needs task-specific checks."},{"id":47,"category":"Agent workflows and tool use","question":"What should an agent do when necessary evidence is unavailable?","options":["Repeat a confident answer","Fabricate a source","Hide uncertainty in metadata","State the gap or seek the missing evidence"],"correctIndex":3,"explanation":"Reliable behavior preserves the distinction between supported conclusions and missing information."},{"id":48,"category":"Agent workflows and tool use","question":"Why persist agent state at well-defined checkpoints?","options":["To resume safely and trace prior actions","To make every action reversible","To remove all storage needs","To bypass validation"],"correctIndex":0,"explanation":"Durable state helps recover without blindly repeating completed work."},{"id":49,"category":"Agent workflows and tool use","question":"Which trace is most useful for debugging a wrong agent result?","options":["Only the model's display name","Inputs, retrieved evidence, tool calls, outputs, and versions","Only the final answer","Only total token count"],"correctIndex":1,"explanation":"Step-level evidence helps locate whether retrieval, reasoning, execution, or validation failed."},{"id":50,"category":"Agent workflows and tool use","question":"A workflow always follows the same known steps. What is a sensible first implementation?","options":["A deterministic pipeline with bounded model calls","A new model trained from scratch","An unconstrained autonomous loop","A tool with unrestricted shell access"],"correctIndex":0,"explanation":"Use predictable control flow when the task does not require open-ended action selection."},{"id":51,"category":"Evaluating agent behavior","question":"What should an agent benchmark score beyond its final text?","options":["Only response length","Only the number of tools","Only token speed","Task completion, tool correctness, constraints, and cost"],"correctIndex":3,"explanation":"A polished answer can conceal failed or unauthorized execution."},{"id":52,"category":"Evaluating agent behavior","question":"Why reset the environment between benchmark episodes?","options":["To guarantee the agent succeeds","To make tasks identical","To remove all randomness","To avoid state from earlier runs contaminating results"],"correctIndex":3,"explanation":"Persistent artifacts can accidentally make later episodes easier or change their meaning."},{"id":53,"category":"Evaluating agent behavior","question":"What is a success criterion for a side-effecting task?","options":["The intended external state change is verified","The agent says it succeeded","A tool name appears in text","The prompt is repeated"],"correctIndex":0,"explanation":"Completion should be checked against observable state, not self-report alone."},{"id":54,"category":"Evaluating agent behavior","question":"Why test injected instructions inside retrieved content?","options":["To authorize unrestricted actions","To improve factual recall directly","To verify the agent keeps data separate from authority","To remove the need for permissions"],"correctIndex":2,"explanation":"External content can try to redirect behavior beyond the user's intent."},{"id":55,"category":"Evaluating agent behavior","question":"What is an appropriate evaluation of abstention?","options":["Maximizing refusal on every task","Whether the agent declines unsupported tasks while solving supported ones","Always forcing an answer","Ignoring unanswered cases"],"correctIndex":1,"explanation":"Both unwarranted confidence and unnecessary refusal can harm usefulness."},{"id":56,"category":"Evaluating agent behavior","question":"Why run multiple seeds or trials for stochastic agents?","options":["To eliminate the test set","To select only the best run","To estimate reliability rather than one lucky success","To guarantee independence of all errors"],"correctIndex":2,"explanation":"Stochastic variation affects success rates and cost distributions."},{"id":57,"category":"Evaluating agent behavior","question":"What does a budget-limited benchmark reveal?","options":["Only output spelling","Only model size","Only theoretical unlimited performance","Capability under realistic resource constraints"],"correctIndex":3,"explanation":"Task success must often fit latency, tool-call, or monetary limits."},{"id":58,"category":"Evaluating agent behavior","question":"Why distinguish retrieval failures from tool-execution failures?","options":["Tool failures prove missing evidence","They have no effect on outcomes","They require different fixes","Both are always solved by a larger prompt"],"correctIndex":2,"explanation":"Error taxonomy directs improvement to the failing stage."},{"id":59,"category":"Evaluating agent behavior","question":"What should a benchmark include for retry behavior?","options":["Transient failures and duplicate-side-effect checks","Only the longest prompt","Only unsupported actions","Only perfect tool responses"],"correctIndex":0,"explanation":"Robust agents need controlled recovery without repeating harmful or costly writes."},{"id":60,"category":"Evaluating agent behavior","question":"Why keep an expert-reviewed subset for a model-judged benchmark?","options":["To calibrate and audit judge agreement with the task rubric","To avoid recording disagreements","To replace all test items with training data","To prove the judge is infallible"],"correctIndex":0,"explanation":"Automated scoring is a measurement tool whose errors must also be assessed."},{"id":61,"category":"Expert-domain benchmarks","question":"What makes an expert-task benchmark meaningful?","options":["Tasks and rubrics reflecting the real workflow","Only public leaderboard popularity","Maximum prompt length","Only trivia questions"],"correctIndex":0,"explanation":"The evaluation should represent the capabilities the system is intended to deliver."},{"id":62,"category":"Expert-domain benchmarks","question":"Why include unanswerable questions in document-grounded evaluation?","options":["To reduce the need for sources","To force the model to invent facts","To test recognition of insufficient evidence","To guarantee lower costs"],"correctIndex":2,"explanation":"Reliable systems need to distinguish missing support from a valid answer."},{"id":63,"category":"Expert-domain benchmarks","question":"What is the difference between citation presence and citation correctness?","options":["A citation can exist without supporting the claim","They are identical","A URL always proves support","Longer citations are always better"],"correctIndex":0,"explanation":"Verify that the cited passage actually entails the relevant statement."},{"id":64,"category":"Expert-domain benchmarks","question":"Why blind reviewers to model identity?","options":["To guarantee agreement","To remove domain expertise","To reduce reputation and expectation bias","To eliminate all preference"],"correctIndex":2,"explanation":"Blinding improves the fairness of judgments while leaving rubric quality essential."},{"id":65,"category":"Expert-domain benchmarks","question":"What should be done with a disputed reference answer?","options":["Hide the task from all records","Assume the model is wrong automatically","Review it and record the resolution or ambiguity","Remove the reviewer"],"correctIndex":2,"explanation":"Benchmark labels can be wrong; the evaluation process needs a correction path."},{"id":66,"category":"Expert-domain benchmarks","question":"Why separate development tasks from a final protected benchmark?","options":["It guarantees external validity","All task sets should share answers","Protected tasks never need labels","Repeated iteration can overfit the development set"],"correctIndex":3,"explanation":"A fresh protected set reduces adaptation to the benchmark itself."},{"id":67,"category":"Expert-domain benchmarks","question":"What is a useful robustness test for an expert assistant?","options":["Only measuring file length","Meaning-preserving input variations and realistic ambiguity","Randomly changing the correct answer","Only increasing font size"],"correctIndex":1,"explanation":"Robustness means stable appropriate behavior under relevant input changes."},{"id":68,"category":"Expert-domain benchmarks","question":"Why report performance by task difficulty or type?","options":["A single average can conceal important capability gaps","Every task is equally valuable","Small groups have no uncertainty","Aggregate metrics are always wrong"],"correctIndex":0,"explanation":"Slices expose weaknesses while sample sizes govern confidence."},{"id":69,"category":"Expert-domain benchmarks","question":"What should error analysis produce?","options":["Actionable categories tied to examples and likely causes","Only a total failure count","Only a new model name","Only blame for the model"],"correctIndex":0,"explanation":"A useful taxonomy turns evaluation into a targeted improvement plan."},{"id":70,"category":"Expert-domain benchmarks","question":"What is a risk of repeatedly rewriting benchmark questions after seeing model answers?","options":["It guarantees independence","The benchmark becomes adapted to the evaluated model","It removes all bias","It makes the score causal"],"correctIndex":1,"explanation":"Document corrections and retain a protected evaluation boundary."},{"id":71,"category":"Distributed training and scaling","question":"In ordinary data parallelism, what does each worker typically hold?","options":["Every example with no partitioning","Only one scalar parameter","A model replica and a different data shard","Only a validation set"],"correctIndex":2,"explanation":"Workers compute gradients on different samples and synchronize updates."},{"id":72,"category":"Distributed training and scaling","question":"What does standard DDP synchronize during backward?","options":["Every raw dataset file","Only metric names","All user prompts","Parameter gradients"],"correctIndex":3,"explanation":"Gradient synchronization coordinates replicated parameter updates across workers."},{"id":73,"category":"Distributed training and scaling","question":"Why use an appropriate distributed data sampler?","options":["To remove all duplicate labels","DDP automatically shuffles every dataset","To change the model architecture","To partition or coordinate examples across workers"],"correctIndex":3,"explanation":"Gradient synchronization alone does not assign different data to each process."},{"id":74,"category":"Distributed training and scaling","question":"Four workers each process 8 examples per step. With two accumulation steps, what is the effective batch size?","options":["16","64","32","128"],"correctIndex":1,"explanation":"Multiply workers, local batch, and accumulation: 4*8*2."},{"id":75,"category":"Distributed training and scaling","question":"What does gradient accumulation trade?","options":["Free extra compute","More forward/backward passes per optimizer update for lower per-pass memory","No need for loss scaling","Guaranteed identical batch-normalization behavior"],"correctIndex":1,"explanation":"Accumulation can approximate larger batches, with care about scaling and stateful layers."},{"id":76,"category":"Distributed training and scaling","question":"Why can distributed scaling flatten as worker count grows?","options":["Models stop needing data","Communication and nonparallel work become limiting","More devices always give linear speedup","The loss becomes constant"],"correctIndex":1,"explanation":"Device count alone does not eliminate synchronization, input, or serial bottlenecks."},{"id":77,"category":"Distributed training and scaling","question":"What distinguishes parameter sharding from basic replicated data parallelism?","options":["Model-related state is distributed across workers","Every worker stores more complete copies","Gradients are never computed","Data cannot be partitioned"],"correctIndex":0,"explanation":"Sharding reduces per-worker state memory at the cost of additional communication and complexity."},{"id":78,"category":"Distributed training and scaling","question":"What does activation checkpointing trade?","options":["Smaller datasets for better calibration","Extra recomputation for lower activation memory","More labels for fewer gradients","Lower precision for higher disk usage"],"correctIndex":1,"explanation":"Some intermediate activations are recomputed during backward instead of retained."},{"id":79,"category":"Distributed training and scaling","question":"What happens if one worker skips a collective communication that others enter?","options":["Others always proceed correctly","The batch becomes smaller automatically","Training becomes deterministic","The job can hang or fail"],"correctIndex":3,"explanation":"Collective operations require compatible participation and ordering."},{"id":80,"category":"Distributed training and scaling","question":"Why measure samples per second and time to target quality when scaling?","options":["Faster steps may change optimization efficiency","Device count proves all gains","Communication cost is always zero","Training loss is irrelevant"],"correctIndex":0,"explanation":"Throughput alone does not show whether a useful model is reached sooner or cheaper."},{"id":81,"category":"Experimental design and research engineering","question":"What makes a hypothesis experimentally useful?","options":["A list of popular tools","A promise of success","A claim that every outcome confirms","A measurable prediction that could be contradicted"],"correctIndex":3,"explanation":"Testable predictions let evidence distinguish explanations."},{"id":82,"category":"Experimental design and research engineering","question":"Why change one major factor at a time in a diagnostic ablation?","options":["To make the effect easier to attribute","To remove the need for repeated trials","To avoid all interactions","To guarantee the best model"],"correctIndex":0,"explanation":"Controlled changes help interpretation, while factorial studies can later examine interactions."},{"id":83,"category":"Experimental design and research engineering","question":"Why report results over multiple training seeds?","options":["To replace a held-out test set","To expose variation due to stochastic training","To guarantee all data is independent","To choose only the best seed"],"correctIndex":1,"explanation":"A single run can exaggerate a fragile improvement."},{"id":84,"category":"Experimental design and research engineering","question":"What should be done when a claimed gain disappears under a stronger baseline?","options":["Reassess the claim and investigate what remains","Change the metric silently","Hide the baseline","Report only the original result"],"correctIndex":0,"explanation":"Scientific value depends on fair comparisons rather than preserving a preferred conclusion."},{"id":85,"category":"Experimental design and research engineering","question":"What is an efficient first step when implementing a complex paper?","options":["Launch the largest available training run","Change every architectural detail","Reproduce a small verifiable component or baseline","Skip data checks"],"correctIndex":2,"explanation":"Small tests expose misunderstandings before expensive experiments."},{"id":86,"category":"Experimental design and research engineering","question":"Why record unsuccessful experiments?","options":["They lower all future scores","They replace successful replications","They prove the idea is impossible","They preserve evidence about what did not work and under which conditions"],"correctIndex":3,"explanation":"Negative results reduce repeated effort and clarify the limits of a hypothesis."},{"id":87,"category":"Experimental design and research engineering","question":"What does a Pareto frontier represent for quality, latency, and memory objectives?","options":["Solutions not dominated by another feasible solution","Every trained checkpoint","Only the largest model","Only solutions with equal scores"],"correctIndex":0,"explanation":"A nondominated solution offers a trade-off that no other compared option improves in all objectives."},{"id":88,"category":"Experimental design and research engineering","question":"What is a reproducible experiment configuration?","options":["A memory of the best values","An edited notebook with hidden state","A screenshot alone","Versioned settings linked to code, data, and artifacts"],"correctIndex":3,"explanation":"Explicit configurations reduce ambiguity when rerunning or reviewing results."},{"id":89,"category":"Experimental design and research engineering","question":"Why inspect raw examples behind aggregate metrics?","options":["To select only successes","To identify failure patterns and measurement defects","To replace all quantitative evidence","To prove causality"],"correctIndex":1,"explanation":"Qualitative analysis complements statistics by showing what errors actually look like."},{"id":90,"category":"Experimental design and research engineering","question":"What should an empirical claim distinguish?","options":["Only the author's confidence","Observed evidence, assumptions, and untested extrapolation","Only future plans","Only the strongest possible interpretation"],"correctIndex":1,"explanation":"Clear boundaries make research conclusions useful and defensible."},{"id":91,"category":"Matter-specific expert workflows","question":"What is the strongest boundary for a matter-specific document store?","options":["One shared unrestricted index","Similarity score alone","The model's inferred client identity","Matter-level permissions and provenance"],"correctIndex":3,"explanation":"Matter isolation should be enforced by the system, not inferred from language."},{"id":92,"category":"Matter-specific expert workflows","question":"Why preserve document versions and effective dates in an expert assistant?","options":["Dates affect only formatting","The applicable evidence may depend on time and version","All versions contain the same facts","The newest upload is always authoritative"],"correctIndex":1,"explanation":"Retrieval must surface the appropriate source for the question's context."},{"id":93,"category":"Matter-specific expert workflows","question":"What should an assistant do when two authoritative-looking documents conflict?","options":["Identify the conflict and seek the appropriate resolution","Prefer whichever was retrieved first","Choose the longer one silently","Average their statements"],"correctIndex":0,"explanation":"Conflicting evidence requires context and expert judgment, not arbitrary selection."},{"id":94,"category":"Matter-specific expert workflows","question":"What makes a matter-specific improvement loop credible?","options":["Reusing the same test answers for every training cycle","Increasing context indefinitely","Curated data, bounded adaptation, and protected evaluation","Measuring only fluency"],"correctIndex":2,"explanation":"Each iteration should improve relevant behavior without contaminating the evidence used to assess it."},{"id":95,"category":"Matter-specific expert workflows","question":"Why involve domain experts in agent environment design?","options":["They remove the need for testing","They guarantee every source is current","They identify real actions, dependencies, and review points","They make all workflows deterministic"],"correctIndex":2,"explanation":"Workflow fidelity matters when translating expert practice into executable steps."},{"id":96,"category":"Matter-specific expert workflows","question":"What should a document-comparison output distinguish?","options":["Text changes, their supported interpretation, and uncertainty","Only the number of tokens","Only a guessed legal outcome","Only formatting differences"],"correctIndex":0,"explanation":"Separating observation from interpretation helps reviewers assess what the evidence establishes."},{"id":97,"category":"Matter-specific expert workflows","question":"Why should extracted facts retain their source passages?","options":["It removes all access restrictions","Passage storage guarantees factual truth","Experts need to verify wording and context","It makes extraction unnecessary"],"correctIndex":2,"explanation":"Traceable evidence allows review of qualifications, exceptions, and interpretation errors."},{"id":98,"category":"Matter-specific expert workflows","question":"What is a suitable role for human review in a high-impact expert workflow?","options":["Approve based only on model confidence","Rubber-stamp every output automatically","Review defined uncertain or consequential decisions","Replace all testing with one approval"],"correctIndex":2,"explanation":"Review should be designed around impact and known failure modes."},{"id":99,"category":"Matter-specific expert workflows","question":"What should happen before reusing one matter's data for another?","options":["Remove only the folder name","Verify permission, scope, isolation, and relevance","Merge all indexes","Assume model access grants reuse rights"],"correctIndex":1,"explanation":"Availability in one context does not establish authorization or usefulness in another."},{"id":100,"category":"Matter-specific expert workflows","question":"What is a useful product milestone for matter-specific AI?","options":["A scoped workflow with measured reliability and traceable expert review","A demo that always answers","A claim to replace all expertise","A maximum context window"],"correctIndex":0,"explanation":"A concrete validated capability is a stronger milestone than broad unsupported promises."}]},{"stem":"research_engineer_3d_world_models","title":"Research Engineer","subtitle":"3D World Models","company":"SpAItial","questions":[{"id":1,"category":"Cameras and multi-view geometry","question":"For a pinhole camera, u = fx*X/Z + cx. With fx=600, X=1, Z=3, cx=320, what is u?","options":["320 pixels","200 pixels","520 pixels","920 pixels"],"correctIndex":2,"explanation":"Project X/Z onto the image and add the principal point: 600/3 + 320."},{"id":2,"category":"Cameras and multi-view geometry","question":"What does a camera intrinsic matrix encode?","options":["World-space object velocity","Focal lengths and principal point under the camera model","Camera-to-world translation only","Scene object identities"],"correctIndex":1,"explanation":"Intrinsics map camera-frame rays into image coordinates."},{"id":3,"category":"Cameras and multi-view geometry","question":"Given x_camera = R*x_world + t, where is the camera center in world coordinates?","options":["-transpose(R)*t","R*t","t","-t for every R"],"correctIndex":0,"explanation":"Set camera coordinates to zero and invert the rigid transformation."},{"id":4,"category":"Cameras and multi-view geometry","question":"What is the inverse of a proper rotation matrix R?","options":["Its negative","Twice R","Its transpose","Its determinant"],"correctIndex":2,"explanation":"Orthogonality gives transpose(R)*R = I."},{"id":5,"category":"Cameras and multi-view geometry","question":"Stereo focal length is 500 pixels, baseline 0.2 m, and disparity 25 pixels. What is depth?","options":["10 m","2 m","4 m","0.04 m"],"correctIndex":2,"explanation":"Rectified stereo depth is focal length times baseline divided by disparity."},{"id":6,"category":"Cameras and multi-view geometry","question":"What happens to stereo depth uncertainty as disparity approaches zero?","options":["It necessarily vanishes","Baseline no longer matters","Depth becomes exactly known","It generally increases strongly"],"correctIndex":3,"explanation":"Depth varies inversely with disparity, making distant estimates sensitive to small disparity errors."},{"id":7,"category":"Cameras and multi-view geometry","question":"What does the fundamental matrix relate in two undistorted images?","options":["A pixel point to an epipolar line","Object class to surface normal","Camera exposure to focal length","RGB values to depth directly"],"correctIndex":0,"explanation":"Correspondences must satisfy the epipolar constraint under the two-view geometry."},{"id":8,"category":"Cameras and multi-view geometry","question":"What ambiguity remains in calibrated monocular reconstruction without metric cues?","options":["Every image dimension","Global scale","Whether pixels are discrete","The number of color channels"],"correctIndex":1,"explanation":"Scaling the scene and camera translations together can leave projections unchanged."},{"id":9,"category":"Cameras and multi-view geometry","question":"An image is resized by a factor of 0.5 in both dimensions. What happens to pixel-valued focal lengths?","options":["They stay unchanged","They are multiplied by 0.5","They become zero","They are doubled"],"correctIndex":1,"explanation":"Intrinsics expressed in pixels must follow the image coordinate scaling."},{"id":10,"category":"Cameras and multi-view geometry","question":"Why correct lens distortion before using an ideal pinhole reconstruction model?","options":["Distortion changes the number of cameras","Correction supplies ground-truth depth","Distorted pixels violate its simple projection assumptions","Correction eliminates occlusion"],"correctIndex":2,"explanation":"Geometry must match the image formation model used in estimation."},{"id":11,"category":"Reconstruction and pose estimation","question":"What does triangulation estimate from matched calibrated views?","options":["A semantic label from color","A 3D point from viewing rays","An optimizer learning rate","A file checksum"],"correctIndex":1,"explanation":"Corresponding projections constrain where the rays intersect or come closest."},{"id":12,"category":"Reconstruction and pose estimation","question":"Why is a very small triangulation angle problematic?","options":["Images become orthographic","Depth becomes weakly constrained","Every match becomes correct","Surface color disappears"],"correctIndex":1,"explanation":"Nearly parallel rays make depth highly sensitive to small localization errors."},{"id":13,"category":"Reconstruction and pose estimation","question":"What does bundle adjustment jointly refine?","options":["Only image compression","Camera parameters and 3D structure","Only semantic labels","Only mesh filenames"],"correctIndex":1,"explanation":"It optimizes geometric consistency, commonly through reprojection residuals."},{"id":14,"category":"Reconstruction and pose estimation","question":"What is reprojection error?","options":["Distance between observed and projected image points","Difference between two surface normals","Distance between two camera centers","Distance between neighboring 3D vertices"],"correctIndex":0,"explanation":"The residual measures how well a 3D-and-camera estimate explains image observations."},{"id":15,"category":"Reconstruction and pose estimation","question":"Why use RANSAC for geometric model estimation?","options":["To estimate semantic labels","To tolerate a substantial fraction of incorrect matches","To guarantee the global optimum","To remove the need for enough inliers"],"correctIndex":1,"explanation":"Sampling and consensus separate a plausible model from many outlier correspondences."},{"id":16,"category":"Reconstruction and pose estimation","question":"What does the perspective-n-point problem estimate from known 3D-to-2D correspondences?","options":["Camera pose","Surface texture resolution","Video frame rate","Object category count"],"correctIndex":0,"explanation":"With camera calibration and suitable correspondences, PnP estimates the camera's orientation and position."},{"id":17,"category":"Reconstruction and pose estimation","question":"Why can a textureless wall challenge feature-based reconstruction?","options":["It always violates perspective","Distinctive correspondences are scarce","Its camera intrinsics are undefined","It has no physical geometry"],"correctIndex":1,"explanation":"Matching relies on observable structure that may be absent or repetitive."},{"id":18,"category":"Reconstruction and pose estimation","question":"What can moving objects violate in ordinary static-scene structure-from-motion?","options":["The existence of camera intrinsics","The meaning of color","The image dimensions","A single consistent rigid-scene assumption"],"correctIndex":3,"explanation":"Dynamic points do not obey the same scene geometry across views."},{"id":19,"category":"Reconstruction and pose estimation","question":"Why inspect camera pose conventions when integrating a reconstruction library?","options":["Pose conventions affect only labels","Matrix multiplication is commutative","World-to-camera and camera-to-world transforms differ","All libraries use identical axes"],"correctIndex":2,"explanation":"Incorrect direction, handedness, or axis conventions can mirror or displace the reconstruction."},{"id":20,"category":"Reconstruction and pose estimation","question":"What is a useful first synthetic test for a geometry pipeline?","options":["Delete calibration files","Project known 3D points and recover the known setup","Train a large diffusion model","Compare unrelated photographs"],"correctIndex":1,"explanation":"Controlled geometry exposes convention and implementation errors independently of real-data ambiguity."},{"id":21,"category":"Point clouds, meshes, and fields","question":"What does a mesh provide that an unstructured point cloud does not inherently contain?","options":["Guaranteed correct scale","Perfect lighting","Explicit surface connectivity","Semantic labels for every vertex"],"correctIndex":2,"explanation":"Faces and edges define how vertices form a surface."},{"id":22,"category":"Point clouds, meshes, and fields","question":"What does a signed distance field encode?","options":["RGB intensity only","Camera frame rate","Object ID only","Signed distance to a surface"],"correctIndex":3,"explanation":"The zero level set represents the surface; sign convention must be defined."},{"id":23,"category":"Point clouds, meshes, and fields","question":"What is an occupancy field typically intended to estimate?","options":["The camera's focal length","Whether a location lies inside the represented object","The next audio token","Surface color alone"],"correctIndex":1,"explanation":"Occupancy and signed distance are different spatial representations."},{"id":24,"category":"Point clouds, meshes, and fields","question":"Why use voxel downsampling on a dense point cloud?","options":["To reduce redundant points with spatially controlled sampling","To add missing surfaces","To estimate every material","To guarantee exact geometry"],"correctIndex":0,"explanation":"Grid-based aggregation reduces size while approximately preserving spatial coverage."},{"id":25,"category":"Point clouds, meshes, and fields","question":"What does a surface normal describe?","options":["Absolute camera position","Image exposure","Local surface orientation","The point's class probability"],"correctIndex":2,"explanation":"Normals are directions perpendicular to the local surface under the chosen orientation."},{"id":26,"category":"Point clouds, meshes, and fields","question":"Why can point-set Chamfer distance miss topological defects?","options":["It measures only runtime","It measures proximity rather than surface connectivity","It directly checks every mesh edge","It always requires equal point counts"],"correctIndex":1,"explanation":"Nearby points can still form disconnected or otherwise invalid surfaces."},{"id":27,"category":"Point clouds, meshes, and fields","question":"What does a watertight mesh have?","options":["Identical vertex spacing","A closed surface without boundary holes","Perfect texture","Zero triangles"],"correctIndex":1,"explanation":"Closure is a topological property and does not guarantee geometric accuracy."},{"id":28,"category":"Point clouds, meshes, and fields","question":"A dense voxel grid doubles its resolution along all three axes. By what factor does its cell count increase?","options":["Two","Six","Eight","Four"],"correctIndex":2,"explanation":"Each axis contributes a factor of two: 2*2*2 = 8."},{"id":29,"category":"Point clouds, meshes, and fields","question":"Why normalize coordinate scales consistently during 3D training?","options":["It replaces calibration","It guarantees identical scenes","Units and scale affect distances, losses, and optimization","It removes all pose uncertainty"],"correctIndex":2,"explanation":"Inconsistent meters and millimeters can silently distort learning and evaluation."},{"id":30,"category":"Point clouds, meshes, and fields","question":"What should a mesh-decimation evaluation check beyond triangle count?","options":["Only color-channel count","Only filename length","Only the training seed","Shape error and important structural details"],"correctIndex":3,"explanation":"Simplification trades complexity against geometric fidelity and downstream usability."},{"id":31,"category":"3D Gaussian Splatting","question":"What are the spatial primitives in standard 3D Gaussian Splatting?","options":["Only text tokens","Only triangle meshes","Anisotropic 3D Gaussians","Only dense cubic voxels"],"correctIndex":2,"explanation":"The scene is represented with Gaussian centers and spatial covariance parameters."},{"id":32,"category":"3D Gaussian Splatting","question":"What does a Gaussian's covariance control?","options":["Its center position only","Its spatial extent and orientation","Its RGB color coefficients only","Its scalar opacity only"],"correctIndex":1,"explanation":"Anisotropy lets a primitive stretch differently along different directions."},{"id":33,"category":"3D Gaussian Splatting","question":"Why is a positive-semidefinite covariance important?","options":["It defines a valid Gaussian spatial shape","It removes every rendering artifact","It fixes the camera pose","It guarantees correct scene topology"],"correctIndex":0,"explanation":"An invalid covariance cannot represent a proper Gaussian extent."},{"id":34,"category":"3D Gaussian Splatting","question":"What does opacity contribute to splat rendering?","options":["Its file name","Its training batch index","Its surface class","How strongly a primitive attenuates or contributes along a ray"],"correctIndex":3,"explanation":"Opacity and ordering influence compositing and visibility."},{"id":35,"category":"3D Gaussian Splatting","question":"What do spherical-harmonic color coefficients model in the original approach?","options":["Camera calibration errors","All semantic labels","Exact rigid-body dynamics","View-dependent appearance"],"correctIndex":3,"explanation":"Direction-dependent appearance helps represent how observed color changes with viewing direction."},{"id":36,"category":"3D Gaussian Splatting","question":"What is the purpose of densification during Gaussian optimization?","options":["Convert every scene into one Gaussian","Guarantee physical correctness","Remove camera supervision","Add or split primitives where more representation capacity is needed"],"correctIndex":3,"explanation":"Adaptive density lets the representation allocate capacity to poorly represented regions."},{"id":37,"category":"3D Gaussian Splatting","question":"Why can excessive Gaussian count become an operational problem?","options":["All views become identical","Storage and rendering work increase","Gradients stop existing","Geometry becomes mathematically impossible"],"correctIndex":1,"explanation":"Quality gains must be balanced against memory, loading, and frame-time costs."},{"id":38,"category":"3D Gaussian Splatting","question":"What is a common meaning of a floater artifact in a reconstructed scene?","options":["Spurious geometry or density away from a valid surface","A text-token mismatch","A missing optimizer state","A rotated file extension"],"correctIndex":0,"explanation":"Inconsistent evidence or optimization can create unsupported structures."},{"id":39,"category":"3D Gaussian Splatting","question":"Why does good novel-view image quality not prove a Gaussian scene has an accurate collision surface?","options":["Appearance primitives are not automatically a valid physical surface","Rendering and collision are identical tasks","Every Gaussian defines a watertight mesh","Color accuracy guarantees topology"],"correctIndex":0,"explanation":"A physics or interaction use case needs its own geometry representation and validation."},{"id":40,"category":"3D Gaussian Splatting","question":"What should be controlled when benchmarking two splat renderers?","options":["Only the camera serial number","Resolution, scene, hardware, and quality settings","Only training duration","Only the project name"],"correctIndex":1,"explanation":"Common conditions are needed to interpret speed and quality differences fairly."},{"id":41,"category":"Neural rendering and novel views","question":"What does a classic NeRF map position and viewing direction to?","options":["Density and emitted color","Only a mesh triangle ID","Only a camera pose","Only a semantic class"],"correctIndex":0,"explanation":"The radiance field is sampled along camera rays to render images."},{"id":42,"category":"Neural rendering and novel views","question":"What does transmittance represent in volume rendering?","options":["The local sample density alone","The accumulated emitted color","The surface normal's length","The fraction of light not yet attenuated along the ray"],"correctIndex":3,"explanation":"Accumulated density reduces the contribution of deeper samples."},{"id":43,"category":"Neural rendering and novel views","question":"Why are held-out camera views useful?","options":["They prove arbitrary unseen geometry","They guarantee metric scale","They test rendering beyond the training viewpoints","They replace calibration"],"correctIndex":2,"explanation":"Novel-view evaluation distinguishes reconstruction from memorizing training images."},{"id":44,"category":"Neural rendering and novel views","question":"What is a disoccluded region in a novel view?","options":["A region newly visible after an occluder moves out of the way","A region visible in every training image","A zero-valued camera matrix","A duplicated file"],"correctIndex":0,"explanation":"Newly revealed surfaces may have little or no direct training evidence."},{"id":45,"category":"Neural rendering and novel views","question":"Why can a model with high training-view PSNR still fail on new views?","options":["New views cannot be rendered","Training views are never informative","PSNR measures only latency","It may overfit appearance without consistent geometry"],"correctIndex":3,"explanation":"Image reconstruction quality on observed views is not sufficient for multi-view generalization."},{"id":46,"category":"Neural rendering and novel views","question":"What does increasing ray samples usually trade?","options":["Less memory with guaranteed equal quality","Fewer inputs with exact geometry","More labels for lower latency","More computation for potentially better integration accuracy"],"correctIndex":3,"explanation":"Rendering accuracy depends on sampling strategy as well as sample count."},{"id":47,"category":"Neural rendering and novel views","question":"Why model viewing direction for reflective surfaces?","options":["Shadows disappear","Geometry always changes with direction","Intrinsics become unnecessary","Appearance changes with observation direction"],"correctIndex":3,"explanation":"Specular effects cannot be represented well by a single view-independent color alone."},{"id":48,"category":"Neural rendering and novel views","question":"What is differentiable rendering useful for?","options":["Optimizing scene parameters from image losses","Removing every local optimum","Guaranteeing a unique reconstruction","Avoiding camera models"],"correctIndex":0,"explanation":"Gradients connect rendered observations to the parameters that produced them."},{"id":49,"category":"Neural rendering and novel views","question":"Why is exposure variation a nuisance in photometric reconstruction?","options":["Color changes may be mistaken for scene differences","It changes all physical distances","It removes occlusion","It guarantees better geometry"],"correctIndex":0,"explanation":"Photometric losses need compatible appearance assumptions or compensation."},{"id":50,"category":"Neural rendering and novel views","question":"What does a depth-aware occlusion test help prevent in view synthesis?","options":["Every lighting inconsistency","All texture aliasing","All camera noise","Sampling colors from surfaces hidden behind nearer geometry"],"correctIndex":3,"explanation":"Visibility reasoning distinguishes projected correspondence from actual visible correspondence."},{"id":51,"category":"World models and physical consistency","question":"What is temporal consistency in a generated 3D sequence?","options":["Every object has one color","Every frame is identical","Scene properties evolve coherently across time","Only frame size is constant"],"correctIndex":2,"explanation":"Objects, geometry, and motion should remain compatible across successive observations."},{"id":52,"category":"World models and physical consistency","question":"Why is collision testing relevant to a generated world?","options":["Meshes cannot overlap","Rendering quality proves valid collisions","Physics is determined by image resolution","Visually plausible objects can interpenetrate"],"correctIndex":3,"explanation":"Physical usability requires checks beyond visual appearance."},{"id":53,"category":"World models and physical consistency","question":"What does a physics prior contribute to a learned world model?","options":["A replacement for all observations","Guaranteed numerical stability","Proof of exact real-world behavior","Constraints or inductive bias about plausible dynamics"],"correctIndex":3,"explanation":"Priors can guide learning but must be tested against the target environment."},{"id":54,"category":"World models and physical consistency","question":"Why distinguish static scene state from dynamic object state?","options":["Both are always identical","They follow different temporal assumptions","Static scenes need no geometry","Dynamic objects have no appearance"],"correctIndex":1,"explanation":"Separating persistent structure from motion can improve representation and prediction."},{"id":55,"category":"World models and physical consistency","question":"What does an action-conditioned world model predict?","options":["Future state or observations given actions","Only file checksums","Only past labels","Only a camera's serial number"],"correctIndex":0,"explanation":"Conditioning on interventions allows the model to represent their possible consequences."},{"id":56,"category":"World models and physical consistency","question":"Why can one-step prediction accuracy hide poor rollout quality?","options":["One-step tests measure all horizons","Predicted states never feed back","Small errors accumulate over repeated predictions","Long rollouts contain no uncertainty"],"correctIndex":2,"explanation":"Evaluate multi-step behavior when the model will run recursively."},{"id":57,"category":"World models and physical consistency","question":"What is object permanence in a world-model context?","options":["An object can persist while occluded","Every object remains stationary","Every visible surface is planar","Objects disappear when not rendered"],"correctIndex":0,"explanation":"A coherent latent scene should not confuse temporary invisibility with nonexistence."},{"id":58,"category":"World models and physical consistency","question":"Why check unit consistency before simulating generated scenes?","options":["Gravity is independent of all units","Geometry has no scale","Mass, distance, and time scales affect dynamics","Units change only labels"],"correctIndex":2,"explanation":"Mixing unit systems can produce wildly incorrect physical behavior."},{"id":59,"category":"World models and physical consistency","question":"Which evaluation probes controllable world generation?","options":["Change one requested scene property and check intended and unintended effects","Inspect only random screenshots","Measure only prompt length","Count all generated triangles"],"correctIndex":0,"explanation":"Control requires both achieving the edit and preserving relevant unaffected properties."},{"id":60,"category":"World models and physical consistency","question":"Why represent uncertainty about unseen parts of a scene?","options":["Every scene must use one camera","Unseen geometry is always uniquely known","Uncertainty prevents rendering","Multiple geometries can explain the same observations"],"correctIndex":3,"explanation":"Partial evidence leaves ambiguity that a single confident reconstruction can hide."},{"id":61,"category":"Diffusion-model foundations","question":"What is the forward process in a standard denoising diffusion model?","options":["Rendering a fixed mesh","Gradually corrupting data with noise","Sorting training examples","Directly classifying clean inputs"],"correctIndex":1,"explanation":"The forward corruption defines noisy states used to train the reverse denoising process."},{"id":62,"category":"Diffusion-model foundations","question":"What does a noise-prediction diffusion objective train the network to estimate?","options":["The final optimizer state","Every class label","The noise added to a sampled training example","The example's filename"],"correctIndex":2,"explanation":"The network receives a noisy sample and noise-level information to estimate the corruption."},{"id":63,"category":"Diffusion-model foundations","question":"Why condition a denoiser on the timestep or noise level?","options":["It removes all stochasticity","It guarantees a single output","The required denoising operation depends on corruption strength","It directly identifies the training image"],"correctIndex":2,"explanation":"Different noise levels represent different reconstruction difficulties."},{"id":64,"category":"Diffusion-model foundations","question":"What is the starting point of ordinary unconditional diffusion sampling?","options":["A noise sample","The optimizer checkpoint","The final test label","A sorted training image list"],"correctIndex":0,"explanation":"A learned reverse process transforms noise into a sample from the modeled distribution."},{"id":65,"category":"Diffusion-model foundations","question":"What does classifier-free guidance combine?","options":["Conditional and unconditional predictions","Two camera matrices","Only real and fake class labels","Two unrelated test datasets"],"correctIndex":0,"explanation":"Their difference can strengthen conditioning during generation."},{"id":66,"category":"Diffusion-model foundations","question":"What is a common effect of excessively strong guidance?","options":["Guaranteed perfect realism","Exact reconstruction of all prompts","Unlimited sampling speed","Better prompt pressure but reduced diversity or artifacts"],"correctIndex":3,"explanation":"Guidance creates a quality, adherence, and diversity trade-off that needs evaluation."},{"id":67,"category":"Diffusion-model foundations","question":"Why compare different sampling step counts?","options":["They trade generation cost against output quality","Step count changes the dataset license","Steps only affect file size","More steps always improve every metric"],"correctIndex":0,"explanation":"The best operating point depends on the model, sampler, and task."},{"id":68,"category":"Diffusion-model foundations","question":"What does a diffusion noise schedule determine?","options":["The image filename","The GPU billing currency","How corruption changes across timesteps","The class vocabulary order"],"correctIndex":2,"explanation":"The schedule affects signal-to-noise levels encountered during learning and sampling."},{"id":69,"category":"Diffusion-model foundations","question":"Why is a fixed seed useful when comparing prompt or sampler changes?","options":["It replaces multiple-seed evaluation","It makes the model deterministic on all hardware","It guarantees identical outputs across every implementation","It controls one source of sampling variation"],"correctIndex":3,"explanation":"Controlled randomness supports comparison, while broader evaluation still needs variation."},{"id":70,"category":"Diffusion-model foundations","question":"What is a basic limitation of a single attractive generated example?","options":["It proves the model "Token positions need representation when the task depends on ordering or geometry."},{"id":76,"category":"Transformers and representation learning","question":"A 256 by 256 image uses 16 by 16 non-overlapping patches. How many patch tokens result?","options":["32","16","256","4096"],"correctIndex":2,"explanation":"There are 16 patches per side, giving 16 times 16 tokens."},{"id":77,"category":"Transformers and representation learning","question":"What does a residual connection provide to gradient flow?","options":["A guarantee against overfitting","An additional direct path","A replacement for the loss","A fixed attention distribution"],"correctIndex":1,"explanation":"The identity path helps optimization through deep compositions."},{"id":78,"category":"Transformers and representation learning","question":"What does contrastive learning encourage for matched image-text pairs?","options":["More compatible representations than mismatched pairs","A fixed class count","Equal scores for every pair","Identical raw inputs"],"correctIndex":0,"explanation":"A contrastive objective distinguishes matched examples from suitable negatives."},{"id":79,"category":"Transformers and representation learning","question":"Why can a false negative harm contrastive training?","options":["It removes the optimizer","It changes the image resolution","It always improves recall","It pushes semantically related examples apart"],"correctIndex":3,"explanation":"Negative sampling assumptions matter when different examples describe the same concept."},{"id":80,"category":"Transformers and representation learning","question":"What does a KV cache reuse during autoregressive decoding?","options":["Future token labels","Earlier tokens' attention keys and values","Optimizer gradients","The full training dataset"],"correctIndex":1,"explanation":"Cached states avoid recomputing earlier representations, at a memory cost."},{"id":81,"category":"PyTorch training and debugging","question":"What does model.eval() change independently of gradient recording?","options":["All parameters to constants","The optimizer learning rate","Training-dependent behavior such as dropout","Every tensor to CPU memory"],"correctIndex":2,"explanation":"Evaluation mode controls layer behavior. Use a separate no-grad context when gradients are unnecessary."},{"id":82,"category":"PyTorch training and debugging","question":"A leaf parameter already has a gradient. What does another backward pass normally do?","options":["Clears the previous gradient first","Updates the optimizer state","Adds to its existing gradient","Replaces the parameter value"],"correctIndex":2,"explanation":"PyTorch accumulates gradients, so clearing or deliberate accumulation must be managed explicitly."},{"id":83,"category":"PyTorch training and debugging","question":"What should a standard multiclass cross-entropy loss receive as model input?","options":["Rounded probabilities","Unnormalized logits","One-hot predictions","Predicted class indices"],"correctIndex":1,"explanation":"The loss applies the needed log-softmax internally; class indices are commonly used as targets."},{"id":84,"category":"PyTorch training and debugging","question":"What does x.detach() remove?","options":["The tensor's numeric precision","The batch dimension","The autograd connection to x's history","All shared storage"],"correctIndex":2,"explanation":"Detaching stops gradient propagation through that connection but does not make an independent data copy."},{"id":85,"category":"PyTorch training and debugging","question":"Why can a view operation fail after a tensor transpose?","options":["Views require integer tensors","The tensor must have a gradient","The strides may be incompatible with the requested view","Transpose always deletes data"],"correctIndex":2,"explanation":"A reshape may copy when needed; a contiguous copy can also provide compatible storage."},{"id":86,"category":"PyTorch training and debugging","question":"When clipping gradients during loss-scaled mixed-precision training, what comes first?","options":["Update parameters before backward","Reinitialize the scaler each step","Unscale the optimizer's gradients","Clip the scaled loss value"],"correctIndex":2,"explanation":"Clipping should use the true gradient magnitudes before the optimizer update."},{"id":87,"category":"PyTorch training and debugging","question":"Why might saving live loss tensors in a Python list grow GPU memory?","options":["GPU memory cannot be reused","Lists always copy model weights","Losses require a new optimizer","The tensors may retain computation graphs"],"correctIndex":3,"explanation":"Store detached values for logging when the graph is no longer needed."},{"id":88,"category":"PyTorch training and debugging","question":"What is the output shape of a linear layer mapping 32 features to 7, given input (16, 32)?","options":["(16, 7)","(32, 7)","(16, 32, 7)","(7, 16)"],"correctIndex":0,"explanation":"The batch dimension is preserved and the last feature dimension becomes seven."},{"id":89,"category":"PyTorch training and debugging","question":"Why first try to overfit a tiny fixed batch when debugging training?","options":["To eliminate label noise globally","To choose deployment hardware","To establish final generalization","To test whether the model and training loop can learn at all"],"correctIndex":3,"explanation":"Failure on a tiny batch often exposes target, gradient, loss, or optimization mistakes."},{"id":90,"category":"PyTorch training and debugging","question":"Which checkpoint best supports resuming interrupted training?","options":["A random seed without weights","Model, optimizer, scheduler, step, and relevant RNG states","Training accuracy only","Model weights only"],"correctIndex":1,"explanation":"Resumption needs both learned parameters and the evolving training state."},{"id":91,"category":"Evaluating and debugging 3D systems","question":"Why split 3D datasets by scene rather than randomly by nearby views?","options":["Camera labels are unavailable","Random splitting always increases difficulty","Scene IDs determine ground truth perfectly","Nearby views of one scene can leak structure"],"correctIndex":3,"explanation":"A scene-level split better tests generalization to new environments."},{"id":92,"category":"Evaluating and debugging 3D systems","question":"What does PSNR primarily measure?","options":["Physical stability","Semantic completeness","Pixel reconstruction error on a logarithmic scale","Surface topology"],"correctIndex":2,"explanation":"PSNR is based on mean squared pixel error and a specified signal range."},{"id":93,"category":"Evaluating and debugging 3D systems","question":"Why add a perceptual metric to pixel error for generated views?","options":["It removes human evaluation","Similar pixel errors can have different perceptual impact","Pixel error is always meaningless","Perceptual scores prove geometric correctness"],"correctIndex":1,"explanation":"Different metrics capture different aspects of visual quality."},{"id":94,"category":"Evaluating and debugging 3D systems","question":"What should depth-error reporting state?","options":["Units, valid-pixel mask, alignment, and aggregation","Only the number of epochs","Only the model name","Only image width"],"correctIndex":0,"explanation":"Depth comparisons depend strongly on scale conventions and which pixels are included."},{"id":95,"category":"Evaluating and debugging 3D systems","question":"Why can test-time scale alignment hide an important failure?","options":["It removes pose error entirely","A model may not recover the metric scale required by the application","It proves camera calibration","It always reduces every error to zero"],"correctIndex":1,"explanation":"Report whether aligned or absolute geometry is being evaluated and why."},{"id":96,"category":"Evaluating and debugging 3D systems","question":"What does a geometry-versus-appearance ablation help reveal?","options":["The exact utable records"],"correctIndex":1,"explanation":"Values are produced on demand, reducing the need to store the entire sequence."},{"id":12,"category":"Python and numerical computing","question":"Why use a context manager when opening a data file?","options":["It validates every row","It encrypts the file","It makes reads asynchronous","It closes the resource on normal exit and exceptions"],"correctIndex":3,"explanation":"The context manager handles cleanup even when processing raises an exception."},{"id":13,"category":"Python and numerical computing","question":"Two lists reference the same nested dictionary. What does a shallow outer copy preserve?","options":["A recursively independent dictionary","A shared reference to that dictionary","A frozen dictionary","A serialized dictionary"],"correctIndex":1,"explanation":"A shallow copy copies only the outer container; nested mutable objects remain shared."},{"id":14,"category":"Python and numerical computing","question":"NumPy arrays have shapes (8, 1) and (1, 5). What is the shape of their elementwise sum?","options":["(8, 1)","(13,)","(8, 5)","(1, 5)"],"correctIndex":2,"explanation":"Broadcasting expands dimensions of size one to the corresponding non-singleton sizes."},{"id":15,"category":"Python and numerical computing","question":"Which operation best removes a Python loop over numeric array elements?","options":["A suitable vectorized NumPy operation","Adding a try/except block","Converting the array to strings","Replacing the list with a tuple"],"correctIndex":0,"explanation":"Vectorization moves work to compiled array kernels, although memory use still matters."},{"id":16,"category":"Python and numerical computing","question":"A pipeline function catches every exception and returns an empty table. What is the main risk?","options":["Failures become indistinguishable from valid empty results","CPU usage necessarily doubles","The table becomes immutable","Every exception gets retried"],"correctIndex":0,"explanation":"Preserve error context so downstream stages do not silently treat failure as valid data."},{"id":17,"category":"Python and numerical computing","question":"Which dictionary key is valid in ordinary Python?","options":["A list of integers","A dictionary of integers","A tuple of integers","A mutable set of integers"],"correctIndex":2,"explanation":"A tuple of hashable values is hashable; the other listed containers are mutable and unhashable."},{"id":18,"category":"Python and numerical computing","question":"What does a Python type annotation guarantee by itself at runtime?","options":["No automatic enforcement of the annotated type","Validation of nested objects","Conversion to that type","Rejection of incompatible values"],"correctIndex":0,"explanation":"Type hints support tooling; explicit runtime validation is a separate responsibility."},{"id":19,"category":"Python and numerical computing","question":"A function uses an empty list as its default argument and appends to it. What can happen?","options":["The list becomes read-only","Later calls reuse the modified list","Each call gets a new list","Python rejects the function"],"correctIndex":1,"explanation":"Default expressions are evaluated when the function is defined, not at each call."},{"id":20,"category":"Python and numerical computing","question":"Why is a set useful for repeated membership checks over identifiers?","options":["It preserves duplicate counts","Average lookup is constant time under normal hashing","It always retains insertion order","Its worst-case lookup is logarithmic"],"correctIndex":1,"explanation":"Hash-based membership is normally O(1); sets do not preserve multiplicity."},{"id":21,"category":"Data pipelines and reproducibility","question":"What makes a training dataset version reproducible?","options":["A mutable query without a timestamp","A folder named latest","A screenshot of row counts","A stable snapshot or manifest with transformations recorded"],"correctIndex":3,"explanation":"Reproduction requires identifying the exact data and processing steps used."},{"id":22,"category":"Data pipelines and reproducibility","question":"An ingestion job runs twice on the same input. Which property prevents duplicate records?","options":["Appending without checks","Idempotent writes using stable keys","Random record identifiers","Disabling transaction logs"],"correctIndex":1,"explanation":"Stable identity and deduplication or upsert logic make retries safe."},{"id":23,"category":"Data pipelines and reproducibility","question":"Which timestamp should define a historical feature's availability?","options":["When a future correction is published","The end of the target window","When the model is evaluated","When the system could actually know it"],"correctIndex":3,"explanation":"Point-in-time correctness requires using information available before the prediction decision."},{"id":24,"category":"Data pipelines and reproducibility","question":"What does a schema contract detect before training?","options":["Every causal confounder","All mislabeled examples","Unexpected names, types, and required fields","Guaranteed model calibration"],"correctIndex":2,"explanation":"Schema validation catches structural data changes, while semantic checks remain necessary."},{"id":25,"category":"Data pipelines and reproducibility","question":"Why track lineage from a prediction back to source data?","options":["To ensure zero drift","To avoid access control","To investigate how inputs and transformations produced it","To replace all model evaluation"],"correctIndex":2,"explanation":"Lineage records dependencies and transformations, supporting debugging and review."},{"id":26,"category":"Data pipelines and reproducibility","question":"What is a common danger of fitting missing-value imputation before splitting data?","options":["Validation information can influence training transforms","All categorical values disappear","The model becomes deterministic","Missing values are  screenshot","Code, data, configuration, artifacts, and metrics","Only the run name"],"correctIndex":2,"explanation":"A traceable run captures the ingredients needed to compare and reproduce results."},{"id":32,"category":"MLOps and model lifecycle","question":"What is the purpose of a model registry?","options":["Guarantee deployment quality","Store only raw user logs","Manage identifiable model versions and their lifecycle metadata","Replace every feature pipeline"],"correctIndex":2,"explanation":"A registry organizes artifacts and status; evaluation and release controls remain separate."},{"id":33,"category":"MLOps and model lifecycle","question":"Which condition should normally precede automatic retraining?","options":["An arbitrary filename change","A higher cloud bill alone","Defined triggers plus data and evaluation checks","Any single unusual prediction"],"correctIndex":2,"explanation":"Retraining on bad or unrepresentative data can make a production system worse."},{"id":34,"category":"MLOps and model lifecycle","question":"What is training-serving skew?","options":["A mismatch between training and production feature computation","A larger test set","A smaller model file","A random seed difference alone"],"correctIndex":0,"explanation":"Inconsistent feature definitions or transformations can invalidate training assumptions."},{"id":35,"category":"MLOps and model lifecycle","question":"Why version the preprocessing artifact with the model?","options":["Preprocessing has no learned state","It prevents every outage","It automatically encrypts inputs","Predictions depend on both"],"correctIndex":3,"explanation":"A model trained with one vocabulary or scaler may fail with another."},{"id":36,"category":"MLOps and model lifecycle","question":"What should a release gate compare against the candidate model?","options":["Only the newest paper","Only its training runtime","Agreed metrics, slices, and operational constraints","Only parameter count"],"correctIndex":2," meouts bound resource occupation; fallback and retry policies should match the operation."},{"id":47,"category":"Model APIs and service contracts","question":"What is backpressure in a streaming inference service?","options":["Automatically lowering all model weights","Slowing intake when downstream capacity is exhausted","Returning more verbose errors","Deleting every delayed result"],"correctIndex":1,"explanation":"Backpressure prevents unbounded accumulation when producers outrun consumers."},{"id":48,"category":"Model APIs and service contracts","question":"Why include a model version in prediction records?","options":["To reduce input size","To guarantee calibration","To avoid validation entirely","To trace outcomes to the model that produced them"],"correctIndex":3,"explanation":"Version attribution is essential for audits, debugging, and comparing deployment cohorts."},{"id":49,"category":"Model APIs and service contracts","question":"A server uses an asynchronous route. What happens if it runs blocking CPU work on the event-loop thread?","options":["Blocking is automatically removed","Other requests may be delayed","All workers gain more memory","The work becomes GPU accelerated"],"correctIndex":1,"explanation":"Async syntax alone does not make blocking computation non-blocking."},{"id":50,"category":"Model APIs and service contracts","question":"Which service boundary belongs in a model API even when the caller is internal?","options":["Unrestricted filesystem paths","Secrets embedded in responses","Implicit trust in any request","Authentication and authorization appropriate to the data"],"correctIndex":3,"explanation":"Internal deployment does not remove the need to control who may perform which actions."},{"id":51,"category":"Testing, reviews, and CI/CD","question":"What is the strongest unit test for an input normalizer?","options":["Known inputs with independently expected outputs","Training a large model","Checking only that a function exists","Repeating the same implementation in the test"],"correctIndex":0,"explanation":"A useful test checks observable behavior against an independent expectation."},{"id":52,"category":"Testing, reviews, and CI/CD","question":"What does an integration test of an inference service exercise?","options":["Only documentation spelling","Only one arithmetic helper","Interactions among preprocessing, model, and response handling","The entire market response"],"correctIndex":2,"explanation":"Integration tests expose mismatches at component boundaries that isolated tests miss."},{"id":53,"category":"Testing, reviews, and CI/CD","question":"Why include malformed and boundary inputs in API tests?","options":["To guarantee absence of attacks","To improve training accuracy directly","To verify controlled failures as well as valid behavior","To replace all load testing"],"correctIndex":2,"explanation":"Real callers send empty, oversized, missing, or invalid values; handling them is part of the contract."},{"id":54,"category":"Testing, reviews, and CI/CD","question":"Which artifact should a deployment promote after CI passes?","options":["Any image tagged latest","The exact tested build with an immutable identifier","A developer's current notebook","A freshly rebuilt untracked image"],"correctIndex":1,"explanation":"Rebuilding without identity can deploy something different from what was validated."},{"id":55,"category":"Testing, reviews, and CI/CD","question":"What does a contract test most directly detect?","options":["Data drift without labels","Incompatibility between a provider and its consumers","Hardware overheating","All statistical model errors"],"correctIndex":1,"explanation":"Contract tests verify assumptions about shared schemas and interface behavior."},{"id":56,"category":"Testing, reviews, and CI/CD","question":"A stochastic model test fails rarely. What is a better response than ignoring it?","options":["Run only on the author's laptop","Isolate randomness and test meaningful t
