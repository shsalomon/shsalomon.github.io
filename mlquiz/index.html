<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#142c29"><title>Quiz Studio · Practice with purpose</title><style>:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#203a35;background:#f7f8f4;font-synthesis:none;--green:#176b55;--line:#dce3da;--muted:#6e7c75}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #dc9e36;outline-offset:4px}button:disabled{cursor:default}h1,h2,p{margin-top:0}h1:focus,h2:focus{outline:none}.topbar{max-width:1320px;margin:auto;padding:25px 48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{text-decoration:none;color:inherit;font-size:19px;font-weight:750;display:flex;align-items:center;gap:12px}.logo{background:#203e34;color:#eff8a0;border-radius:12px;width:39px;height:39px;text-align:center;font-size:30px;line-height:33px;font-family:Georgia,serif}.topnote{font-size:13px;color:var(--muted)}main{max-width:1224px;margin:auto;padding:0 24px;min-height:calc(100vh - 184px)}.intro{padding:60px 0 46px;display:flex;justify-content:space-between;align-items:center;gap:36px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2px;color:var(--green);margin-bottom:19px}h1{font-size:46px;line-height:1.13;letter-spacing:-1.8px;font-weight:650;margin-bottom:20px}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--green)}.lede{color:var(--muted);font-size:16px;line-height:1.7;margin-bottom:0}.intro-stat{border:1px solid #d9e2b7;background:#eff3da;border-radius:24px;transform:rotate(3deg);padding:25px 30px;width:225px;flex-shrink:0}.intro-stat strong{font-size:48px;letter-spacing:-2px;display:block}.intro-stat span{font-size:13px;line-height:1.7;display:block;max-width:145px}.dots{font-size:23px;color:#84984c;margin-top:16px}.workspace{display:grid;grid-te 10px}.scoring b{display:block;font-size:21px;margin-bottom:5px}.scoring div:first-child b{color:var(--green)}.scoring div:nth-child(2) b{color:#b05a44}.scoring span{font-size:10px;color:var(--muted)}.ready{margin:24px 0}.ready small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--muted)}.ready strong{display:block;font-size:14px;line-height:1.5;margin:8px 0}.ready>span{font-size:11px;color:var(--muted)}.primary{background:var(--green);color:white;border:0;border-radius:10px;padding:15px 20px;font-weight:600;font-size:14px;min-height:48px}.primary:hover{background:#105640}.start{width:100%;display:flex;justify-content:space-between}.private-note{text-align:center;font-size:10px;color:var(--muted);margin:15px 0 0;line-height:1.6}footer{max-width:1224px;margin:auto;padding:24px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.play-top{display:flex;justify-content:space-between;align-items:center;padding:28px 0}.text-button{border:0;background:none;color:var(--muted);padding:10px 0;font-size:13px}.pill{background:#e8eedf;border-radius:30px;padding:8px 14px;font-size:12px}.play{max-width:800px;margin:12px auto 65px}.progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:24px 0 12px}.progress-label b{color:var(--green)}#timer{font-size:20px;font-variant-numeric:tabular-nums}#timer.urgent{color:#b5412c}.progress{height:5px;border-radius:6px;background:#e1e8df;overflow:hidden;margin-bottom:26px}.progress span{height:100%;display:block;background:var(--green)}.question-card{padding:32px;border:1px solid var(--line);border-radius:20px;background:#fff}.category{color:var(--green);font-size:12px;margin-bottom:15px}.question-card h1{font-size:27px;letter-spacing:-.5px;line-height:1.4;margin-bottom:30px;overflow-wrap:anywhere}.answers{display:grid;gap:12px}.answer{display:flex;align-items:center;gap:15px;text-align:left;border:1px solid var(--line);border-radius:11px;background:#fff;min-height:64px;padding:14px 17px;color:inherit;font-size:15px;line-height:1.5;overflow-wrap:anywhere}.letter{flex-shrink:0;border:1px solid var(--line);background:#f8f9f5;border-radius:7px;display:grid;place-items:center;width:30px;height:30px;font-size:12px;color:var(--muted)}.answer-mark{margin-left:auto;font-size:20px}.answer:hover:not(:disabled){border-color:var(--green);background:#f2f6ee}.answer.correct{border-color:#4a9472;background:#eef7ee}.answer.wrong{border-color:#c87564;background:#fcf0ed}.question-bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:25px}.question-bottom .muted{text-align:right;line-height:1.6}.secondary{border:1px solid var(--line);border-radius:10px;padding:13px 18px;background:#fff;color:inherit;font-size:13px;min-height:46px}.secondary:hover{background:#f1f5ee}.skip{white-space:nowrap}.feedback{margin-top:22px;border-radius:10px;background:#eff6ed;padding:18px;font-size:14px;line-height:1.6}.feedback p{margin:8px 0 0}.feedback.negative{background:#fcf3ec}.results{max-width:900px;margin:45px auto 70px}.results h1{font-size:36px}.result-summary{display:flex;align-items:center;gap:40px;margin:30px 0 18px;padding:30px;border:1px solid var(--line);background:white;border-radius:18px}.score{border-right:1px solid var(--line);padding-right:40px}.score strong{display:block;font-size:64px;line-height:1.2;color:var(--green);letter-spacing:-3px}.score span{font-size:11px;color:var(--muted);white-space:nowrap}.result-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1}.result-counts b{font-size:26px;display:block}.result-counts span{font-size:11px;color:var(--muted)}.result-actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0 42px}.review{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.review summary{display:flex;list-style:none;align-items:center;gap:16px;cursor:pointer;padding:20px;font-size:14px;line-height:1.5}.review summary::-webkit-details-marker{display:none}.review summary>span:nth-child(2){flex:1}.review summary small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.status{font-size:10px;background:#f1ecdf;border-radius:6px;padding:5px 8px;white-space:nowrap}.status.wrong{color:#9c4935;background:#faede7}.review-content{border-top:1px solid var(--line);margin:0 20px;padding-top:15px;font-size:14px;line-height:1.7}.correct-text{color:var(--green)}.empty{padding:32px;background:#edf4e6;border-radius:12px;line-height:1.6}.count{font-size:12px;background:#e7ecdf;border-radius:20px;padding:4px 8px}
@media(min-width:1400px){.intro{padding-top:75px;padding-bottom:55px}}@media(max-width:1000px){.workspace{grid-template-columns:minmax(0,1fr) 300px;gap:22px}.sets{grid-template-columns:1fr}.set{min-height:110px}.intro-stat{width:200px}h1{font-size:40px}.setup{padding:20px}.result-counts{gap:14px}}@media(max-width:700px){.topbar{padding:18px 20px}.topnote{display:none}main{padding:0 18px}.intro{padding:36px 0 30px}.intro-stat{display:none}h1{font-size:35px;letter-spacing:-1px}.lede{font-size:14px}.workspace{display:flex;flex-direction:column;gap:25px}.workspace>div,.setup{width:100%}.setup{position:static}.sets{grid-template-columns:1fr 1fr;gap:9px}.set{padding:15px 10px;gap:8px;min-height:150px}.set.selected{padding:14px 9px}.set strong{font-size:13px}.set small,.set-meta{font-size:10px}.set-number{display:none}.section-heading{align-items:flex-start}.section-heading h2{font-size:14px}.section-heading>.muted{font-size:10px}.mode small{font-size:11px}.mode{padding:15px}.mode-description{min-height:0}.play-top{padding:18px 0}.play{margin-top:8px}.play .eyebrow{font-size:10px;line-height:1.7}.question-card{padding:22px 16px}.question-card h1{font-size:22px}.answer{padding:12px;font-size:14px;gap:10px}.question-bottom{align-items:flex-start}.question-bottom .muted{font-size:10px}.results{margin-top:30px}.results h1{font-size:30px}.result-summary{flex-direction:column;align-items:stretch;gap:22px;padding:24px}.score{border-right:0;border-bottom:1px solid var(--line);padding:0 0 22px;text-align:center}.result-counts{gap:10px;text-align:center}.result-counts b{font-size:23px}.result-counts span{font-size:10px}.review summary{padding:16px;gap:10px;flex-wrap:wrap}.review summary>span:nth-child(2){flex-basis:70%}.review summary>span:last-child{display:none}footer{flex-direction:column;padding:20px 18px}.result-actions button{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body><header class="topbar"><a href="#" class="brand"><span class="logo">q.</span> Quiz Studio</a><span class="topnote">A little practice. A lot of progress.</span></header><main id="app"></main><footer>Made for focused learning <span>10 sets · 1,000 questions · All local</span></footer>
<script>
const QUIZ_DATA = [{"stem":"ml_engineer_medical_computer_vision_mlops","title":"ML Engineer","subtitle":"Medical Computer Vision & MLOps","company":"StellDirVor GmbH","questions":[{"id":1,"category":"Medical data and annotation","question":"Repeated wound images come from the same patient. Which split best tests generalization to new patients?","options":["Duplicate rare images into the test set","Put adjacent frames in different splits","Separate patients across splits","Randomly split all images"],"correctIndex":2,"explanation":"Patient-level grouping prevents near-duplicate and patient-specific information from leaking across splits."},{"id":2,"category":"Medical data and annotation","question":"Two clinicians disagree on a wound boundary. What is the best first response?","options":["Review guidelines and use an agreed adjudication process","Assume one clinician is always correct","Average image pixels","Delete every disagreement"],"correctIndex":0,"explanation":"Disagreement may reveal ambiguity in the task or annotation protocol."},{"id":3,"category":"Medical data and annotation","question":"What should a medical-image data sheet record?","options":["Only file extensions","Only image dimensions","Acquisition, population, labeling process, and limitations","Only model accuracy"],"correctIndex":2,"explanation":"Dataset context helps interpret generalization and appropriate use."},{"id":4,"category":"Medical data and annotation","question":"What should be verified before acquiring patient images for a new ML purpose?","options":["Only whether files can be downloaded","Approved authority, permitted use, access, and governance requirements","Only whether names were cropped","Only image resolution"],"correctIndex":1,"explanation":"Technical access does not establish permission for the proposed data use."},{"id":5,"category":"Medical data and annotation","question":"Does replacing patient names with reversible identifiers necessarily make the data anonymous?","options":["No, linkage can still identify people","Only image size determines anonymity","Yes, if stored as CSV","Yes, any numeric ID is anonymous"],"correctIndex":0,"explanation":"Pseudonymized data can remain personal data when re-identification is possible."},{"id":6,"category":"Medical data and annotation","question":"What is a useful annotation quality check?","options":["Removing all rare cases","Assuming experts never disagree","Counting annotator clicks only","A reviewed sample with agreement and error analysis"],"correctIndex":3,"explanation":"Sampling helps detect inconsistent interpretation and systematic labeling errors."},{"id":7,"category":"Medical data and annotation","question":"A model performs poorly on darker skin tones. What data action is most informative first?","options":["Increase every image's brightness","Report only aggregate accuracy","Audit representation and errors by relevant groups","Remove that subgroup"],"correctIndex":2,"explanation":"Investigate coverage, acquisition conditions, and labels before selecting a remedy."},{"id":8,"category":"Medical data and annotation","question":"What is the risk of using a hospital watermark as an accidental predictive feature?","options":["Watermarks always improve clinical validity","Calibration is guaranteed","The model may learn site shortcuts","The target becomes unbiased"],"correctIndex":2,"explanation":"A site marker can correlate with labels in development but fail elsewhere."},{"id":9,"category":"Medical data and annotation","question":"Which synthetic-data check most directly addresses memorization risk?","options":["Measure only file compression","Search for close matches to sensitive training examples","Inspect only image sharpness","Count generated images"],"correctIndex":1,"explanation":"Synthetic output can reproduce training information; visual realism does not prove privacy."},{"id":10,"category":"Medical data and annotation","question":"Why retain image acquisition metadata where permitted?","options":["To investigate device, lighting, and protocol effects","To guarantee consent","To infer every clinical diagnosis","To avoid image labels"],"correctIndex":0,"explanation":"Metadata can expose systematic domain differences and support reproducible processing."},{"id":11,"category":"Detection and segmentation","question":"Which output is required to outline each wound pixel?","options":["A camera serial number","A segmentation mask","A single image-level label","An unordered class list"],"correctIndex":1,"explanation":"Segmentation assigns labels at pixel level rather than only classifying the whole image."},{"id":12,"category":"Detection and segmentation","question":"How does instance segmentation differ from semantic segmentation?","options":["It separates individual objects of the same class","It uses no pixels","It always uses depth sensors","It cannot predict classes"],"correctIndex":0,"explanation":"Instance masks preserve identity among separate objects with the same category."},{"id":13,"category":"Detection and segmentation","question":"Two masks contain 60 and 40 pixels, with 30 shared pixels. What is Dice?","options":["0.75","0.43","0.60","0.30"],"correctIndex":2,"explanation":"Dice is twice the intersection divided by the sum of mask sizes: 60/100."},{"id":14,"category":"Detection and segmentation","question":"Using the same mask sizes, what is intersection over union?","options":["0.75","0.60","0.30","About 0.43"],"correctIndex":3,"explanation":"The union has 60 + 40 - 30 = 70 pixels; IoU is 30/70."},{"id":15,"category":"Detection and segmentation","question":"Why can pixel accuracy mislead when a wound occupies 1% of an image?","options":["It ignores background pixels","Predicting background everywhere is already 99% accurate","It directly measures boundary quality","It equals lesion recall"],"correctIndex":1,"explanation":"Use foreground-sensitive overlap and error metrics alongside clinically relevant evaluation."},{"id":16,"category":"Detection and segmentation","question":"What should happen to a segmentation mask during random image cropping?","options":["Leave the mask unchanged","Crop the mask independently","Shuffle mask pixels","Apply the corresponding crop to the mask"],"correctIndex":3,"explanation":"Geometric transforms must preserve alignment between inputs and spatial labels."},{"id":17,"category":"Detection and segmentation","question":"Why use nearest-neighbor interpolation for discrete class masks?","options":["It always smooths boundaries best","It avoids creating fractional class IDs","It increases label confidence","It invents new valid classes"],"correctIndex":1,"explanation":"Continuous interpolation can create meaningless intermediate labels."},{"id":18,"category":"Detection and segmentation","question":"What does non-maximum suppression usually remove?","options":["Every true negative","The highest-scoring box first","Redundant overlapping detections","Every low-resolution image"],"correctIndex":2,"explanation":"Standard greedy NMS retains a strong box and suppresses sufficiently overlapping weaker boxes."},{"id":19,"category":"Detection and segmentation","question":"Why inspect boundary-specific errors alongside Dice?","options":["Similar overlap can hide different edge mistakes","All masks with equal Dice are equivalent","Dice measures only color","Boundary errors never affect area"],"correctIndex":0,"explanation":"A small boundary shift can matter for measurement even when overlap is high."},{"id":20,"category":"Detection and segmentation","question":"What is a risk of aggressive lesion-mask post-processing?","options":["Eliminating all annotation uncertainty","Making labels independent of images","Guaranteed better recall","Removing real small or disconnected regions"],"correctIndex":3,"explanation":"Morphological cleanup should be evaluated against the intended anatomy and task."},{"id":21,"category":"Transfer and semi-supervised learning","question":"What does freezing a pretrained backbone normally prevent?","options":["All forward computation","Loading its parameters","Updates to its trainable weights","Training the new head"],"correctIndex":2,"explanation":"Frozen weights can still produce useful features for a trainable task-specific head."},{"id":22,"category":"Transfer and semi-supervised learning","question":"Why often start fine-tuning with a smaller backbone learning rate?","options":["To avoid needing validation","To guarantee zero overfitting","To force all weights to zero","To preserve useful features while adapting them"],"correctIndex":3,"explanation":"Large updates on a small target dataset can destroy valuable pretrained structure."},{"id":23,"category":"Transfer and semi-supervised learning","question":"What must be checked when reusing a pretrained image model's input pipeline?","options":["Only GPU count","Only the optimizer name","Channel order, scaling, resizing, and normalization","Only the filename"],"correctIndex":2,"explanation":"A preprocessing mismatch can undermine transferred features before training begins."},{"id":24,"category":"Transfer and semi-supervised learning","question":"Why is a frozen-feature linear probe useful?","options":["It proves full fine-tuning cannot help","It removes domain shift","It measures only GPU speed","It tests how informative existing representations are"],"correctIndex":3,"explanation":"A simple head gives a low-cost baseline for representation transfer."},{"id":25,"category":"Transfer and semi-supervised learning","question":"What is negative transfer?","options":["Validation loss becomes negative","Every frozen model fails","Pretraining harms target-task performance relative to an appropriate baseline","The target has fewer classes"],"correctIndex":2,"explanation":"Source features or assumptions may be poorly matched to the target domain."},{"id":26,"category":"Transfer and semi-supervised learning","question":"What is a central risk of training on unfiltered pseudo-labels?","options":["Eliminating class imbalance","Creating independent ground truth","Guaranteeing privacy","Reinforcing the model's own mistakes"],"correctIndex":3,"explanation":"Incorrect predictions can become self-reinforcing training targets."},{"id":27,"category":"Transfer and semi-supervised learning","question":"Why use a confidence threshold for pseudo-label selection?","options":["To make the test set larger","To guarantee selected labels are correct","To balance classes automatically","To reduce inclusion of uncertain predictions"],"correctIndex":3,"explanation":"Thresholds trade quantity against estimated quality and require calibration checks."},{"id":28,"category":"Transfer and semi-supervised learning","question":"What is the aim of consistency regularization?","options":["Identical outputs for unrelated images","Similar predictions under appropriate input perturbations","Zero gradients for all inputs","Replacing labels with filenames"],"correctIndex":1,"explanation":"Perturbations should preserve the task-relevant semantics."},{"id":29,"category":"Transfer and semi-supervised learning","question":"When mixing source and target-domain examples, what should evaluation emphasize?","options":["Source accuracy alone","Only the larger dataset","Target-domain performance and relevant subgroups","The combined training accuracy"],"correctIndex":2,"explanation":"The target deployment determines whether adaptation is useful."},{"id":30,"category":"Transfer and semi-supervised learning","question":"Why avoid using test images for selecting a fine-tuning schedule?","options":["Fine-tuning cannot use labels","It prevents training completion","Test images always have wrong colors","Schedule selection would leak test information"],"correctIndex":3,"explanation":"Use validation data for choices and reserve the test set for final assessment."},{"id":31,"category":"Cameras and multi-view geometry","question":"For a pinhole camera, u = fx*X/Z + cx. With fx=600, X=1, Z=3, cx=320, what is u?","options":["200 pixels","520 pixels","320 pixels","920 pixels"],"correctIndex":1,"explanation":"Project X/Z onto the image and add the principal point: 600/3 + 320."},{"id":32,"category":"Cameras and multi-view geometry","question":"What does a camera intrinsic matrix encode?","options":["Scene object identities","Focal lengths and principal point under the camera model","Camera-to-world translation only","World-space object velocity"],"correctIndex":1,"explanation":"Intrinsics map camera-frame rays into image coordinates."},{"id":33,"category":"Cameras and multi-view geometry","question":"Given x_camera = R*x_world + t, where is the camera center in world coordinates?","options":["R*t","t","-t for every R","-transpose(R)*t"],"correctIndex":3,"explanation":"Set camera coordinates to zero and invert the rigid transformation."},{"id":34,"category":"Cameras and multi-view geometry","question":"What is the inverse of a proper rotation matrix R?","options":["Twice R","Its transpose","Its negative","Its determinant"],"correctIndex":1,"explanation":"Orthogonality gives transpose(R)*R = I."},{"id":35,"category":"Cameras and multi-view geometry","question":"Stereo focal length is 500 pixels, baseline 0.2 m, and disparity 25 pixels. What is depth?","options":["2 m","10 m","4 m","0.04 m"],"correctIndex":2,"explanation":"Rectified stereo depth is focal length times baseline divided by disparity."},{"id":36,"category":"Cameras and multi-view geometry","question":"What happens to stereo depth uncertainty as disparity approaches zero?","options":["Depth becomes exactly known","It generally increases strongly","Baseline no longer matters","It necessarily vanishes"],"correctIndex":1,"explanation":"Depth varies inversely with disparity, making distant estimates sensitive to small disparity errors."},{"id":37,"category":"Cameras and multi-view geometry","question":"What does the fundamental matrix relate in two undistorted images?","options":["Object class to surface normal","RGB values to depth directly","A pixel point to an epipolar line","Camera exposure to focal length"],"correctIndex":2,"explanation":"Correspondences must satisfy the epipolar constraint under the two-view geometry."},{"id":38,"category":"Cameras and multi-view geometry","question":"What ambiguity remains in calibrated monocular reconstruction without metric cues?","options":["The number of color channels","Whether pixels are discrete","Every image dimension","Global scale"],"correctIndex":3,"explanation":"Scaling the scene and camera translations together can leave projections unchanged."},{"id":39,"category":"Cameras and multi-view geometry","question":"An image is resized by a factor of 0.5 in both dimensions. What happens to pixel-valued focal lengths?","options":["They are multiplied by 0.5","They become zero","They stay unchanged","They are doubled"],"correctIndex":0,"explanation":"Intrinsics expressed in pixels must follow the image coordinate scaling."},{"id":40,"category":"Cameras and multi-view geometry","question":"Why correct lens distortion before using an ideal pinhole reconstruction model?","options":["Distortion changes the number of cameras","Correction eliminates occlusion","Distorted pixels violate its simple projection assumptions","Correction supplies ground-truth depth"],"correctIndex":2,"explanation":"Geometry must match the image formation model used in estimation."},{"id":41,"category":"Diffusion-model foundations","question":"What is the forward process in a standard denoising diffusion model?","options":["Directly classifying clean inputs","Sorting training examples","Gradually corrupting data with noise","Rendering a fixed mesh"],"correctIndex":2,"explanation":"The forward corruption defines noisy states used to train the reverse denoising process."},{"id":42,"category":"Diffusion-model foundations","question":"What does a noise-prediction diffusion objective train the network to estimate?","options":["The noise added to a sampled training example","The final optimizer state","The example's filename","Every class label"],"correctIndex":0,"explanation":"The network receives a noisy sample and noise-level information to estimate the corruption."},{"id":43,"category":"Diffusion-model foundations","question":"Why condition a denoiser on the timestep or noise level?","options":["It guarantees a single output","The required denoising operation depends on corruption strength","It directly identifies the training image","It removes all stochasticity"],"correctIndex":1,"explanation":"Different noise levels represent different reconstruction difficulties."},{"id":44,"category":"Diffusion-model foundations","question":"What is the starting point of ordinary unconditional diffusion sampling?","options":["A noise sample","The optimizer checkpoint","The final test label","A sorted training image list"],"correctIndex":0,"explanation":"A learned reverse process transforms noise into a sample from the modeled distribution."},{"id":45,"category":"Diffusion-model foundations","question":"What does classifier-free guidance combine?","options":["Two camera matrices","Only real and fake class labels","Two unrelated test datasets","Conditional and unconditional predictions"],"correctIndex":3,"explanation":"Their difference can strengthen conditioning during generation."},{"id":46,"category":"Diffusion-model foundations","question":"What is a common effect of excessively strong guidance?","options":["Better prompt pressure but reduced diversity or artifacts","Unlimited sampling speed","Exact reconstruction of all prompts","Guaranteed perfect realism"],"correctIndex":0,"explanation":"Guidance creates a quality, adherence, and diversity trade-off that needs evaluation."},{"id":47,"category":"Diffusion-model foundations","question":"Why compare different sampling step counts?","options":["They trade generation cost against output quality","Steps only affect file size","More steps always improve every metric","Step count changes the dataset license"],"correctIndex":0,"explanation":"The best operating point depends on the model, sampler, and task."},{"id":48,"category":"Diffusion-model foundations","question":"What does a diffusion noise schedule determine?","options":["The GPU billing currency","How corruption changes across timesteps","The class vocabulary order","The image filename"],"correctIndex":1,"explanation":"The schedule affects signal-to-noise levels encountered during learning and sampling."},{"id":49,"category":"Diffusion-model foundations","question":"Why is a fixed seed useful when comparing prompt or sampler changes?","options":["It makes the model deterministic on all hardware","It controls one source of sampling variation","It replaces multiple-seed evaluation","It guarantees identical outputs across every implementation"],"correctIndex":1,"explanation":"Controlled randomness supports comparison, while broader evaluation still needs variation."},{"id":50,"category":"Diffusion-model foundations","question":"What is a basic limitation of a single attractive generated example?","options":["It proves the model cannot generalize","It proves no memorization","It measures training loss exactly","It does not establish distribution-wide quality"],"correctIndex":3,"explanation":"Evaluate representative prompts, seeds, failure modes, and held-out conditions."},{"id":51,"category":"RGB, depth, and sensor fusion","question":"What does camera-to-depth extrinsic calibration describe?","options":["Relative rotation and translation","Class frequencies","Image contrast","The optimizer schedule"],"correctIndex":0,"explanation":"Extrinsics align observations expressed in different sensor coordinate frames."},{"id":52,"category":"RGB, depth, and sensor fusion","question":"Why must sensor timestamps be aligned for moving subjects?","options":["Spatially calibrated inputs can still describe different moments","Calibration removes all time offsets","Time alignment changes class labels","Timestamps affect only filenames"],"correctIndex":0,"explanation":"Motion between acquisitions can create false spatial correspondences."},{"id":53,"category":"RGB, depth, and sensor fusion","question":"What is early fusion in a common fusion taxonomy?","options":["Selecting one modality permanently","Voting across trained models only","Combining raw or lightly processed inputs","Combining final decisions only"],"correctIndex":2,"explanation":"Early fusion combines information before substantial modality-specific feature extraction."},{"id":54,"category":"RGB, depth, and sensor fusion","question":"What is intermediate fusion?","options":["Combining final reports only","Combining learned modality features","Averaging training losses only","Concatenating model names"],"correctIndex":1,"explanation":"Feature-level interaction lets the model learn complementary information across modalities."},{"id":55,"category":"RGB, depth, and sensor fusion","question":"What is late fusion?","options":["Combining separate predictions","Aligning raw timestamps","Calibrating camera intrinsics","Joining raw pixel channels"],"correctIndex":0,"explanation":"Decision-level fusion combines outputs from modality-specific processing."},{"id":56,"category":"RGB, depth, and sensor fusion","question":"Which training strategy prepares a fusion model for a missing depth stream?","options":["Simulated modality dropout with explicit missingness handling","Replacing every missing map with a valid-looking constant silently","Removing all RGB examples","Testing only fully observed inputs"],"correctIndex":0,"explanation":"The model needs training and evaluation coverage of realistic sensor failures."},{"id":57,"category":"RGB, depth, and sensor fusion","question":"Why distinguish an invalid depth value from a true zero distance?","options":["Invalid values cannot be masked","Zero is never numeric","Both always mean contact","They represent different information"],"correctIndex":3,"explanation":"Missingness should not masquerade as a physical measurement."},{"id":58,"category":"RGB, depth, and sensor fusion","question":"What is needed to express a depth-map pixel as a 3D camera-frame point?","options":["Only the class score","Only the file size","Only RGB intensity","Depth and camera intrinsics under a defined convention"],"correctIndex":3,"explanation":"Back-projection uses the calibrated ray and the meaning of the stored depth value."},{"id":59,"category":"RGB, depth, and sensor fusion","question":"Which evaluation isolates the value added by a second sensor?","options":["Matched RGB-only and fused-model comparisons","Comparing training losses on unrelated data","Comparing different patient test sets","Reporting only sensor price"],"correctIndex":0,"explanation":"An ablation under common conditions measures the incremental benefit and failure trade-offs."},{"id":60,"category":"RGB, depth, and sensor fusion","question":"Why might correlated sensor errors cause overconfident fusion?","options":["The system can count shared information twice","More sensors always give independent evidence","Correlation removes all uncertainty","It prevents coordinate conversion"],"correctIndex":0,"explanation":"Fusion uncertainty must account for dependencies rather than assuming independent errors."},{"id":61,"category":"Edge models and voice interfaces","question":"What is the primary output of speech-to-text?","options":["A depth map","Synthesized audio","A segmentation mask","A transcription"],"correctIndex":3,"explanation":"ASR maps speech audio to text; downstream intent handling is a separate stage."},{"id":62,"category":"Edge models and voice interfaces","question":"What does voice activity detection estimate?","options":["The model's training loss","Speaker consent","Whether speech is present over time","The correct clinical diagnosis"],"correctIndex":2,"explanation":"VAD can help segment speech but does not establish what was said."},{"id":63,"category":"Edge models and voice interfaces","question":"What matters most for a hands-free interactive response budget?","options":["End-to-end capture-to-response latency","Number of model layers alone","Training epochs alone","Decoder speed alone"],"correctIndex":0,"explanation":"Audio capture, endpointing, transcription, reasoning, and synthesis all contribute."},{"id":64,"category":"Edge models and voice interfaces","question":"Why test an ASR model with device-specific noise and accents?","options":["Clean benchmarks guarantee field accuracy","Noise affects only file size","Accents always require separate hardware","They can change recognition error patterns"],"correctIndex":3,"explanation":"Deployment conditions can differ substantially from training and benchmark audio."},{"id":65,"category":"Edge models and voice interfaces","question":"What must follow model quantization for a wearable?","options":["Remove the evaluation set","Recheck quality, latency, memory, and thermal behavior","Assume accuracy is unchanged","Measure only model file size"],"correctIndex":1,"explanation":"Reduced precision is a deployment change whose benefits and regressions need measurement."},{"id":66,"category":"Edge models and voice interfaces","question":"Why can on-device processing help a disconnected workflow?","options":["It eliminates all privacy risks","It guarantees unlimited compute","It reduces dependence on network availability","It guarantees clinical validity"],"correctIndex":2,"explanation":"Local execution trades network reliance against device compute, power, and maintenance constraints."},{"id":67,"category":"Edge models and voice interfaces","question":"What should a voice interface do with an ambiguous high-impact command?","options":["Request clarification before the action","Guess from the most frequent command","Execute all plausible actions","Suppress the ambiguity"],"correctIndex":0,"explanation":"Confidence alone is insufficient when a mistaken action has significant consequences."},{"id":68,"category":"Edge models and voice interfaces","question":"What is a useful fallback when the speech pipeline cannot understand the user?","options":["An unbounded listening loop","A clear retry or alternative input path","Silent success","Invented transcription"],"correctIndex":1,"explanation":"The user needs to know that the request was not reliably understood."},{"id":69,"category":"Edge models and voice interfaces","question":"What does a runtime compatibility check for an exported model establish?","options":["The data is anonymous","All task accuracy is preserved","Required operators and shapes work on the target backend","The device never overheats"],"correctIndex":2,"explanation":"Successful export is only one step; the deployed graph must execute correctly."},{"id":70,"category":"Edge models and voice interfaces","question":"Why measure sustained wearable performance rather than a single cold run?","options":["Warm hardware always becomes faster","Thermal and power limits may reduce sustained speed","One run proves all conditions","Sustained tests replace accuracy checks"],"correctIndex":1,"explanation":"Real interaction sessions can expose throttling and energy constraints."},{"id":71,"category":"MLOps and model lifecycle","question":"What should an experiment record connect?","options":["Only a training screenshot","Code, data, configuration, artifacts, and metrics","Only the run name","Only the final accuracy"],"correctIndex":1,"explanation":"A traceable run captures the ingredients needed to compare and reproduce results."},{"id":72,"category":"MLOps and model lifecycle","question":"What is the purpose of a model registry?","options":["Replace every feature pipeline","Store only raw user logs","Manage identifiable model versions and their lifecycle metadata","Guarantee deployment quality"],"correctIndex":2,"explanation":"A registry organizes artifacts and status; evaluation and release controls remain separate."},{"id":73,"category":"MLOps and model lifecycle","question":"Which condition should normally precede automatic retraining?","options":["Any single unusual prediction","An arbitrary filename change","Defined triggers plus data and evaluation checks","A higher cloud bill alone"],"correctIndex":2,"explanation":"Retraining on bad or unrepresentative data can make a production system worse."},{"id":74,"category":"MLOps and model lifecycle","question":"What is training-serving skew?","options":["A smaller model file","A larger test set","A random seed difference alone","A mismatch between training and production feature computation"],"correctIndex":3,"explanation":"Inconsistent feature definitions or transformations can invalidate training assumptions."},{"id":75,"category":"MLOps and model lifecycle","question":"Why version the preprocessing artifact with the model?","options":["Predictions depend on both","It prevents every outage","Preprocessing has no learned state","It automatically encrypts inputs"],"correctIndex":0,"explanation":"A model trained with one vocabulary or scaler may fail with another."},{"id":76,"category":"MLOps and model lifecycle","question":"What should a release gate compare against the candidate model?","options":["Agreed metrics, slices, and operational constraints","Only its training runtime","Only parameter count","Only the newest paper"],"correctIndex":0,"explanation":"Promotion requires evidence that relevant quality and reliability thresholds are met."},{"id":77,"category":"MLOps and model lifecycle","question":"What does reproducibility mean for a stochastic training experiment?","options":["Identical results on every possible device","No randomness anywhere","A single seed without data versions","Sufficient recorded detail to rerun and assess expected variation"],"correctIndex":3,"explanation":"Hardware and kernels may vary; record conditions and report variation honestly."},{"id":78,"category":"MLOps and model lifecycle","question":"Why keep a rejected model version's evaluation record?","options":["To preserve the reason for the decision","To increase training loss","To force later deployment","To replace source data"],"correctIndex":0,"explanation":"Negative results prevent repeated mistakes and make decisions auditable."},{"id":79,"category":"MLOps and model lifecycle","question":"What is a champion-challenger comparison?","options":["Comparing two unrelated datasets","Comparing a proposed model against the current accepted model","Removing the production baseline","Testing only the larger model"],"correctIndex":1,"explanation":"A stable incumbent makes the effect of a candidate change easier to judge."},{"id":80,"category":"MLOps and model lifecycle","question":"What should be included in a handover for an operated ML service?","options":["Only the notebook","Ownership, runbook, dependencies, metrics, and recovery steps","Only a paper citation","Only a model binary"],"correctIndex":1,"explanation":"An operational system needs maintainable processes as well as a trained model."},{"id":81,"category":"Clinical validation and responsible use","question":"What does a saliency map by itself establish?","options":["Which input regions a method highlights, not clinical correctness","Regulatory approval","Freedom from bias","A causal diagnosis"],"correctIndex":0,"explanation":"Explanation artifacts require their own scrutiny and do not validate a model's conclusions."},{"id":82,"category":"Clinical validation and responsible use","question":"Why compare model measurements with reviewed clinician assessments?","options":["To assess agreement on the intended task","To prove clinicians never err","To replace all patient-level splits","To avoid defining metrics"],"correctIndex":0,"explanation":"Evaluation needs an appropriate reference standard and an understanding of its uncertainty."},{"id":83,"category":"Clinical validation and responsible use","question":"What does a confidence interval around a sensitivity estimate convey?","optio end on what each error causes in the intended workflow."},{"id":88,"category":"Clinical validation and responsible use","question":"What does adversarial robustness testing add to ordinary clean-image evaluation?","options":["A substitute for data governance","Proof against all possible attacks","Evidence about specified perturbation scenarios","Guaranteed clinical utility"],"correctIndex":2,"explanation":"Robustness results are bounded by the attack model and evaluation conditions."},{"id":89,"category":"Clinical validation and responsible use","question":"A high-performing model uses patient identifiers as inputs. What should be investigated?","options":["Whether labels can be discarded","Whether the optimizer is too slow","Leakage, necessity, and permitted use","Whether identifiers increase resolution"],"correctIndex":2,"explanation":"Strong performance may depend on shortcuts or information unavailable in legitimate deployment."},{"id":90,"category":"Clinical validation and responsible use","question":"Who should determine how a proposed medical AI use fits applicable governance obligations?","options":["An automatic confidence threshold","The fastest benchmark author","The model's generated answer alone","The responsible clinical, privacy, and regulatory stakeholders with the technical team"],"correctIndex":3,"explanation":"Technical evidence supports the decision; it does not independently establish legal or clinical authorization."},{"id":91,"category":"Cloud choices and operating costs","question":"Two GPUs run for 6 hours at EUR 2.50 per GPU-hour. What is compute cost before extras?","options":["EUR 5","EUR 60","EUR 30","EUR 15"],"correctIndex":2,"explanation":"Multiply GPU count, duration, and unit price: 2 times 6 times 2.50."},{"id":92,"category":"Cloud choices and operating costs","question":"Which cost can be missed when comparing cloud inference prices?","options":["The Python indentation style","Data transfer and idle capacity","Only the number of classes","Only the model's title"],"correctIndex":1,"explanation":"Total cost includes storage, networking, operations, and unused capacity as applicable."},{"id":93,"category":"Cloud choices and operating costs","question":"When is a batch prediction job often preferable to always-on serving?","options":["Outputs cannot be stored","Inputs never change","Every request needs an immediate answer","Results are needed only on a fixed schedule"],"correctIndex":3,"explanation":"Scheduled computation can avoid maintaining continuously available inference capacity."},{"id":94,"category":"Cloud choices and operating costs","question":"What makes interruptible compute suitable for some training jobs?","options":["Guaranteed uninterrupted runtime","Unlimited free capacity","No need for persistent storage","Checkpointing and tolerance of restarts"],"correctIndex":3,"explanation":"Lower prices can be useful when the workload can recover from eviction."},{"id":95,"category":"Cloud choices and operating costs","question":"Why compare cost per successful task rather than cost per token alone?","options":["Token price is always irrelevant","Every model uses equal tokens","Retries, quality, and task length affect real cost","Success never needs definition"],"correctIndex":2,"explanation":"A cheap unit price may produce expensive failed or repeated work."},{"id":96,"category":"Cloud choices and operating costs","question":"A service costs EUR 120 daily and completes 6,000 useful tasks. What is cost per useful task?","options":["EUR 2","EUR 0.20","EUR 50","EUR 0.02"],"correctIndex":3,"explanation":"Divide total cost by successful tasks: 120/6000."},{"id":97,"category":"Cloud choices and operating costs","question":"What is a defensible first build-versus-buy comparison?","options":["Vendor popularity alone","Required quality, integration, control, and total ownership cost","License price alone","Model parameter count alone"],"correctIndex":1,"explanation":"Maintenance, data constraints, ft row"],"correctIndex":2,"explanation":"A left join preserves unmatched rows from its left input."},{"id":3,"category":"SQL joins, grouping, and NULLs","question":"A user has three matching purchases. How many rows does an ordinary join produce for that user?","options":["Nine","Zero","One","Three"],"correctIndex":3,"explanation":"One-to-many joins expand rows; aggregate at the intended grain before interpreting metrics."},{"id":4,"category":"SQL joins, grouping, and NULLs","question":"Which clause filters groups after aggregation?","options":["ORDER BY","WHERE","DISTINCT","HAVING"],"correctIndex":3,"explanation":"WHERE filters input rows; HAVING filters the resulting groups."},{"id":5,"category":"SQL joins, grouping, and NULLs","question":"How should SQL test whether a value is missing?","options":["= 0","= NULL","= 'NULL'","IS NULL"],"correctIndex":3,"explanation":"NULL uses three-valued logic; equality to NULL does not produce an ordinary true match."},{"id":6,"category":"SQL joins, grouping, and NULLs","question":"What does UNION ALL preserve that UNION normally removes?","options":["NULL values","Numeric types","Duplicate result rows","Column names"],"correctIndex":2,"explanation":"UNION applies duplicate elimination; UNION ALL concatenates results without that step."},{"id":7,"category":"SQL joins, grouping, and NULLs","question":"Why can filtering a right-side column in WHERE turn a LEFT JOIN into an effective inner join?","options":["The filter can reject NULL unmatched rows","LEFT JOIN changes all keys","WHERE always sorts the join","SQL forbids right-side predicates"],"correctIndex":0,"explanation":"A predicate such as right.status = 'active' rejects unmatched NULL rows."},{"id":8,"category":"SQL joins, grouping, and NULLs","question":"What is the correct grain for computing one lifetime-value target per user?","options":["One row per duplicated join result","One row per SQL statement","One row per raw click without aggregation","One target row per user"],"correctIndex":3,"explanation":"Define the entity and time window before aggregating values."},{"id":9,"category":"SQL joins, grouping, and NULLs","question":"What does COALESCE(a, b, 0) return?","options":["The first non-NULL expression","Their sum","The largest expression","The first nonzero expression"],"correctIndex":0,"explanation":"COALESCE handles missingness; zero is not treated as NULL."},{"id":10,"category":"SQL joins, grouping, and NULLs","question":"Why can NOT IN behave unexpectedly when its subquery contains NULL?","options":["Comparisons may evaluate to unknown","The query becomes a cross join","All duplicates are removed first","NULL is always treated as zero"],"correctIndex":0,"explanation":"Use NULL-aware logic, often a carefully correlated NOT EXISTS, for anti-joins."},{"id":11,"category":"SQL windows and event analysis","question":"How does a window aggregate differ from GROUP BY aggregation?","options":["It cannot partition data","It can retain individual input rows","It always changes the table","It always removes duplicates"],"correctIndex":1,"explanation":"Window functions add calculations across related rows without collapsing them into one row per group."},{"id":12,"category":"SQL windows and event analysis","question":"What identifies the latest event per user using ROW_NUMBER?","options":["Apply DISTINCT to all columns","Partition by event time","Order only by user","Partition by user and order by time descending with a tie-breaker"],"correctIndex":3,"explanation":"A deterministic ordering gives one reproducible first row within each user partition."},{"id":13,"category":"SQL windows and event analysis","question":"What does LAG(value) typically provide in an ordered user partition?","options":["The next user's total","The maximum future value","The partition average","The preceding row's value"],"correctIndex":3,"explanation":"LAG accesses an earlier row according to the window's ordering."},{"id":14,"category":"SQL windows and event analysis","question":"Why specify ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW for a rowwise running sum?","options":["To exclude every current row","To remove the need for sorting","To define the cumulative frame explicitly","To group all users together"],"correctIndex":2,"explanation":"Explicit frame semantics avoid surprises, especially when ordering values tie."},{"id":15,"category":"SQL windows and event analysis","question":"What is required for a valid day-seven retention denominator?","options":["Only users active today","Every user ever registered","Only users who returned","A cohort old enough to reach day seven"],"correctIndex":3,"explanation":"Immature cohorts cannot yet have a fully observed day-seven outcome."},{"id":16,"category":"SQL windows and event analysis","question":"Which approach avoids counting purchases multiple times after joining to many click events?","options":["Aggregate purchases to the intended key before the join","Add more click columns","Sort by amount","Sum purchase amounts after the expanded join"],"correctIndex":0,"explanation":"Join expansion can multiply measures unless grain and cardinality are controlled."},{"id":17,"category":"SQL windows and event analysis","question":"What does COUNT(DISTINCT user_id) measure?","options":["The number of distinct non-NULL users","The number of duplicate users","The number of all events","Total session duration"],"correctIndex":0,"explanation":"Distinct counting removes repeated user identifiers within the evaluated group."},{"id":18,"category":"SQL windows and event analysis","question":"Why convert event times to a defined timezone before daily reporting?","options":["Conversion guarantees causality","Day boundaries depend on timezone","UTC timestamps cannot be stored","Timezones change event IDs"],"correctIndex":1,"explanation":"A consistent reporting timezone avoids inconsistent daily cohorts and totals."},{"id":19,"category":"SQL windows and event analysis","question":"A 30-day rolling metric must include days with zero events. What helps?","options":["Delete empty dates","Use event order as calendar time","Join to a complete date spine","Average only observed days silently"],"correctIndex":2,"explanation":"A calendar scaffold makes absent activity explicit rather than omitting it."},{"id":20,"category":"SQL windows and event analysis","question":"What prevents nondeterministic top-offer selection when scores tie?","options":["More NULL scores","A documented secondary ordering key","Removing ORDER BY","A larger LIMIT"],"correctIndex":1,"explanation":"Ties need an explicit stable rule when reproducible selection matters."},{"id":21,"category":"A/B test design and validity","question":"Why randomize treatment assignment in an A/B test?","options":["To guarantee identical groups in every sample","To balance confounders in expectation","To ensure a positive result","To remove measurement error"],"correctIndex":1,"explanation":"Randomization supports causal comparisons while finite-sample variation remains."},{"id":22,"category":"A/B test design and validity","question":"Which unit is sensible when the same user sees many offer impressions and treatment should stay stable?","options":["Individual metric calculation","Random model layer","User","Database column"],"correctIndex":2,"explanation":"Stable user assignment avoids mixing experiences and recognizes within-user dependence."},{"id":23,"category":"A/B test design and validity","question":"A planned 50/50 test receives a strongly significant 60/40 allocation mismatch. What comes first?","options":["Interpret the conversion lift immediately","Declare treatment superior","Investigate assignment or logging integrity","Increase the reward amount"],"correctIndex":2,"explanation":"Sample-ratio mismatch can invalidate the experiment's basic comparability."},{"id":24,"category":"A/B test design and validity","question":"Why choose a primary metric before inspecting outcomes?","options":["To prevent all variance","To ensure statistical significance","To limit result-driven metric selection","To eliminate guardrails"],"correctIndex":2,"explanation":"Pre-specification reduces cherry-picking among many possible outcomes."},{"id":25,"category":"A/B test design and validity","question":"What is the danger of repeatedly stopping at the first conventional p-value below 0.05?","options":["Identical error control to a fixed-horizon test","Guaranteed lower power","Zero selection bias","Inflated false-positive risk without sequential correction"],"correctIndex":3,"explanation":"Repeated unadjusted looks change the test's error behavior."},{"id":26,"category":"A/B test design and validity","question":"With other factors fixed, detecting half the effect size requires approximately how much sample size?","options":["Twice as much","Four times as much","Half as much","The same amount"],"correctIndex":1,"explanation":"Standard error scales roughly with inverse square root of sample size."},{"id":27,"category":"A/B test design and validity","question":"Why define guardrail metrics for reward experiments?","options":["To eliminate uncertainty","To catch harms hidden by the primary metric","To replace randomization","To force every metric to improve"],"correctIndex":1,"explanation":"Revenue gains might accompany retention, abuse, latency, or user-experience regressions."},{"id":28,"category":"A/B test design and validity","question":"What is intention-to-treat analysis based on?","options":["Only users who completed the treatment","Original randomized assignment","Only users with favorable outcomes","The last offer clicked"],"correctIndex":1,"explanation":"Keeping assignment groups preserves randomization despite imperfect uptake."},{"id":29,"category":"A/B test design and validity","question":"Why can social interaction violate a simple independent-user experiment model?","options":["Larger samples remove interference","Randomization prevents all spillovers","One user's treatment can affect another user's outcome","Users never share information"],"correctIndex":2,"explanation":"Interference changes what the treatment contrast represents and may require cluster design."},{"id":30,"category":"A/B test design and validity","question":"An experiment estimates a small uncertain gain but large implementation cost. What should the decision consider?","options":["Number of dashboard views","Whether the treatment name sounds better","P-value alone","Effect uncertainty and practical value together"],"correctIndex":3,"explanation":"Statistical evidence and economic importance answer different questions."},{"id":31,"category":"Causal reasoning and uplift","question":"Users receiving bigger rewards spend more. Why is this not enough to show rewards caused the spending?","options":["High-value users may have been selected for bigger rewards","Correlation always proves causation","Rewards cannot affect behavior","Sample size determines causality alone"],"correctIndex":0,"explanation":"Assignment can depend on factors that also influence the outcome."},{"id":32,"category":"Causal reasoning and uplift","question":"What is a confounder?","options":["A common cause of treatment and outcome","A random seed","Any variable measured after treatment","The outcome itself in every analysis"],"correctIndex":0,"explanation":"Common causes can create associations that do not represent treatment effects."},{"id":33,"category":"Causal reasoning and uplift","question":"Why avoid casually adjusting for a variable caused by treatment?","options":["It may block or distort the effect being estimated","It removes all selection bias","It becomes a randomized variable","It always improves causal estimates"],"correctIndex":0,"explanation":"Post-treatment adjustment can alter the estimand or introduce bias."},{"id":34,"category":"Causal reasoning and uplift","question":"What is the counterfactual problem for an individual user?","options":["Neither outcome can ever be measured","Treatment labels are unavailable","All outcomes are identical","Only one of their treatment outcomes is observed"],"correctIndex":3,"explanation":"The same person cannot simultaneously reveal both potential outcomes for the same situation."},{"id":35,"category":"Causal reasoning and uplift","question":"What does uplift modeling aim to estimate?","options":["How treatment changes an outcome for different users","Only the overall event count","Only who has the highest outcome regardless of treatment","Only model confidence"],"correctIndex":0,"explanation":"High predicted value is not the same as high incremental benefit from an intervention."},{"id":36,"category":"Causal reasoning and uplift","question":"What assumption is central to difference-in-differences identification?","options":["Identical outcome levels","Equal group sizes","No time variation","Parallel untreated outcome trends"],"correctIndex":3,"explanation":"In the absence of treatment, the groups must have followed comparable trends under the design."},{"id":37,"category":"Causal reasoning and uplift","question":"What does overlap mean in observational treatment-effect estimation?","options":["Relevant covariate groups can receive either treatment condition","Outcomes overlap numerically","All users have identical features","Every user gets both treatments"],"correctIndex":0,"explanation":"Without overlap, some comparisons require unsupported extrapolation."},{"id":38,"category":"Causal reasoning and uplift","question":"Why can conditioning on users who clicked after treatment create bias?","options":["It preserves randomization automatically","Clicking always precedes assignment","It removes every confounder","Clicking may itself be influenced by treatment and user traits"],"correctIndex":3,"explanation":"Selecting a post-treatment subgroup can destroy the original group comparability."},{"id":39,"category":"Causal reasoning and uplift","question":"What does an average treatment effect of EUR 0.40 per user xplanation":"Subtract relevant variable costs: 9 - 3 - 2."},{"id":45,"category":"User value, rewards, and product metrics","question":"Why define a fixed observation window for user-value labels?","options":["It guarantees all users have equal value","It makes outcomes causal","Different follow-up lengths otherwise make targets incomparable","It removes missing events"],"correctIndex":2,"explanation":"A common horizon prevents older cohorts from appearing more valuable solely because they were observed longer."},{"id":46,"category":"User value, rewards, and product metrics","question":"What does right censoring mean for recent-user lifetime value?","options":["Their IDs are duplicated","Their features cannot be stored","Their current value is definitely zero","Their eventual outcome is not fully observed yet"],"correctIndex":3,"explanation":"Incomplete follow-up must be handled in label construction and evaluation."},{"id":47,"category":"User value, rewards, and product metrics","question":"Why monitor reward abuse alongside engagement?","options":["Rewards eliminate gaming","Incentives can increase artificial activity","All engagement is fraudulent","Abuse is measured by model size"],"correctIndex":1,"explanation":"A system can optimize superficial activity while harming real platform value."},{"id":48,"category":"User value, rewards, and product metrics","question":"What is a useful retention cohort?","options":["Only today's active users","Users grouped by a shared starting event and time period","Random rows mixed across all ages","Only users with purchases"],"correctIndex":1,"explanation":"Cohorts align time since entry so retention can be compared fairly."},{"id":49,"category":"User value, rewards, and product metrics","question":"Why can average revenue per active user rise while total revenue falls?","options":["The active-user denominator can shrink","Revenue definitions must be identical","Every user became more valuable","Arithmetic forbids this"],"correctIndex":0,"explanation":"Ratio improvements can hide declines in population or volume."},{"id":50,"category":"User value, rewards, and product metrics","question":"What should be clarified before optimizing offer ranking?","options":["Only the font size","Only the sorting algorithm","The target outcome, horizon, constraints, and trade-offs","Only the largest advertiser"],"correctIndex":2,"explanation":"Ranking objectives affect users, advertisers, reward cost, and longer-term behavior."},{"id":51,"category":"Predictive models for user value","question":"Which feature leaks future information when predicting next-month spend today?","options":["Account age today","Purchases before today","Prior-week sessions","Purchases occurring next month"],"correctIndex":3,"explanation":"Predictors must be available at the prediction time, before the target window unfolds."},{"id":52,"category":"Predictive models for user value","question":"Why evaluate user-value models with a forward-in-time split?","options":["To avoid validation labels","To make all customers independent","To guarantee no uncertainty","To approximate future deployment under temporal change"],"correctIndex":3,"explanation":"A temporal holdout tests transfer from historical behavior to later cohorts."},{"id":53,"category":"Predictive models for user value","question":"What can a two-stage model help with when many users never purchase?","options":["Guarantee causal attribution","Separate purchase probability from value conditional on purchase","Remove every outlier","Force equal spending"],"correctIndex":1,"explanation":"A hurdle-style decomposition can model a mass at zero plus a positive-value distribution."},{"id":54,"category":"Predictive models for user value","question":"Why compare against a cohort-average prediction baseline?","options":["To replace holdout testing","To avoid all feature work","To quantify benefit beyond simple historical averages","To maximize training accuracy"],"correctIndex":2,"explanation":"A simple baseline provides a credible reference for added complexity."},{"id":55,"category":"Predictive models for user value","question":"What is a common effect of a few very large spenders on mean squared error?","options":["They make all errors equal","They turn regression into classification","They can dominate the loss","They are ignored automatically"],"correctIndex":2,"explanation":"Squaring error heavily weights large deviations, so objective choice matters."},{"id":56,"category":"Predictive models for user value","question":"What does probability calibration matter for in expected-value decisions?","options":["Choosing image resolution","Only sorting identical users","Naming model versions","Combining probabilities with monetary consequences"],"correctIndex":3,"explanation":"Miscalibrated probabilities distort expected returns even when ranking is good."},{"id":57,"category":"Predictive models for user value","question":"Why retain a time-lagged label availability policy during training?","options":["It prevents every missing value","Labels are always instant","Outcomes may arrive after their event dates","It makes user IDs numeric"],"correctIndex":2,"explanation":"Offline training should reflect what outcomes were actually known at each cutoff."},{"id":58,"category":"Predictive models for user value","question":"What is a sensible check after a new offer type appears?","options":["The model's filename","Whether old metrics remain cached","Only overall historical training loss","Performance and feature coverage for that new slice"],"correctIndex":3,"explanation":"New categories can create extrapolation and preprocessing failures."},{"id":59,"category":"Predictive models for user value","question":"What does a residual plot against predicted value help reveal?","options":["The true causal graph","Systematic bias and changing error spread","Whether treatment was randomized","The exact best architecture"],"correctIndex":1,"explanation":"Residual patterns can expose misfit that one aggregate score conceals."},{"id":60,"category":"Predictive models for user value","question":"Why measure both ranking quality and value-estimation error?","options":["Either proves causality","Both are only latency metrics","They are mathematically identical","Ordering and magnitude support different decisions"],"correctIndex":3,"explanation":"Selecting top users and forecasting budgets require different aspects of model quality."},{"id":61,"category":"Ranking, recommendations, and feedback","question":"What does a top-k ranking metric emphasize?","options":["Quality near the top of the list","Equality of all scores","Only training speed","Only total catalog size"],"correctIndex":0,"explanation":"User exposure is often concentrated in early positions, making order near the top important."},{"id":62,"category":"Ranking, recommendations, and feedback","question":"What does discounted cumulative gain reward?","options":["Longer item identifiers","Relevant results appearing earlier","More repeated irrelevant items","Equal ranking scores"],"correctIndex":1,"explanation":"Position discounts give greater contribution to relevant results near the top."},{"id":63,"category":"Ranking, recommendations, and feedback","question":"Why is logged click data biased by the existing ranking policy?","options":["Clicks are independent of position","Higher-ranked items receive more exposure","Every item is seen equally","Policies cannot affect data"],"correctIndex":1,"explanation":"Observed feedback mixes preference with the opportunities users were given."},{"id":64,"category":"Ranking, recommendations, and feedback","question":"What is the purpose of exploration in a recommendation system?","options":["Show random items forever","Guarantee immediate optimal reward","Learn about uncertain alternatives","Eliminate all business constraints"],"correctIndex":2,"explanation":"Carefully controlled exploration can gather information unavailable from greedy choices."},{"id":65,"category":"Ranking, recommendations, and feedback","question":"How does a contextual bandit differ from ordinary supervised ranking?","options":["It requires no evaluation","It chooses actions and learns from action-dependent feedback","It cannot use user features","It observes every unchosen outcome"],"correctIndex":1,"explanation":"Bandit feedback is selective because only chosen actions reveal outcomes."},{"id":66,"category":"Ranking, recommendations, and feedback","question":"Why log action propensities in an exploration policy?","options":["To make labels deterministic","To increase image quality","To remove every confounder automatically","To support appropriately weighted offline policy evaluation"],"correctIndex":3,"explanation":"Propensities describe the probability of the logged action under the behavior policy."},{"id":67,"category":"Ranking, recommendations, and feedback","question":"What does a cold-start item lack?","options":["Any valid ranking position","Historical interaction evidence","A possible description","A database identifier in every case"],"correctIndex":1,"explanation":"Content and controlled exposure can help when interaction history is scarce."},{"id":68,"category":"Ranking, recommendations, and feedback","question":"Why might diversity constraints improve an offer list?","options":["They reduce redundant exposure and cover more user needs","They eliminate evaluation","They force random ordering","They guarantee higher immediate clicks"],"correctIndex":0,"explanation":"A list-level objective can matter beyond scoring items independently."},{"id":69,"category":"Ranking, recommendations, and feedback","question":"Which offline comparison is misleading?","options":["Comparing models on different candidate pools without accounting for that change","Using the same held-out queries","Retaining a simple baseline","Reporting slice metrics"],"correctIndex":0,"explanation":"Retrieval candidates strongly affect ranking difficulty and attainable quality."},{"id":70,"category":"Ranking, recommendations, and feedback","question":"Why validate a ranking improvement online before a broad rollout?","options":["Online tests need no guardrails","Offline gains may not translate to changed user behavior","Ranking cannot be evaluated offline","Offline metrics are always useless"],"correctIndex":1,"explanation":"Deployment changes exposure and feedback, which can alter real outcomes."},{"id":71,"category":"Statistical reasoning and uncertainty","question":"Independent observations have standard deviation 12 and sample size 144. What is the standard error of their mean?","options":["1","12","144","0.083"],"correctIndex":0,"explanation":"Standard error is 12 divided by the square root of 144."},{"id":72,"category":"Statistical reasoning and uncertainty","question":"What does a conventional p-value quantify under its null model?","options":["Probability of a result at least as extreme as observed","The effect size","Probability the null hypothesis is true","Probability the treatment helps each user"],"correctIndex":0,"explanation":"A p-value is a tail probability under specified assumptions, not a posterior hypothesis probability."},{"id":73,"category":"Statistical reasoning and uncertainty","question":"What is a Type I error?","options":["Measuring a large effect","Failing to reject a false null","Rejecting a true null hypothesis","Increasing sample size"],"correctIndex":2,"explanation":"A false positive declares evidence against a null that is actually true."},{"id":74,"category":"Statistical reasoning and uncertainty","question":"What is statistical power?","options":["Probability every measurement is correct","The model's GPU wattage","Probability of rejecting a false null at a specified alternative","The confidence level"],"correctIndex":2,"explanation":"Power depends on effect size, variability, sample size, and the testing procedure."},{"id":75,"category":"Statistical reasoning and uncertainty","question":"Why bootstrap whole users rather than individual events when events are clustered by user?","options":["To remove all outliers","To guarantee normality","To preserve within-user dependence","To increase duplicate labels"],"correctIndex":2,"explanation":"The resampling unit should reflect the dependence structure of the estimand."},{"id":76,"category":"Statistical reasoning and uncertainty","question":"What generally happens to uncertainty when sample size increases, all else equal?","options":["It must increase","It decreases","It becomes exactly zero","It is unaffected"],"correctIndex":1,"explanation":"More independent information usually reduces sampling variability."},{"id":77,"category":"Statistical reasoning and uncertainty","question":"Why can multiple unadjusted hypothesis tests produce false discoveries?","options":["All p-values become identical","Samples stop being numeric","Each test adds an opportunity for a false positive","Testing creates larger true effects"],"correctIndex":2,"explanation":"Use an error-control strategy suited to the family of decisions."},{"id":78,"category":"Statistical reasoning and uncertainty","question":"What does a paired comparison exploit?","options":["Correlation between matched measurements","Larger output files","Independent unrelated samples only","Equal model parameter counts"],"correctIndex":0,"explanation":"Comparing differences within matched units can reduce irrelevant between-unit variation."},{"id":79,"category":"Statistical reasoning and uncertainty","question":"What is a robust location summary when a few extreme values dominate the mean?","options":["Median","Range","Maximum","Sum"],"correctIndex":0,"explanation":"The median is less sensitive to extreme observations than the mean."},{"id":80,"category":"Statistical reasoning and uncertainty","question":"Why report an effect estimate and interval rather than only significance?","options":["They prove causality automatically","They convey magnitude and uncertainty","They eliminate the null model","They make sample size irrelevant"],"correctIndex":1,"explanation":"A decision needs to know how large the plausible effect is, not just whether a threshold was crossed."},{"id":81,"category":"Python and numerical computing","question":"What does a Python generator provide when processing a large event file?","options":["Immutable records","Lazy iteration","Automatic parallel execution","Guaranteed constant processing time"],"correctIndex":1,"explanation":"Values are produced on demand, reducing the need to store the entire sequence."},{"id":82,"category":"Python and numerical computing","question":"Why use a context manager when opening a data file?","options":["It encrypts the file","It makes reads asynchronous","It closes the resource on normal exit and exceptions","It validates every row"],"correctIndex":2,"explanation":"The context manager handles cleanup even when processing raises an exception."},{"id":83,"category":"Python and numerical computing","question":"Two lists reference the same nested dictionary. What does a shallow outer copy preserve?","options":["A recursively independent dictionary","A shared reference to that dictionary","A serialized dictionary","A frozen dictionary"],"correctIndex":1,"explanation":"A shallow copy copies only the outer container; nested mutable objects remain shared."},{"id":84,"category":"Python and numerical computing","question":"NumPy arrays have shapes (8, 1) and (1, 5). What is the shape of their elementwise sum?","options":["(8, 5)","(13,)","(8, 1)","(1, 5)"],"correctIndex":0,"explanation":"Broadcasting expands dimensions of size one to the corresponding non-singleton sizes."},{"id":85,"category":"Python and numerical computing","question":"Which operation best removes a Python loop over numeric array elements?","options":["Converting the array to strings","A suitable vectorized NumPy operation","Replacing the list with a tuple","Adding a try/except block"],"correctIndex":1,"e e equal batch sizes","To increase label leakage"],"correctIndex":0,"explanation":"A strong offline model can fail if production computes a different feature."},{"id":96,"category":"Shipping product data science","question":"Which evidence best supports ownership of an ambiguous data-science problem?","options":["A complex diagram alone","A long list of tools","A high parameter count","A scoped hypothesis, evaluated baseline, shipped path, and measured outcome"],"correctIndex":3,"explanation":"Ownership means turning uncertainty into a tested and operated solution."},{"id":97,"category":"Shipping product data science","question":"What should be included in the rollout plan for an offer model?","options":["An unlimited experiment duration","Only the final training loss","Only a launch date","Exposure stages, metrics, guardrails, and rollback criteria"],"correctIndex":3,"explanation":"A controlled rollout makes failures observable and limits their impact."},{"id":98,"category":"Shipping product data science","question":"Why review AI-generated SQL against a small manually understood dataset?","options":["To test join grain, filters, and aggregates independently","To eliminate schema validation","To prove it works at any scale","To certify causal conclusions"],"correctIndex":0,"explanation":"Small counterexamples often reveal silent logic errors before large-scale execution."},{"id":99,"category":"Shipping product data science","question":"What should a model card or equivalent internal record explain?","options":["Only the model name","Only the training date","Only the cloud vendor","Intended use, data, evaluation, limitations, and ownership"],"correctIndex":3,"explanation":"Documentation should help others judge and operate the system responsibly."},{"id":100,"category":"Shipping product data science","question":"What is a strong first response to an unexplained production prediction spike?","options":["Delete the monitoring alert","Immediately increase every reward", ariances","They are uncorrelated, but may be dependent"],"correctIndex":3,"explanation":"Zero covariance excludes linear association, not all forms of dependence."},{"id":7,"category":"Mathematics and probability","question":"A fair coin is tossed twice independently. What is the probability of exactly one head?","options":["1","1/2","3/4","1/4"],"correctIndex":1,"explanation":"HT and TH are two of the four equally likely outcomes."},{"id":8,"category":"Mathematics and probability","question":"For independent variables X and Y with finite variances, what is Var(X + Y)?","options":["Var(X) \u00d7 Var(Y)","Var(X) + Var(Y)","[Var(X) + Var(Y)] / 2","Var(X) \u2212 Var(Y)"],"correctIndex":1,"explanation":"The covariance term in the variance-of-a-sum formula is zero."},{"id":9,"category":"Mathematics and probability","question":"What is the probability of class B if softmax is applied to logits [0, 0] for classes A and B?","options":["1","0.5","Undefined","0"],"correctIndex":1,"explanation":"Equal logits produce equal probabilities that sum to one."},{"id":10,"category":"Mathematics and probability","question":"A detector has sensitivity 90% and false-positive rate 10%; event prevalence is 10%. What is P(event | positive)?","options":["10%","99%","90%","50%"],"correctIndex":3,"explanation":"True positives account for 0.1\u00d70.9 = 0.09; false positives also account for 0.9\u00d70.1 = 0.09."},{"id":11,"category":"ML fundamentals and evaluation","question":"Training loss keeps falling while validation loss rises. What does this most strongly suggest?","options":["Improving generalization","Perfect probability calibration","Underfitting","Overfitting"],"correctIndex":3,"explanation":"The model is improving on training data while generalization is worsening."},{"id":12,"category":"ML fundamentals and evaluation","question":"Which split best reduces leakage between highly similar frames from driving videos?","options":["Put adjacent frames in different splits","Train and test
