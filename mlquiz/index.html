<script>
'use strict';
const payload = JSON.parse(document.querySelector('#encrypted-quiz').textContent);
const form = document.querySelector('#login'), gate = document.querySelector('#gate');
const opened = document.querySelector('#opened'), message = document.querySelector('#message');
const submit = document.querySelector('#unlock'), passwordField = document.querySelector('#password');
const bytes = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
async function decryptQuiz(username, password) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(JSON.stringify([username, password])), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', hash:'SHA-256', salt:bytes(payload.salt), iterations:payload.iterations }, material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plaintext = await crypto.subtle.decrypt({ name:'AES-GCM', iv:bytes(payload.iv), tagLength:128 }, key, bytes(payload.ciphertext));
  return new TextDecoder('utf-8', {fatal:true}).decode(plaintext);
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (submit.disabled) return;
  if (!globalThis.crypto?.subtle) { message.textContent = 'Please open this page over HTTPS in Chrome.'; return; }
  submit.disabled = true; message.textContent = 'Unlocking…';
  try {
    const pending = decryptQuiz(document.querySelector('#username').value.trim(), passwordField.value);
    passwordField.value = '';
    const html = await pending;
    const frame = document.createElement('iframe');
    frame.id = 'quiz-frame'; frame.title = 'Private quiz'; frame.srcdoc = html;
    opened.append(frame); opened.hidden = false; gate.hidden = true;
    message.textContent = ''; document.querySelector('#lock').focus();
  } catch {
    message.textContent = 'Could not unlock. Check your username and password and try again.';
    passwordField.focus();
  } finally { passwordField.value = ''; submit.disabled = false; }
});
document.querySelector('#lock').addEventListener('click', () => {
  if (!confirm('Lock the quiz? Current quiz progress will be lost.')) return;
  document.querySelector('#quiz-frame')?.remove();
  opened.hidden = true; gate.hidden = false; form.reset();
  passwordField.focus();
});
// A back/forward cache restoration must not restore an unlocked quiz.
window.addEventListener('pagehide', () => {
  document.querySelector('#quiz-frame')?.remove();
  opened.hidden = true; gate.hidden = false; form.reset();
});
</script>
</body></html>
