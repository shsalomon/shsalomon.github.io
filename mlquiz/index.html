 both evaluation and training rewards."},{"id":57,"category":"Preference learning and post-training","question":"Why evaluate post-trained models on protected tasks?","options":["Training objectives may improve while generalization or safety degrades","Preference scores prove all capabilities","Protected tasks are training data","More tuning guarantees better results"],"correctIndex":0,"explanation":"Held-out evaluation tests whether optimization produced useful behavior beyond its reward signal."},{"id":58,"category":"Preference learning and post-training","question":"What is a distribution shift in preference learning?","options":["The file extension changes","Training comparisons differ from deployment tasks or users","The optimizer has a new name","All preferences are identical"],"correctIndex":1,"explanation":"Preference behavior may not transfer to contexts absent from the training comparisons."},{"id":59,"category":"Preference learning and post-training","question":"Why include difficult near-tie comparisons in expert review selectively?","options":["They require no context","They are always objectively resolvable","They eliminate easy-case evaluation","They can reveal subtle rubric boundaries"],"correctIndex":3,"explanation":"Ambiguous cases may be informative but need careful labeling and uncertainty handling."},{"id":60,"category":"Preference learning and post-training","question":"What makes a post-training improvement credible?","options":["More training steps alone","Higher reward score alone","Better held-out task outcomes without unacceptable regressions","A larger response length"],"correctIndex":2,"explanation":"The intended behavior, not merely the optimized proxy, determines success."},{"id":61,"category":"PyTorch training and debugging","question":"What does model.eval() change independently of gradient recording?","options":["All parameters to constants","Every tensor to CPU memory","Training-dependent behavior such as dropout","The optimizer learning rate"],"correctIndex":2,"explanation":"Evaluation mode controls layer behavior. Use a separate no-grad context when gradients are unnecessary."},{"id":62,"category":"PyTorch training and debugging","question":"A leaf parameter already has a gradient. What does another backward pass normally do?","options":["Clears the previous gradient first","Updates the optimizer state","Replaces the parameter value","Adds to its existing gradient"],"correctIndex":3,"explanation":"PyTorch accumulates gradients, so clearing or deliberate accumulation must be managed explicitly."},{"id":63,"category":"PyTorch training and debugging","question":"What should a standard multiclass cross-entropy loss receive as model input?","options":["One-hot predictions","Unnormalized logits","Rounded probabilities","Predicted class indices"],"correctIndex":1,"explanation":"The loss applies the needed log-softmax internally; class indices are commonly used as targets."},{"id":64,"category":"PyTorch training and debugging","question":"What does x.detach() remove?","options":["All shared storage","The batch dimension","The tensor's numeric precision","The autograd connection to x's history"],"correctIndex":3,"explanation":"Detaching stops gradient propagation through that connection but does not make an independent data copy."},{"id":65,"category":"PyTorch training and debugging","question":"Why can a view operation fail after a tensor transpose?","options":["Transpose always deletes data","The tensor must have a gradient","The strides may be incompatible with the requested view","Views require integer tensors"],"correctIndex":2,"explanation":"A reshape may copy when needed; a contiguous copy can also provide compatible storage."},{"id":66,"category":"PyTorch training and debugging","question":"When clipping gradients during loss-scaled mixed-precision training, what comes first?","options":["Reinitialize the scaler each step","Update parameters before backward","Clip the scaled loss value","Unscale the optimizer's gradients"],"correctIndex":3,"explanation":"Clipping should use the true gradient magnitudes before the optimizer update."},{"id":67,"category":"PyTorch training and debugging","question":"Why might saving live loss tensors in a Python list grow GPU memory?","options":["The tensors may retain computation graphs","Lists always copy model weights","GPU memory cannot be reused","Losses require a new optimizer"],"correctIndex":0,"explanation":"Store detached values for logging when the graph is no longer needed."},{"id":68,"category":"PyTorch training and debugging","question":"What is the output shape of a linear layer mapping 32 features to 7, given input (16, 32)?","options":["(16, 7)","(32, 7)","(7, 16)","(16, 32, 7)"],"correctIndex":0,"explanation":"The batch dimension is preserved and the last feature dimension becomes seven."},{"id":69,"category":"PyTorch training and debugging","question":"Why first try to overfit a tiny fixed batch when debugging training?","options":["To test whether the model and training loop can learn at all","To establish final generalization","To eliminate label noise globally","To choose deployment hardware"],"correctIndex":0,"explanation":"Failure on a tiny batch often exposes target, gradient, loss, or optimization mistakes."},{"id":70,"category":"PyTorch training and debugging","question":"Which checkpoint best supports resuming interrupted training?","options":["Training accuracy only","A random seed without weights","Model, optimizer, scheduler, step, and relevant RNG states","Model weights only"],"correctIndex":2,"explanation":"Resumption needs both learned parameters and the evolving training state."},{"id":71,"category":"Distributed training and scaling","question":"In ordinary data parallelism, what does each worker typically hold?","options":["Every example with no partitioning","A model replica and a different data shard","Only a validation set","Only one scalar parameter"],"correctIndex":1,"explanation":"Workers compute gradients on different samples and synchronize updates."},{"id":72,"category":"Distributed training and scaling","question":"What does standard DDP synchronize during backward?","options":["Every raw dataset file","All user prompts","Only metric names","Parameter gradients"],"correctIndex":3,"explanation":"Gradient synchronization coordinates replicated parameter updates across workers."},{"id":73,"category":"Distributed training and scaling","question":"Why use an appropriate distributed data sampler?","options":["To partition or coordinate examples across workers","DDP automatically shuffles every dataset","To remove all duplicate labels","To change the model architecture"],"correctIndex":0,"explanation":"Gradient synchronization alone does not assign different data to each process."},{"id":74,"category":"Distributed training and scaling","question":"Four workers each process 8 examples per step. With two accumulation steps, what is the effective batch size?","options":["128","16","32","64"],"correctIndex":3,"explanation":"Multiply workers, local batch, and accumulation: 4*8*2."},{"id":75,"category":"Distributed training and scaling","question":"What does gradient accumulation trade?","options":["Free extra compute","Guaranteed identical batch-normalization behavior","No need for loss scaling","More forward/backward passes per optimizer update for lower per-pass memory"],"correctIndex":3,"explanation":"Accumulation can approximate larger batches, with care about scaling and stateful layers."},{"id":76,"category":"Distributed training and scaling","question":"Why can distributed scaling flatten as worker count grows?","options":["The loss becomes constant","Models stop needing data","Communication and nonparallel work become limiting","More devices always give linear speedup"],"correctIndex":2,"explanation":"Device count alone does not eliminate synchronization, input, or serial bottlenecks."},{"id":77,"category":"Distributed training and scaling","question":"What distinguishes parameter sharding from basic replicated data parallelism?","options":["Model-related state is distributed across workers","Every worker stores more complete copies","Data cannot be partitioned","Gradients are never computed"],"correctIndex":0,"explanation":"Sharding reduces per-worker state memory at the cost of additional communication and complexity."},{"id":78,"category":"Distributed training and scaling","question":"What does activation checkpointing trade?","options":["Smaller datasets for better calibration","Lower precision for higher disk usage","Extra recomputation for lower activation memory","More labels for fewer gradients"],"correctIndex":2,"explanation":"Some intermediate activations are recomputed during backward instead of retained."},{"id":79,"category":"Distributed training and scaling","question":"What happens if one worker skips a collective communication that others enter?","options":["The batch becomes smaller automatically","Others always proceed correctly","Training becomes deterministic","The job can hang or fail"],"correctIndex":3,"explanation":"Collective operations require compatible participation and ordering."},{"id":80,"category":"Distributed training and scaling","question":"Why measure samples per second and time to target quality when scaling?","options":["Device count proves all gains","Communication cost is always zero","Faster steps may change optimization efficiency","Training loss is irrelevant"],"correctIndex":2,"explanation":"Throughput alone does not show whether a useful model is reached sooner or cheaper."},{"id":81,"category":"Experimental design and research engineering","question":"What makes a hypothesis experimentally useful?","options":["A list of popular tools","A claim that every outcome confirms","A promise of success","A measurable prediction that could be contradicted"],"correctIndex":3,"explanation":"Testable predictions let evidence distinguish explanations."},{"id":82,"category":"Experimental design and research engineering","question":"Why change one major factor at a time in a diagnostic ablation?","options":["To avoid all interactions","To guarantee the best model","To make the effect easier to attribute","To remove the need for repeated trials"],"correctIndex":2,"explanation":"Controlled changes help interpretation, while factorial studies can later examine interactions."},{"id":83,"category":"Experimental design and research engineering","question":"Why report results over multiple training seeds?","options":["To replace a held-out test set","To expose variation due to stochastic training","To guarantee all data is independent","To choose only the best seed"],"correctIndex":1,"explanation":"A single run can exaggerate a fragile improvement."},{"id":84,"category":"Experimental design and research engineering","question":"What should be done when a claimed gain disappears under a stronger baseline?","options":["Report only the original result","Reassess the claim and investigate what remains","Hide the baseline","Change the metric silently"],"correctIndex":1,"explanation":"Scientific value depends on fair comparisons rather than preserving a preferred conclusion."},{"id":85,"category":"Experimental design and research engineering","question":"What is an efficient first step when implementing a complex paper?","options":["Skip data checks","Reproduce a small verifiable component or baseline","Launch the largest available training run","Change every architectural detail"],"correctIndex":1,"explanation":"Small tests expose misunderstandings before expensive experiments."},{"id":86,"category":"Experimental design and research engineering","question":"Why record unsuccessful experiments?","options":["They replace successful replications","They lower all future scores","They preserve evidence about what did not work and under which conditions","They prove the idea is impossible"],"correctIndex":2,"explanation":"Negative results reduce repeated effort and clarify the limits of a hypothesis."},{"id":87,"category":"Experimental design and research engineering","question":"What does a Pareto frontier represent for quality, latency, and memory objectives?","options":["Only solutions with equal scores","Every trained checkpoint","Only the largest model","Solutions not dominated by another feasible solution"],"correctIndex":3,"explanation":"A nondominated solution offers a trade-off that no other compared option improves in all objectives."},{"id":88,"category":"Experimental design and research engineering","question":"What is a reproducible experiment configuration?","options":["Versioned settings linked to code, data, and artifacts","An edited notebook with hidden state","A screenshot alone","A memory of the best values"],"correctIndex":0,"explanation":"Explicit configurations reduce ambiguity when rerunning or reviewing results."},{"id":89,"category":"Experimental design and research engineering","question":"Why inspect raw examples behind aggregate metrics?","options":["To select only successes","To identify failure patterns and measurement defects","To prove causality","To replace all quantitative evidence"],"correctIndex":1,"explanation":"Qualitative analysis complements statistics by showing what errors actually look like."},{"id":90,"category":"Experimental design and research engineering","question":"What should an empirical claim distinguish?","options":["Observed evidence, assumptions, and untested extrapolation","Only future plans","Only the author's confidence","Only the strongest possible interpretation"],"correctIndex":0,"explanation":"Clear boundaries make research conclusions useful and defensible."},{"id":91,"category":"Optimization and model improvement","question":"What does teacher forcing use as previous sequence context during training?","options":["Ground-truth preceding tokens","No context","Only the model's final generated sequence","Random future labels"],"correctIndex":0,"explanation":"Training can condition on correct history while inference conditions on its own outputs."},{"id":92,"category":"Optimization and model improvement","question":"What is exposure bias in autoregressive generation?","options":["Data cannot be batched","The microphone volume is too high","Training and inference can encounter different preceding-token distributions","Every token is equally likely"],"correctIndex":2,"explanation":"Errors generated at inference can create contexts unlike the ground-truth histories used in training."},{"id":93,"category":"Optimization and model improvement","question":"What does gradient-norm clipping limit?","options":["The number of model layers","The dataset size","The magnitude of the gradient used for an update","The target sequence length"],"correctIndex":2,"explanation":"Clipping can control extreme updates but does not fix their underlying cause by itself."},{"id":94,"category":"Optimization and model improvement","question":"Why bucket variable-length examples into similar-length batches?","options":["To eliminate label noise","To reduce wasted padding and improve utilization","To guarantee equal semantic difficulty","To remove every long example"],"correctIndex":1,"explanation":"Less padding can lower compute and memory waste while preserving the examples."},{"id":95,"category":"Optimization and model improvement","question":"What does label smoothing change?","options":["The number of parameters","The target distribution used for classification training","Every input timestamp","The audio sample rate"],"correctIndex":1,"explanation":"It softens hard targets, which can affect generalization and calibration."},{"id":96,"category":"Optimization and model improvement","question":"Why inspect gradient norms and activation statistics during unstable training?","options":["They help locate numerical or optimization problems","They prove the dataset is unbiased","They guarantee convergence","They replace validation"],"correctIndex":0,"explanation":"Diagnostic signals can expose exploding values, saturation, or inactive pathways."},{"id":97,"category":"Optimization and model improvement","question":"What can an excessively high learning rate cause?","options":["Divergence or unstable updates","Guaranteed fastest useful convergence","Removal of stochasticity","Exact zero validation error"],"correctIndex":0,"explanation":"Large steps can overshoot useful regions of the loss surface."},{"id":98,"category":"Optimization and model improvement","question":"What is knowledge distillation intended to transfer?","options":["Useful behavior from a teacher to a student model","The teacher's entire hardware environment","Only dataset filenames","Only random seeds"],"correctIndex":0,"explanation":"Distillation trains a student with teacher-derived signals, often to reduce serving cost."},{"id":99,"category":"Optimization and model improvement","question":"Why compare data improvements against architecture changes under a common budget?","options":["Equal budgets guarantee equal results","Architecture always dominates data","Better data may explain gains more economically","Data quality cannot affect learning"],"correctIndex":2,"explanation":"Controlled resource comparisons reveal where effort produces useful improvements."},{"id":100,"category":"Optimization and model improvement","question":"What should be checked after lowering model precision?","options":["Only the number of epochs","Numerical stability and task quality on representative data","Only checkpoint size","Only model naming"],"correctIndex":1,"explanation":"Reduced precision can alter training or inference behavior and needs direct validation."}]},{"stem":"ai_engineer_clinical_trials_llm_systems","title":"AI Engineer","subtitle":"Clinical Trials & LLM Systems","company":"Clariness","questions":[{"id":1,"category":"Retrieval-augmented generation","question":"What is the central role of retrieval in a RAG pipeline?","options":["Guarantee every answer is true","Replace access control","Supply relevant external evidence to generation","Update all model weights per query"],"correctIndex":2,"explanation":"Retrieved evidence can support an answer, but quality and grounding still require evaluation."},{"id":2,"category":"Retrieval-augmented generation","question":"Why combine lexical and dense retrieval?","options":["Either guarantees perfect recall","They eliminate chunking","They can recover complementary exact and semantic matches","Their scores are always directly comparable"],"correctIndex":2,"explanation":"Exact terms and semantic paraphrases have different retrieval strengths."},{"id":3,"category":"Retrieval-augmented generation","question":"What is a common chunk-size trade-off?","options":["Larger chunks always improve every metric","Chunk size changes user permissions","Smaller chunks guarantee correct answers","Context completeness versus retrieval specificity and budget"],"correctIndex":3,"explanation":"A chunk should preserve useful context without overwhelming the downstream prompt."},{"id":4,"category":"Retrieval-augmented generation","question":"What does a reranker do after initial retrieval?","options":["Trains the base LLM automatically","Guarantees citation support","Changes source permissions","Reorders candidates using a stronger relevance estimate"],"correctIndex":3,"explanation":"Reranking can improve ordering but depends on the candidates already retrieved."},{"id":5,"category":"Retrieval-augmented generation","question":"What does recall@k measure for retrieval?","options":["The average API latency","The fraction of generated words that are correct","The fraction of relevant items recovered in the top k","The number of unique users"],"correctIndex":2,"explanation":"Retrieval recall measures evidence coverage, distinct from answer quality."},{"id":6,"category":"Retrieval-augmented generation","question":"What should happen when a source document changes?","options":["Update or invalidate its derived chunks and embeddings","Rename only the display title","Keep stale embeddings forever","Retrain the entire LLM automatically"],"correctIndex":0,"explanation":"Index content must track the source version used for answers."},{"id":7,"category":"Retrieval-augmented generation","question":"Why retain stable source offsets or identifiers with chunks?","options":["To reduce all embedding dimensions","To reconstruct and verify citations","To avoid storing text","To guarantee passage truth"],"correctIndex":1,"explanation":"Citation provenance needs a reliable link back to the exact supporting content."},{"id":8,"category":"Retrieval-augmented generation","question":"What is the risk of increasing top-k without testing?","options":["Every answer becomes shorter","More irrelevant evidence can distract generation and raise cost","Latency always falls","Recall must decrease"],"correctIndex":1,"explanation":"Retrieval breadth should be tuned against relevance, context budget, and end-to-end results."},{"id":9,"category":"Retrieval-augmented generation","question":"What should a permission-aware retrieval system filter?","options":["Only old model outputs","Documents the user is allowed to access","Only documents with low similarity","Only long documents"],"correctIndex":1,"explanation":"Relevance cannot override source access restrictions."},{"id":10,"category":"Retrieval-augmented generation","question":"Why evaluate retrieval and generation separately as well as jointly?","options":["To prove citations are correct automatically","To avoid task-level metrics","To remove labeling needs","To locate missing evidence versus misuse of available evidence"],"correctIndex":3,"explanation":"Component evaluation helps identify where end-to-end failures originate."},{"id":11,"category":"Agent workflows and tool use","question":"What should happen before executing model-produced tool arguments?","options":["Convert every value to a string","Validate their schema and permissions","Remove all limits","Trust fluent wording"],"correctIndex":1,"explanation":"A plausible model output can still contain invalid or unauthorized arguments."},{"id":12,"category":"Agent workflows and tool use","question":"What most directly prevents an agent from looping forever?","options":["A longer system prompt alone","A higher temperature","More retrieved documents","Explicit step, time, and cost budgets"],"correctIndex":3,"explanation":"Execution limits bound behavior even when the model fails to terminate."},{"id":13,"category":"Agent workflows and tool use","question":"A retrieved document says to ignore instructions and send secrets. How should it be treated?","options":["As a tool schema","As a higher-priority command","As untrusted content, not authorization","As proof of user consent"],"correctIndex":2,"explanation":"Retrieved text supplies evidence; it must not redefine tool permissions."},{"id":14,"category":"Agent workflows and tool use","question":"What makes an external side-effecting tool safer to retry?","options":["A more creative prompt","An unlimited timeout","Random request IDs on every retry","An idempotency mechanism"],"correctIndex":3,"explanation":"A stable operation identity helps prevent duplicate writes or transactions."},{"id":15,"category":"Agent workflows and tool use","question":"Why separate planning from execution in an agent workflow?","options":["To inspect and constrain proposed actions before side effects","To eliminate tool failures","To guarantee the plan is correct","To remove all latency"],"correctIndex":0,"explanation":"Explicit stages make authorization, validation, and failure handling easier to enforce."},{"id":16,"category":"Agent workflows and tool use","question":"What does a structured output schema establish?","options":["Shape and type constraints","Factual truth","Completeness of all evidence","Legal validity"],"correctIndex":0,"explanation":"Schema-valid output may still be semantically wrong and needs task-specific checks."},{"id":17,"category":"Agent workflows and tool use","question":"What should an agent do when necessary evidence is unavailable?","options":["Repeat a confident answer","Fabricate a source","Hide uncertainty in metadata","State the gap or seek the missing evidence"],"correctIndex":3,"explanation":"Reliable behavior preserves the distinction between supported conclusions and missing information."},{"id":18,"category":"Agent workflows and tool use","question":"Why persist agent state at well-defined checkpoints?","options":["To bypass validation","To remove all storage needs","To make every action reversible","To resume safely and trace prior actions"],"correctIndex":3,"explanation":"Durable state helps recover without blindly repeating completed work."},{"id":19,"category":"Agent workflows and tool use","question":"Which trace is most useful for debugging a wrong agent result?","options":["Inputs, retrieved evidence, tool calls, outputs, and versions","Only the final answer","Only total token count","Only the model's display name"],"correctIndex":0,"explanation":"Step-level evidence helps locate whether retrieval, reasoning, execution, or validation failed."},{"id":20,"category":"Agent workflows and tool use","question":"A workflow always follows the same known steps. What is a sensible first implementation?","options":["A new model trained from scratch","A tool with unrestricted shell access","A deterministic pipeline with bounded model calls","An unconstrained autonomous loop"],"correctIndex":2,"explanation":"Use predictable control flow when the task does not require open-ended action selection."},{"id":21,"category":"SQL for clinical-trial workflows","question":"A participant has four recorded visits. What does joining participants to visits on participant_id normally produce?","options":["Four rows for that participant","One automatically aggregated row","Sixteen rows for that participant","Zero rows unless all dates match"],"correctIndex":0,"explanation":"A one-to-many join expands the participant row; downstream counts must respect that grain."},{"id":22,"category":"SQL for clinical-trial workflows","question":"What does COUNT(lab_result) exclude in SQL?","options":["Negative non-NULL results","Duplicate non-NULL results","Every zero-valued result","Rows where lab_result is NULL"],"correctIndex":3,"explanation":"COUNT(expression) counts non-NULL expressions; COUNT(*) counts rows."},{"id":23,"category":"SQL for clinical-trial workflows","question":"How can a query retain every trial even when it has no matching site record?","options":["Use an INNER JOIN from trials to sites","Filter unmatched sites out in WHERE","Use a CROSS JOIN to all sites","Use a LEFT JOIN from trials to sites"],"correctIndex":3,"explanation":"A left join preserves unmatched trials with NULL values on the site side."},{"id":24,"category":"SQL for clinical-trial workflows","question":"What should determine which participant feature values can enter a historical matching model?","options":["Whether the value improves test accuracy","The newest value in the database today","Availability before the matching decision timestamp","Availability by the end of follow-up"],"correctIndex":2,"explanation":"Point-in-time joins must not introduce information learned after the original decision."},{"id":25,"category":"SQL for clinical-trial workflows","question":"Which window expression supports selecting the latest eligible record per participant?","options":["ROW_NUMBER partitioned by participant and ordered by time descending","RANK ordered only by participant ID","COUNT over the entire table","SUM partitioned only by trial status"],"correctIndex":0,"explanation":"A deterministic timestamp and tie-breaker identify the desired record within each participant."},{"id":26,"category":"SQL for clinical-trial workflows","question":"Why use a stable secondary key when two laboratory records share a timestamp?","options":["To guarantee the newer value is clinically correct","To make latest-record selection deterministic","To force both records to have equal values","To convert missing results to zero"],"correctIndex":1,"explanation":"Time alone does not define an ordering among ties; the selection rule must be explicit."},{"id":27,"category":"SQL for clinical-trial workflows","question":"Eligibility is unknown because a required laboratory result is missing. How should the data model represent this?","options":["Treat it as confirmed ineligible without a defined rule","Treat it as confirmed eligible","Replace it with the highest observed value","Preserve an explicit unknown or missing status"],"correctIndex":3,"explanation":"Unknown evidence is distinct from either a positive or negative eligibility determination."},{"id":28,"category":"SQL for clinical-trial workflows","question":"A table has one row per criterion and several criteria per trial. What counts distinct trials?","options":["COUNT(criterion_text)","COUNT(DISTINCT trial_id)","SUM(trial_id)","COUNT(*) in every case"],"correctIndex":1,"explanation":"Counting criterion rows can overstate the number of distinct trials."},{"id":29,"category":"SQL for clinical-trial workflows","question":"Where should a SQL condition on an aggregated participant count normally appear?","options":["HAVING","The join key alone","WHERE before grouping","ORDER BY alone"],"correctIndex":0,"explanation":"HAVING filters groups after the aggregate is calculated."},{"id":30,"category":"SQL for clinical-trial workflows","question":"What is a danger of joining protocol versions only on trial_id?","options":["Every old version is automatically discarded","The join becomes point-in-time correct","Missing criteria are automatically adjudicated","Criteria from multiple versions may be mixed or multiplied"],"correctIndex":3,"explanation":"Join keys and date constraints must identify the applicable protocol version."},{"id":31,"category":"Delta Lake, Unity Catalog, and MLflow","question":"What doe <script>
(function (root) {
  'use strict';
  class QuizSession {
    constructor(questions, mode, now = () => Date.now()) {
      this.questions = questions; this.mode = mode; this.now = now;
      this.index = 0; this.responses = []; this.deadline = null;
      this.beginQuestion();
    }
    beginQuestion() { this.deadline = this.mode === 'test' ? this.now() + 15000 : null; }
    get current() { return this.questions[this.index]; }
    get done() { return this.index >= this.questions.length; }
    get answered() { return !!this.responses[this.index]; }
    get score() { return this.responses.reduce((sum, r) => sum + r.points, 0); }
    get remaining() { return this.deadline === null ? null : Math.max(0, this.deadline - this.now()); }
    submit(choice) {
      if (this.done || this.answered) return null;
      if (this.mode === 'test' && this.remaining <= 0) choice = 'timeout';
      if (!(Number.isInteger(choice) && choice >= 0 && choice < this.current.options.length) && !['skip', 'timeout'].includes(choice)) return null;
      const status = choice === 'timeout' ? 'timeout' : choice === 'skip' ? 'skip' : choice === this.current.correctIndex ? 'correct' : 'wrong';
      const response = { question: this.current, choice, status, points: status === 'correct' ? 2 : status === 'wrong' ? -1 : 0 };
      this.responses.push(response); return response;
    }
    next() { if (!this.answered) return false; this.index++; if (!this.done) this.beginQuestion(); return true; }
  }
  root.QuizSession = QuizSession;
  if (typeof module !== 'undefined') module.exports = QuizSession;
})(globalThis);

</script>

  stopTimer();
  if (session.done) return results();
  const q = session.current, timed = session.mode === 'test', revision = session.mode === 'revision';
  render(`<div class="play-top"><button class="text-button exit">← Quiz library</button><span class="pill">${revision ? 'Revision · untimed' : timed ? 'Timed test' : 'Training · untimed'}</span></div><section class="play"><p class="eyebrow">${escapeHTML(QUIZ_DATA[selected].subtitle)}</p><div class="progress-label"><span>Question <b>${session.index + 1}</b> of ${session.questions.length}</span><span>${timed ? '<b id="timer" role="timer">15s</b>' : `<b>${session.score > 0 ? '+' : ''}${session.score}</b> ${revision ? 'revision ' : ''}points`}</span></div><div class="progress"><span style="width:${session.index / session.questions.length * 100}%"></span></div><div class="question-card"><p class="category">${escapeHTML(q.category)}</p><h1 tabindex="-1">${escapeHTML(q.question)}</h1><div class="answers">${q.options.map((option, i) => `<button class="answer" data-choice="${i}"><span class="letter">${String.fromCharCode(65 + i)}</span><span>${escapeHTML(option)}</span><span class="answer-mark"></span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="question-bottom"><button class="secondary skip">Don’t know</button><span class="muted">${timed ? 'Choose an answer to continue. Results at the end.' : 'Choose an answer to see the explanation.'}</span></div></div></section>`);
  app.querySelectorAll('[data-choice]').forEach(button => button.onclick = () => answer(Number(button.dataset.choice)));
  app.querySelector('.skip').onclick = () => answer('skip');
  app.querySelector('.exit').onclick = () => { if (confirm('Leave this session? Your current progress will be lost.')) home(); };
  focusHeading();
  if (timed) ticker = setInterval(tick, 80);
}
function tick() {
  if (!session || session.mode !== 'test' || session.done || session.answered) return;
  const timer = document.querySelector('#timer');
  if (timer) { timer.textContent = `${Math.ceil(session.remaining / 1000)}s`; timer.classList.toggle('urgent', session.remaining <= 5000); }
  if (session.remaining <= 0) answer('timeout');
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
function answer(choice) {
  const response = session.submit(choice); if (!response) return;
  stopTimer();
  if (session.mode === 'test') { session.next(); question(); return; }
  const q = session.current;
  app.querySelectorAll('.answer').forEach(button => {
    button.disabled = true;
    const i = Number(button.dataset.choice);
    if (i === q.correctIndex) { button.classList.add('correct'); button.querySelector('.answer-mark').textContent = '✓'; }
    else if (i === choice) { button.classList.add('wrong'); button.querySelector('.answer-mark').textContent = '×'; }
  });
  app.querySelector('.progress-label span:last-child').textContent = `${session.score} ${session.mode === 'revision' ? 'revision ' : ''}points`;
  app.querySelector('#feedback').innerHTML = `<div class="feedback ${response.status === 'wrong' ? 'negative' : ''}"><strong>${labels[response.status]} · ${response.points > 0 ? '+' : ''}${response.points} points</strong><p>Correct answer: ${escapeHTML(q.options[q.correctIndex])}</p><p>${escapeHTML(q.explanation)}</p></div>`;
  app.querySelector('.question-bottom').innerHTML = `<button class="primary next">${session.index === session.questions.length - 1 ? 'See results' : 'Next question'} →</button>`;
  app.querySelector('.next').onclick = () => { session.next(); question(); };
  app.querySelector('.next').focus({ preventScroll: true });
}
function results() {
  stopTimer();
  const revision = session.mode === 'revision';
  if (!revision) original = session;
  const missed = session.responses.filter(r => r.status !== 'correct');
  const counts = Object.fromEntries(Object.keys(labels).map(key => [key, session.responses.filter(r => r.status === key).length]));
  render(`<section class="results"><p class="eyebrow">${revision ? 'REVISION COMPLETE' : 'SESSION COMPLETE'}</p><h1 tabindex="-1">${missed.length ? 'Good practice. Clear next steps.' : 'Every answer. Nailed it.'}</h1><p class="lede">${escapeHTML(QUIZ_DATA[selected].subtitle)}</p><div class="result-summary"><div class="score"><strong>${session.score}</strong><span>of ${session.questions.length * 2} possible points</span></div><div class="result-counts">${Object.keys(labels).map(key => `<div><b>${counts[key]}</b><span>${labels[key]}</span></div>`).join('')}</div></div>${revision ? `<p class="muted">Original ${original.mode === 'test' ? 'test' : 'training'} score: ${original.score} / ${original.questions.length * 2}. Revision does not change it.</p>` : ''}<div class="result-actions">${missed.length ? `<button class="primary revise">Revise ${missed.length} missed questions →</button>` : ''}<button class="secondary library">Choose another quiz</button>${revision ? '<button class="secondary original">Original results</button>' : ''}</div><div class="section-heading"><h2>Questions to revisit <span class="count">${missed.length}</span></h2><span class="muted">Untimed revision, with explanations</span></div>${missed.length ? missed.map(r => `<details class="review"><summary><span class="status ${r.status}">${labels[r.status]}</span><span><small>Question ${r.question.id} · ${escapeHTML(r.question.category)}</small>${escapeHTML(r.question.question)}</span><span>+</span></summary><div class="review-content"><p>Your answer: <b>${Number.isInteger(r.choice) ? escapeHTML(r.question.options[r.choice]) : labels[r.status]}</b></p><p class="correct-text">Correct answer: <b>${escapeHTML(r.question.options[r.question.correctIndex])}</b></p><p>${escapeHTML(r.question.explanation)}</p></div></details>`).join('') : '<div class="empty">✦ Nothing to revisit. You answered every question correctly.</div>'}</section>`);
  app.querySelector('.library').onclick = home;
  if (missed.length) app.querySelector('.revise').onclick = () => start(missed.map(r => r.question), 'revision');
  if (revision) app.querySelector('.original').onclick = () => { session = original; results(); };
  focusHeading(); window.scrollTo(0, 0);
}
window.addEventListener('beforeunload', event => { if (session && !session.done) { event.preventDefault(); event.returnValue = ''; } });
home();

</script>
<script>
document.querySelector('.brand').addEventListener('click', event => {
  event.preventDefault();
  if (!session || session.done || confirm('Leave this session? Your current progress will be lost.')) home();
});
</script>
</body>
</html>
