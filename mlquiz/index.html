olerances","Increase random seeds until one passes","Remove all assertions"],"correctIndex":1,"explanation":"Control known randomness and choose tolerances justified by the property being tested."},{"id":57,"category":"Testing, reviews, and CI/CD","question":"What should code review prioritize in an AI-generated data transformation?","options":["The number of generated lines","The tool's confident wording","Correctness, edge cases, and data assumptions","Whether the code looks familiar"],"correctIndex":2,"explanation":"Generated code needs the same independent verification as any other contribution."},{"id":58,"category":"Testing, reviews, and CI/CD","question":"Why separate fast deterministic CI checks from expensive benchmark runs?","options":["To bypass approval rules","To make GPU runs deterministic automatically","To give quick feedback while retaining deeper validation","To avoid model evaluation forever"],"correctIndex":2,"explanation":"Different checks have different costs; both can contribute to a defined release process."},{"id":59,"category":"Testing, reviews, and CI/CD","question":"What is a regression test intended to catch?","options":["Only syntax errors","Any change in file size","Every unknown future requirement","Reappearance of a previously fixed failure"],"correctIndex":3,"explanation":"A regression case preserves the expected behavior associated with a known defect."},{"id":60,"category":"Testing, reviews, and CI/CD","question":"Which evidence should block release of a supposedly improved model?","options":["A shorter model name","A material regression on a required safety or business metric","A different random seed","A lower training loss"],"correctIndex":1,"explanation":"Release criteria should include critical outcomes and guardrails, not just a headline improvement."},{"id":61,"category":"Deployment and operational reliability","question":"What distinguishes a canary deployment?","options":["Every user switches simultaneously","A small traffic share receives the new version first","It skips production monitoring","It runs only on training data"],"correctIndex":1,"explanation":"Limited exposure lets the team inspect behavior before broad rollout."},{"id":62,"category":"Deployment and operational reliability","question":"What is a shadow deployment?","options":["The model is trained without labels","Two models randomly split outcomes equally","The new model receives copied traffic without controlling user outcomes","The old model is removed"],"correctIndex":2,"explanation":"Shadowing measures behavior on real inputs while the existing system remains responsible for results."},{"id":63,"category":"Deployment and operational reliability","question":"Which rollback preparation is most useful?","options":["Only an old screenshot","A deleted previous model","A verbal promise to retrain","A compatible previous artifact plus tested routing and schema recovery"],"correctIndex":3,"explanation":"Rollback depends on artifacts, interfaces, and data compatibility, not just code history."},{"id":64,"category":"Deployment and operational reliability","question":"Why pin a container image by digest for a release?","options":["It removes the need for tests","Tags never change","The digest identifies immutable image content","It guarantees hardware compatibility"],"correctIndex":2,"explanation":"A digest prevents a mutable tag from silently referring to different content."},{"id":65,"category":"Deployment and operational reliability","question":"What usually improves resilience to a failed inference replica?","options":["A single larger process","Multiple healthy replicas with suitable routing","A longer response schema","Disabling health checks"],"correctIndex":1,"explanation":"Redundancy helps only if requests can reach healthy capacity and dependencies also remain available."},{"id":66,"category":"Deployment and operational reliability","question":"Why keep secrets outside a container image?","options":["Images can be copied and inspected beyond the running service","Secrets prevent GPU use","Environment settings are always public","Images cannot contain text"],"correctIndex":0,"explanation":"Use an appropriate secret store and controlled runtime access rather than embedding credentials."},{"id":67,"category":"Deployment and operational reliability","question":"What can excessive automatic retries do during an outage?","options":["Eliminate duplicate requests","Reduce all latency tails","Guarantee eventual success","Amplify load and delay recovery"],"correctIndex":3,"explanation":"Retry budgets, backoff, jitter, and idempotency limit retry storms."},{"id":68,"category":"Deployment and operational reliability","question":"Which autoscaling signal often captures queue overload better than CPU alone?","options":["Number of source files","Model parameter count","Dataset license length","Queue depth or waiting time"],"correctIndex":3,"explanation":"GPU-bound or dependency-bound services can build queues without high CPU utilization."},{"id":69,"category":"Deployment and operational reliability","question":"Why evaluate a model on the actual deployment hardware?","options":["Operators, precision, memory, and runtime behavior can differ","All CPUs match all GPUs","Export always improves latency","Training accuracy disappears on export"],"correctIndex":0,"explanation":"Portability of a model file does not guarantee equivalent accuracy or performance."},{"id":70,"category":"Deployment and operational reliability","question":"What should an incident runbook specify?","options":["Detection, ownership, mitigation, and recovery checks","A mandatory full retrain for every error","Only a list of model papers","Only a screenshot of the dashboard"],"correctIndex":0,"explanation":"A useful runbook helps responders make bounded, verifiable decisions under time pressure."},{"id":71,"category":"Monitoring, drift, and incidents","question":"Input distributions changed, but labels are delayed. What can be concluded immediately?","options":["The model is calibrated","Accuracy certainly fell","Retraining is necessarily safe","Input drift occurred; performance impact still needs evidence"],"correctIndex":3,"explanation":"Drift is a warning signal, not direct proof of degraded predictive quality."},{"id":72,"category":"Monitoring, drift, and incidents","question":"What distinguishes concept drift from a change only in input frequency?","options":["Batch size increases","The model format changes","File names change","The relationship between inputs and outcomes changes"],"correctIndex":3,"explanation":"Concept drift changes the conditional outcome behavior that the model learned."},{"id":73,"category":"Monitoring, drift, and incidents","question":"Why monitor metrics by relevant user or data slices?","options":["Slice monitoring removes bias","Every slice must have equal accuracy","Small slices never need uncertainty","Aggregate averages can hide localized failures"],"correctIndex":3,"explanation":"Segment analysis reveals uneven performance, while sample size affects interpretation."},{"id":74,"category":"Monitoring, drift, and incidents","question":"What do latency, errors, throughput, and saturation describe?","options":["Model calibration alone","Service health","Dataset licensing","Ground-truth completeness"],"correctIndex":1,"explanation":"Operational signals complement prediction-quality and business metrics."},{"id":75,"category":"Monitoring, drift, and incidents","question":"Why log a correlation ID across pipeline stages?","options":["To connect events from the same request","To randomize labels","To reveal user secrets","To compress model weights"],"correctIndex":0,"explanation":"A shared request identifier helps reconstruct distributed execution."},{"id":76,"category":"Monitoring, drift, and incidents","question":"Which alert is most actionable?","options":["Every new log line","Every prediction differing from yesterday","A defined threshold with an owner and response procedure","Any change in GPU temperature"],"correctIndex":2,"explanation":"Alerts should indicate a meaningful condition and support a concrete response."},{"id":77,"category":"Monitoring, drift, and incidents","question":"A model's performance metric improves after a data drop. What should be checked?","options":["Whether all models became better","Whether logging can be disabled","Whether the improvement proves causality","Whether difficult cases stopped being measured"],"correctIndex":3,"explanation":"Missing or selective data can make a broken system look better."},{"id":78,"category":"Monitoring, drift, and incidents","question":"What helps distinguish model degradation from broken instrumentation?","options":["Independent checks of data freshness, labels, and metric computation","More dashboard colors","A larger prompt","A more complex model"],"correctIndex":0,"explanation":"Validate the measurement system before interpreting a surprising metric as model behavior."},{"id":79,"category":"Monitoring, drift, and incidents","question":"Why avoid sensitive raw payloads in ordinary application logs?","options":["Logs often have wider retention and access than source systems","Raw text cannot be logged","Logging prevents inference","Redaction guarantees anonymity"],"correctIndex":0,"explanation":"Minimize and protect logged content according to the actual diagnostic need."},{"id":80,"category":"Monitoring, drift, and incidents","question":"What should follow restoring service after an incident?","options":["Verify recovery and record causes and prevention actions","Retrain every model immediately","Delete all evidence","Assume metrics recovered"],"correctIndex":0,"explanation":"Recovery confirmation and a learning review reduce the chance of recurrence."},{"id":81,"category":"Cloud choices and operating costs","question":"Two GPUs run for 6 hours at EUR 2.50 per GPU-hour. What is compute cost before extras?","options":["EUR 60","EUR 30","EUR 15","EUR 5"],"correctIndex":1,"explanation":"Multiply GPU count, duration, and unit price: 2 times 6 times 2.50."},{"id":82,"category":"Cloud choices and operating costs","question":"Which cost can be missed when comparing cloud inference prices?","options":["The Python indentation style","Only the model's title","Only the number of classes","Data transfer and idle capacity"],"correctIndex":3,"explanation":"Total cost includes storage, networking, operations, and unused capacity as applicable."},{"id":83,"category":"Cloud choices and operating costs","question":"When is a batch prediction job often preferable to always-on serving?","options":["Inputs never change","Every request needs an immediate answer","Outputs cannot be stored","Results are needed only on a fixed schedule"],"correctIndex":3,"explanation":"Scheduled computation can avoid maintaining continuously available inference capacity."},{"id":84,"category":"Cloud choices and operating costs","question":"What makes interruptible compute suitable for some training jobs?","options":["No need for persistent storage","Guaranteed uninterrupted runtime","Unlimited free capacity","Checkpointing and tolerance of restarts"],"correctIndex":3,"explanation":"Lower prices can be useful when the workload can recover from eviction."},{"id":85,"category":"Cloud choices and operating costs","question":"Why compare cost per successful task rather than cost per token alone?","options":["Retries, quality, and task length affect real cost","Every model uses equal tokens","Success never needs definition","Token price is always irrelevant"],"correctIndex":0,"explanation":"A cheap unit price may produce expensive failed or repeated work."},{"id":86,"category":"Cloud choices and operating costs","question":"A service costs EUR 120 daily and completes 6,000 useful tasks. What is cost per useful task?","options":["EUR 50","EUR 0.20","EUR 2","EUR 0.02"],"correctIndex":3,"explanation":"Divide total cost by successful tasks: 120/6000."},{"id":87,"category":"Cloud choices and operating costs","question":"What is a defensible first build-versus-buy comparison?","options":["Model parameter count alone","License price alone","Required quality, integration, control, and total ownership cost","Vendor popularity alone"],"correctIndex":2,"explanation":"Maintenance, data constraints, reliability, and switching costs also matter."},{"id":88,"category":"Cloud choices and operating costs","question":"Why apply least privilege to a cloud training identity?","options":["To make storage public","To limit access to the resources the job needs","To avoid all networking","To improve validation accuracy"],"correctIndex":1,"explanation":"A compromised or faulty job should not inherit unnecessary powers."},{"id":89,"category":"Cloud choices and operating costs","question":"What should a resource budget include before a large experiment sweep?","options":["Only the fastest run","An unlimited retry policy","Only the final test size","Trial count, duration, device rate, and a stopping rule"],"correctIndex":3,"explanation":"Explicit assumptions and limits make expected and worst-case spending reviewable."},{"id":90,"category":"Cloud choices and operating costs","question":"What deployment choice best fits data that must stay on an approved local network?","options":["An unreviewed consumer account","Any public endpoint with a low price","A compliant local or approved private environment","Personal file sharing"],"correctIndex":2,"explanation":"Architecture must satisfy the actual data and access constraints before cost optimization."},{"id":91,"category":"Scoping and communicating AI projects","question":"What is the best first question for a vague request to add AI?","options":["Which prompt is longest?","Which GPU is newest?","Which decision or workflow should improve, and how will success be measured?","Which model is largest?"],"correctIndex":2,"explanation":"A clear outcome links technical choices to a useful and testable result."},{"id":92,"category":"Scoping and communicating AI projects","question":"A client wants an accuracy increase. What must be clarified first?","options":["The model's nickname","The metric, baseline, population, and error costs","The logo color","The number of slides"],"correctIndex":1,"explanation":"Accuracy alone can hide imbalance and unequal consequences of mistakes."},{"id":93,"category":"Scoping and communicating AI projects","question":"What makes a prototype acceptance criterion useful?","options":["A promise that the demo looks impressive","A fixed parameter count","An observable threshold on an agreed test and use case","A requirement to use every cloud tool"],"correctIndex":2,"explanation":"Acceptance criteria make progress and trade-offs concrete."},{"id":94,"category":"Scoping and communicating AI projects","question":"When should a simple rules baseline be considered?","options":["Only when no data exist","Only after deployment failure","Before assuming an ML model is necessary","Never for enterprise work"],"correctIndex":2,"explanation":"A baseline can reveal whether ML complexity produces enough additional value."},{"id":95,"category":"Scoping and communicating AI projects","question":"How should an unfamiliar production requirement be communicated?","options":["Hide it in technical jargon","Claim prior deployment without evidence","State the gap, relevant experience, and a validation plan","Promise certainty"],"correctIndex":2,"explanation":"Honest scope and a practical learning plan support reliable delivery."},{"id":96,"category":"Scoping and communicating AI projects","question":"Which explanation of model uncertainty is most useful to a business stakeholder?","options":["When errors occur, their impact, and the fallback process","A claim that AI is unpredictable","Only the optimizer equation","The GPU memory graph alone"],"correctIndex":0,"explanation":"Explain uncertainty in terms of the decisions the stakeholder must make."},{"id":97,"category":"Scoping and communicating AI projects","question":"An MVP has limited time. What should drive scope?","options":["Every possible integration","The smallest end-to-end path that tests the key business assumption","The maximum number of models","A complete platform rewrite"],"correctIndex":1,"explanation":"A bounded usable workflow gives evidence before broader investment."},{"id":98,"category":"Scoping and communicating AI projects","question":"How should a quality-versus-latency trade-off be presented?","options":["One aggregate score without context","Measured options with consequences for the target workflow","Only the fastest benchmark","Only training accuracy"],"correctIndex":1,"explanation":"Showing the feasible alternatives lets stakeholders make an informed choice."},{"id":99,"category":"Scoping and communicating AI projects","question":"What belongs in a technical decision record?","options":["Only the final code diff","Only a vendor slogan","The context, chosen option, alternatives, and consequences","Only a meeting date"],"correctIndex":2,"explanation":"The record preserves why a choice was appropriate under its constraints."},{"id":100,"category":"Scoping and communicating AI projects","question":"What signals that an AI feature should be reconsidered after deployment?","options":["A new paper exists","Its name is too short","Its measured benefit does not justify its costs or harms","The code is Python"],"correctIndex":2,"explanation":"Continuing investment should depend on evidence about the actual outcome."}]},{"stem":"ai_research_engineer_controllable_image_generation","title":"AI Research Engineer / ML Researcher","subtitle":"Controllable Image Generation","company":"Typus.ai","questions":[{"id":1,"category":"Diffusion-model foundations","question":"What is the forward process in a standard denoising diffusion model?","options":["Directly classifying clean inputs","Sorting training examples","Rendering a fixed mesh","Gradually corrupting data with noise"],"correctIndex":3,"explanation":"The forward corruption defines noisy states used to train the reverse denoising process."},{"id":2,"category":"Diffusion-model foundations","question":"What does a noise-prediction diffusion objective train the network to estimate?","options":["The example's filename","The noise added to a sampled training example","Every class label","The final optimizer state"],"correctIndex":1,"explanation":"The network receives a noisy sample and noise-level information to estimate the corruption."},{"id":3,"category":"Diffusion-model foundations","question":"Why condition a denoiser on the timestep or noise level?","options":["It directly identifies the training image","It removes all stochasticity","It guarantees a single output","The required denoising operation depends on corruption strength"],"correctIndex":3,"explanation":"Different noise levels represent different reconstruction difficulties."},{"id":4,"category":"Diffusion-model foundations","question":"What is the starting point of ordinary unconditional diffusion sampling?","options":["A noise sample","The optimizer checkpoint","A sorted training image list","The final test label"],"correctIndex":0,"explanation":"A learned reverse process transforms noise into a sample from the modeled distribution."},{"id":5,"category":"Diffusion-model foundations","question":"What does classifier-free guidance combine?","options":["Only real and fake class labels","Two camera matrices","Two unrelated test datasets","Conditional and unconditional predictions"],"correctIndex":3,"explanation":"Their difference can strengthen conditioning during generation."},{"id":6,"category":"Diffusion-model foundations","question":"What is a common effect of excessively strong guidance?","options":["Better prompt pressure but reduced diversity or artifacts","Guaranteed perfect realism","Exact reconstruction of all prompts","Unlimited sampling speed"],"correctIndex":0,"explanation":"Guidance creates a quality, adherence, and diversity trade-off that needs evaluation."},{"id":7,"category":"Diffusion-model foundations","question":"Why compare different sampling step counts?","options":["They trade generation cost against output quality","Steps only affect file size","Step count changes the dataset license","More steps always improve every metric"],"correctIndex":0,"explanation":"The best operating point depends on the model, sampler, and task."},{"id":8,"category":"Diffusion-model foundations","question":"What does a diffusion noise schedule determine?","options":["How corruption changes across timesteps","The image filename","The class vocabulary order","The GPU billing currency"],"correctIndex":0,"explanation":"The schedule affects signal-to-noise levels encountered during learning and sampling."},{"id":9,"category":"Diffusion-model foundations","question":"Why is a fixed seed useful when comparing prompt or sampler changes?","options":["It controls one source of sampling variation","It guarantees identical outputs across every implementation","It replaces multiple-seed evaluation","It makes the model deterministic on all hardware"],"correctIndex":0,"explanation":"Controlled randomness supports comparison, while broader evaluation still needs variation."},{"id":10,"category":"Diffusion-model foundations","question":"What is a basic limitation of a single attractive generated example?","options":["It proves the model cannot generalize","It proves no memorization","It measures training loss exactly","It does not establish distribution-wide quality"],"correctIndex":3,"explanation":"Evaluate representative prompts, seeds, failure modes, and held-out conditions."},{"id":11,"category":"Latent diffusion and architectures","question":"Where does latent diffusion perform its iterative denoising?","options":["Only in camera coordinates","Only in raw file bytes","Only in class-label space","In a learned compressed representation"],"correctIndex":3,"explanation":"An encoder and decoder connect the latent representation to the image domain."},{"id":12,"category":"Latent diffusion and architectures","question":"Why can latent diffusion reduce computational cost?","options":["Compression guarantees no information loss","It removes all neural networks","Spatial compression reduces the denoising workload","It requires no decoder"],"correctIndex":2,"explanation":"The gain comes with dependence on the autoencoder's representation quality."},{"id":13,"category":"Latent diffusion and architectures","question":"What limitation can the autoencoder impose on generated images?","options":["Unlimited output precision","Automatic geometric correctness","Lost detail or reconstruction artifacts","Guaranteed perfect text rendering"],"correctIndex":2,"explanation":"A denoiser cannot fully recover information the representation cannot express."},{"id":14,"category":"Latent diffusion and architectures","question":"What is the role of skip connections in a U-Net?","options":["Replace every convolution with a label","Eliminate the encoder","Combine features across corresponding resolutions","Remove all high-resolution detail"],"correctIndex":2,"explanation":"Skip pathways help combine spatial detail with broader context."},{"id":15,"category":"Latent diffusion and architectures","question":"Why use cross-attention for text conditioning in an image generator?","options":["It guarantees correct spelling","Text becomes a camera calibration matrix","It removes the noise input","Image features can attend to text representations"],"correctIndex":3,"explanation":"Cross-attention provides a mechanism for context-dependent interaction between modalities."},{"id":16,"category":"Latent diffusion and architectures","question":"How does a patch-based diffusion transformer represent its spatial input?","options":["As a sorted list of filenames","As a sequence of latent or image patch tokens","Only as a scalar class ID","Only as raw audio samples"],"correctIndex":1,"explanation":"Tokenization lets transformer blocks process spatial content with suitable positional information."},{"id":17,"category":"Latent diffusion and architectures","question":"Why must latent scaling conventions match during training and inference?","options":["Scaling affects only display labels","Different magnitudes change the denoiser's input distribution","Every scale is equivalent to a seed","It only changes file names"],"correctIndex":1,"explanation":"A mismatch between encoder, denoiser, and decoder conventions can severely damage outputs."},{"id":18,"category":"Latent diffusion and architectures","question":"What does a reconstruction test isolate before diffusion training?","options":["Whether every seed is unique","Whether text prompts are factual","Whether the denoiser samples correctly","Whether the autoencoder can preserve required image details"],"correctIndex":3,"explanation":"Testing encode-decode quality establishes the representation's own limitations."},{"id":19,"category":"Latent diffusion and architectures","question":"Why can higher output resolution require more than simply resizing a latent tensor?","options":["Every model is resolution invariant","Larger images require fewer tokens","Training distribution, positional handling, and memory constraints can change","Latent tensors have no spatial dimensions"],"correctIndex":2,"explanation":"Architecture and training assumptions determine which resolutions work reliably."},{"id":20,"category":"Latent diffusion and architectures","question":"What should be compared when selecting a U-Net versus transformer backbone?","options":["Only the number of code files","Quality, data needs, compute, and deployment constraints","Only parameter name length","Only publication date"],"correctIndex":1,"explanation":"Architecture choice should follow measured behavior under the project's resources and task."},{"id":21,"category":"LoRA and image-model adaptation","question":"What does LoRA usually learn for an adapted weight matrix?","options":["A new image dataset automatically","A low-rank update while base weights stay frozen","A complete independent copy of every weight","Only the random seed"],"correctIndex":1,"explanation":"The update is parameterized by smaller factors, reducing trainable parameter count."},{"id":22,"category":"LoRA and image-model adaptation","question":"For a 1024 by 1024 matrix and rank 8, how many parameters are in two LoRA factors, ignoring scaling?","options":["1,048,576","64","8,192","16,384"],"correctIndex":3,"explanation":"The factors contain 1024*8 + 8*1024 parameters."},{"id":23,"category":"LoRA and image-model adaptation","question":"What usually happens when LoRA rank increases?","options":["Base weights become smaller","Training data requirements vanish","Adaptation capacity and trainable parameters increase","All outputs become identical"],"correctIndex":2,"explanation":"Rank controls the expressive capacity of the low-rank update, with a resource trade-off."},{"id":24,"category":"LoRA and image-model adaptation","question":"What is a key risk when adapting to a few images of one subject?","options":["Perfect unseen-view synthesis","Overfitting and loss of subject variation","Guaranteed compositional understanding","Automatic removal of background bias"],"correctIndex":1,"explanation":"The model may memorize examples rather than learn a flexible subject representation."},{"id":25,"category":"LoRA and image-model adaptation","question":"What is the purpose of prior-preservation training in DreamBooth-style adaptation?","options":["Remove all conditioning","Replace the subject images","Reduce unwanted collapse of the broader class concept","Guarantee unlimited diversity"],"correctIndex":2,"explanation":"Preserving class behavior helps avoid fitting the specific subject at the expense of general capability."},{"id":26,"category":"LoRA and image-model adaptation","question":"Why keep validation prompts distinct from the adaptation examples?","options":["To guarantee identical backgrounds","To increase training-label leakage","To remove stochastic sampling","To test identity and control beyond memorized images"],"correctIndex":3,"explanation":"Novel compositions reveal whether the adaptation generalizes."},{"id":27,"category":"LoRA and image-model adaptation","question":"What must match before loading a LoRA adapter into a base model?","options":["Compatible architecture and target weight definitions","Only the filename extension","Only the image resolution","Only the training date"],"correctIndex":0,"explanation":"Adapter factors are tied to particular module shapes and semantics."},{"id":28,"category":"LoRA and image-model adaptation","question":"Can two LoRA adapters always be combined without evaluation?","options":["No, their effects can interfere","Yes, low rank guarantees independence","Yes, if both are small","Only the file order matters"],"correctIndex":0,"explanation":"Shared target layers can create nonlinear behavior and competing concepts."},{"id":29,"category":"LoRA and image-model adaptation","question":"What should an adaptation ablation compare?","options":["Only different random prompts","Base model, adapted model, and controlled training variants","Only hardware utilization","Only two cherry-picked images"],"correctIndex":1,"explanation":"A common benchmark reveals what adaptation adds and what it degrades."},{"id":30,"category":"LoRA and image-model adaptation","question":"Why is a low training loss insufficient evidence for a useful material adapter?","options":["It may memorize textures without obeying new spatial requests","It guarantees physical material properties","It proves all prompts generalize","It measures user preference exactly"],"correctIndex":0,"explanation":"Evaluate held-out materials, regions, compositions, and preservation of unaffected content."},{"id":31,"category":"Regions, materials, and structural control","question":"What does a spatial mask provide to an image-editing model?","options":["The full material physics","The region to edit or preserve under a defined convention","A guarantee of geometric accuracy","A replacement for all image context"],"correctIndex":1,"explanation":"Explicit masks constrain where changes should occur, but behavior still needs testing."},{"id":32,"category":"Regions, materials, and structural control","question":"Why inspect pixels outside the requested edit region?","options":["Their labels cannot be known","They must all become zero","They are always irrelevant","To detect unintended changes"],"correctIndex":3,"explanation":"Local edit quality includes preserving content that the user did not ask to change."},{"id":33,"category":"Regions, materials, and structural control","question":"What is a suitable condition for preserving a room's structural layout?","options":["A random class ID","A compatible depth, edge, or segmentation representation","Only the output seed","An unrelated filename"],"correctIndex":1,"explanation":"Spatial conditions give stronger layout information than text alone."},{"id":34,"category":"Regions, materials, and structural control","question":"What is the purpose of ControlNet-style conditioning?","options":["Remove the diffusion process","Guarantee exact CAD dimensions","Add learned spatial control to a pretrained diffusion model","Replace all image data with SQL"],"correctIndex":2,"explanation":"Conditioning branches can use signals such as edges or depth to guide generation."},{"id":35,"category":"Regions, materials, and structural control","question":"Why can a material prompt fail without region grounding?","options":["The model may apply the material to the wrong surface","Region grounding prevents all artifacts","Material names always encode coordinates","Text cannot describe materials"],"correctIndex":0,"explanation":"Desired appearance and intended spatial location are separate control requirements."},{"id":36,"category":"Regions, materials, and structural control","question":"What should an inpainting evaluation assess at the mask boundary?","options":["Only the number of pixels","Only the file extension","Seam, texture, lighting, and structural continuity","Only the training seed"],"correctIndex":2,"explanation":"A plausible patch can still have visible or geometric discontinuities where it joins the original."},{"id":37,"category":"Regions, materials, and structural control","question":"Why can independently generating adjacent room views be problematic?","options":["Every room has unique lighting","Camera poses are unnecessary","Materials and geometry may disagree across views","Independent views always share geometry"],"correctIndex":2,"explanation":"Multi-view consistency needs shared constraints or a representation linking the views."},{"id":38,"category":"Regions, materials, and structural control","question":"What distinguishes appearance control from physical material validation?","options":["They are identical objectives","Image sharpness proves material physics","A realistic texture does not prove correct reflectance properties","RGB values uniquely identify all materials"],"correctIndex":2,"explanation":"Rendering appearance depends on lighting, geometry, and material, often ambiguously."},{"id":39,"category":"Regions, materials, and structural control","question":"How should conflicting text and depth conditions be handled during evaluation?","options":["Assume one is always obeyed","Test and document the model's behavior under the conflict","Remove the conflict from all tests","Declare both satisfied"],"correctIndex":1,"explanation":"Real inputs can disagree; their interaction is an important failure mode."},{"id":40,"category":"Regions, materials, and structural control","question":"What is a controlled intervention test for a material editor?","options":["Select only the prettiest output","Change material while holding geometry and other requested properties fixed","Use unrelated source rooms","Change every prompt element at once"],"correctIndex":1,"explanation":"Isolating one intended change makes controllability measurable."},{"id":41,"category":"Architectural data and curation","question":"What split reduces leakage when a dataset contains many renders of the same building?","options":["Split by building or project","Duplicate every view into each split","Randomly split individual renders","Sort by image size"],"correctIndex":0,"explanation":"Related scenes can share geometry and style even when image files differ."},{"id":42,"category":"Architectural data and curation","question":"Why record whether an image is a render or a photograph?","options":["Rendered images never need labels","Their distributions and artifacts can differ","Photographs are always unbiased","File format uniquely reveals origin"],"correctIndex":1,"explanation":"Source-domain metadata supports slice evaluation and appropriate mixing."},{"id":43,"category":"Architectural data and curation","question":"What makes a material caption useful for controlled generation?","options":["A random designer name","Only a generic praise phrase","Accurate material, location, and visual attributes","Only image dimensions"],"correctIndex":2,"explanation":"Precise grounded captions teach the association the model is expected to control."},{"id":44,"category":"Architectural data and curation","question":"Why review dataset usage rights before model training?","options":["Availability does not establish permitted use","Cropping removes all obligations","Small images have no rights","Every online image is freely reusable"],"correctIndex":0,"explanation":"Dataset selection must account for actual licensing and access conditions."},{"id":45,"category":"Architectural data and curation","question":"What can repeated watermarks teach a generator unintentionally?","options":["Exact building physics","A spurious visual pattern associated with the target style","Better camera geometry","Guaranteed provenance"],"correctIndex":1,"explanation":"Watermarks and layout artifacts can become learned shortcuts or unwanted generated content."},{"id":46,"category":"Architectural data and curation","question":"Why include uncommon room layouts in a controlled benchmark?","options":["To expose failures hidden by common compositions","To eliminate domain shift","To guarantee every output is novel","To avoid defining tasks"],"correctIndex":0,"explanation":"Coverage should reflect important variations rather than only dominant training patterns."},{"id":47,"category":"Architectural data and curation","question":"What is the risk of deduplicating only by file hash?","options":["Text captions become unreadable","Near-duplicate images can remain","Every unique image is deleted","Geometry is normalized automatically"],"correctIndex":1,"explanation":"Hash equality detects identical bytes, not similar crops, re-encodings, or related renders."},{"id":48,"category":"Architectural data and curation","question":"Why keep a versioned manifest of image-caption pairs?","options":["To guarantee caption truth","To avoid storage checks","To eliminate preprocessing","To trace exactly which pairing was used"],"correctIndex":3,"explanation":"Caption updates can change training meaning even when image bytes remain unchanged."},{"id":49,"category":"Architectural data and curation","question":"What should be inspected when a model changes wall material but also removes doors?","options":["Whether the GPU has more memory","Whether all doors are unnecessary","Whether training pairs confound material changes with structural changes","Whether the filename is too long"],"correctIndex":2,"explanation":"Entangled training examples can teach edits that alter unintended attributes."},{"id":50,"category":"Architectural data and curation","question":"What is a useful data-quality audit before a large training run?","options":["Sort image filenames","Sample pairs for caption accuracy, duplication, rights, and corruption","Count folders only","Measure only JPEG size"],"correctIndex":1,"explanation":"Early data checks prevent expensive training on avoidable defects."},{"id":51,"category":"Evaluating generated images","question":"What does FID compare in its usual form?","options":["Camera pose error","Prompt token count","Gaussian approximations to feature distributions","Exact image equality"],"correctIndex":2,"explanation":"FID summarizes feature means and covariances; it is not a complete quality or fidelity test."},{"id":52,"category":"Evaluating generated images","question":"Why can FID comparisons be misleading across different sample counts or pipelines?","options":["The estimate depends on sampling and feature-processing choices","FID is independent of all data","FID measures only runtime","Every implementation is identical"],"correctIndex":0,"explanation":"Keep evaluation conditions matched and report the protocol."},{"id":53,"category":"Evaluating generated images","question":"What does text-image similarity fail to guarantee?","options":["Any embedding computation","Fine spatial control and factual visual details","A numeric score","Any semantic relationship"],"correctIndex":1,"explanation":"A global compatibility score can miss local edits, counting errors, and geometry violations."},{"id":54,"category":"Evaluating generated images","question":"Why use blinded paired human evaluation?","options":["To eliminate all subjective variation","To guarantee unanimous judgments","To reduce model-name bias and compare the same tasks","To avoid defining criteria"],"correctIndex":2,"explanation":"Blinding and matched prompts improve comparisons, while rubric and uncertainty still matter."},{"id":55,"category":"Evaluating generated images","question":"What should a diversity evaluation hold fixed when testing conditional variation?","options":["The conditioning request while varying samples","The training-loss value","Only the file format","Every seed and output"],"correctIndex":0,"explanation":"Multiple valid outputs for the same request reveal diversity under that condition."},{"id":56,"category":"Evaluating generated images","question":"What is a memorization check for an image generator?","options":["Compare model names","Inspect only output resolution","Count attention heads","Search generated outputs against training examples for close matches"],"correctIndex":3,"explanation":"High fidelity can coexist with unwanted reproduction of training data."},{"id":57,"category":"Evaluating generated images","question":"Why evaluate prompts across difficulty and domain slices?","options":["Slices remove all sampling error","Every prompt has equal difficulty","One prompt covers a domain","Mean scores can hide systematic failures"],"correctIndex":3,"explanation":"Compositional, rare, and out-of-domain cases probe different capabilities."},{"id":58,"category":"Evaluating generated images","question":"What is an ablation study?","options":["Increasing every setting at once","Selecting only the best output","Running no baseline","Removing or changing a component to test its contribution"],"correctIndex":3,"explanation":"A controlled ablation supports attribution when other conditions remain comparable."},{"id":59,"category":"Evaluating generated images","question":"Why report quality with inference cost?","options":["Cost proves output correctness","Quality and cost are identical","Cheap models never improve","A small gain may require an impractical operating budget"],"correctIndex":3,"explanation":"Production selection requires understanding the achievable trade-off."},{"id":60,"category":"Evaluating generated images","question":"What makes a qualitative failure gallery scientifically useful?","options":["Only successful examples","Unlabeled images without prompts","Only the most embarrassing random result","Representative errors with conditions and interpretation"],"correctIndex":3,"explanation":"Systematic failures can reveal mechanisms that aggregate scores miss."},{"id":61,"category":"PyTorch training and debugging","question":"What does model.eval() change independently of gradient recording?","options":["The optimizer learning rate","Training-dependent behavior such as dropout","All parameters to constants","Every tensor to CPU memory"],"correctIndex":1,"explanation":"Evaluation mode controls layer behavior. Use a separate no-grad context when gradients are unnecessary."},{"id":62,"category":"PyTorch training and debugging","question":"A leaf parameter already has a gradient. What does another backward pass normally do?","options":["Replaces the parameter value","Adds to its existing gradient","Clears the previous gradient first","Updates the optimizer state"],"correctIndex":1,"explanation":"PyTorch accumulates gradients, so clearing or deliberate accumulation must be managed explicitly."},{"id":63,"category":"PyTorch training and debugging","question":"What should a standard multiclass cross-entropy loss receive as model input?","options":["Unnormalized logits","One-hot predictions","Predicted class indices","Rounded probabilities"],"correctIndex":0,"explanation":"The loss applies the needed log-softmax internally; class indices are commonly used as targets."},{"id":64,"category":"PyTorch training and debugging","question":"What does x.detach() remove?","options":["The autograd connection to x's history","The batch dimension","The tensor's numeric precision","All shared storage"],"correctIndex":0,"explanation":"Detaching stops gradient propagation through that connection but does not make an independent data copy."},{"id":65,"category":"PyTorch training and debugging","question":"Why can a view operation fail after a tensor transpose?","options":["The strides may be incompatible with the requested view","Transpose always deletes data","The tensor must have a gradient","Views require integer tensors"],"correctIndex":0,"explanation":"A reshape may copy when needed; a contiguous copy can also provide compatible storage."},{"id":66,"category":"PyTorch training and debugging","question":"When clipping gradients during loss-scaled mixed-precision training, what comes first?","options":["Reinitialize the scaler each step","Unscale the optimizer's gradients","Update parameters before backward","Clip the scaled loss value"],"correctIndex":1,"explanation":"Clipping should use the true gradient magnitudes before the optimizer update."},{"id":67,"category":"PyTorch training and debugging","question":"Why might saving live loss tensors in a Python list grow GPU memory?","options":["Losses require a new optimizer","Lists always copy model weights","GPU memory cannot be reused","The tensors may retain computation graphs"],"correctIndex":3,"explanation":"Store detached values for logging when the graph is no longer needed."},{"id":68,"category":"PyTorch training and debugging","question":"What is the output shape of a linear layer mapping 32 features to 7, given input (16, 32)?","options":["(32, 7)","(16, 32, 7)","(16, 7)","(7, 16)"],"correctIndex":2,"explanation":"The batch dimension is preserved and the last feature dimension becomes seven."},{"id":69,"category":"PyTorch training and debugging","question":"Why first try to overfit a tiny fixed batch when debugging training?","options":["To establish final generalization","To choose deployment hardware","To eliminate label noise globally","To test whether the model and training loop can learn at all"],"correctIndex":3,"explanation":"Failure on a tiny batch often exposes target, gradient, loss, or optimization mistakes."},{"id":70,"category":"PyTorch training and debugging","question":"Which checkpoint best supports resuming interrupted training?","options":["A random seed without weights","Model weights only","Training accuracy only","Model, optimizer, scheduler, step, and relevant RNG states"],"correctIndex":3,"explanation":"Resumption needs both learned parameters and the evolving training state."},{"id":71,"category":"Distributed training and scaling","question":"In ordinary data parallelism, what does each worker typically hold?","options":["A model replica and a different data shard","Only a validation set","Only one scalar parameter","Every example with no partitioning"],"correctIndex":0,"explanation":"Workers compute gradients on different samples and synchronize updates."},{"id":72,"category":"Distributed training and scaling","question":"What does standard DDP synchronize during backward?","options":["Only metric names","All user prompts","Parameter gradients","Every raw dataset file"],"correctIndex":2,"explanation":"Gradient synchronization coordinates replicated parameter updates across workers."},{"id":73,"category":"Distributed training and scaling","question":"Why use an appropriate distributed data sampler?","options":["DDP automatically shuffles every dataset","To change the model architecture","To partition or coordinate examples across workers","To remove all duplicate labels"],"correctIndex":2,"explanation":"Gradient synchronization alone does not assign different data to each process."},{"id":74,"category":"Distributed training and scaling","question":"Four workers each process 8 examples per step. With two accumulation steps, what is the effective batch size?","options":["16","64","32","128"],"correctIndex":1,"explanation":"Multiply workers, local batch, and accumulation: 4*8*2."},{"id":75,"category":"Distributed training and scaling","question":"What does gradient accumulation trade?","options":["More forward/backward passes per optimizer update for lower per-pass memory","Guaranteed identical batch-normalization behavior","Free extra compute","No need for loss scaling"],"correctIndex":0,"explanation":"Accumulation can approximate larger batches, with care about scaling and stateful layers."},{"id":76,"category":"Distributed training and scaling","question":"Why can distributed scaling flatten as worker count grows?","options":["The loss becomes constant","Models stop needing data","Communication and nonparallel work become limiting","More devices always give linear speedup"],"correctIndex":2,"explanation":"Device count alone does not eliminate synchronization, input, or serial bottlenecks."},{"id":77,"category":"Distributed training and scaling","question":"What distinguishes parameter sharding from basic replicated data parallelism?","options":["Model-related state is distributed across workers","Every worker stores more complete copies","Gradients are never computed","Data cannot be partitioned"],"correctIndex":0,"explanation":"Sharding reduces per-worker state memory at the cost of additional communication and complexity."},{"id":78,"category":"Distributed training and scaling","question":"What does activation checkpointing trade?","options":["Extra recomputation for lower activation memory","Lower precision for higher disk usage","Smaller datasets for better calibration","More labels for fewer gradients"],"correctIndex":0,"explanation":"Some intermediate activations are recomputed during backward instead of retained."},{"id":79,"category":"Distributed training and scaling","question":"What happens if one worker skips a collective communication that others enter?","options":["The batch becomes smaller automatically","The job can hang or fail","Training becomes deterministic","Others always proceed correctly"],"correctIndex":1,"explanation":"Collective operations require compatible participation and ordering."},{"id":80,"category":"Distributed training and scaling","question":"Why measure samples per second and time to target quality when scaling?","options":["Training loss is irrelevant","Communication cost is always zero","Device count proves all gains","Faster steps may change optimization efficiency"],"correctIndex":3,"explanation":"Throughput alone does not show whether a useful model is reached sooner or cheaper."},{"id":81,"category":"Experimental design and research engineering","question":"What makes a hypothesis experimentally useful?","options":["A claim that every outcome confirms","A list of popular tools","A measurable prediction that could be contradicted","A promise of success"],"correctIndex":2,"explanation":"Testable predictions let evidence distinguish explanations."},{"id":82,"category":"Experimental design and research engineering","question":"Why change one major factor at a time in a diagnostic ablation?","options":["To remove the need for repeated trials","To guarantee the best model","To avoid all interactions","To make the effect easier to attribute"],"correctIndex":3,"explanation":"Controlled changes help interpretation, while factorial studies can later examine interactions."},{"id":83,"category":"Experimental design and research engineering","question":"Why report results over multiple training seeds?","options":["To guarantee all data is independent","To replace a held-out test set","To choose only the best seed","To expose variation due to stochastic training"],"correctIndex":3,"explanation":"A single run can exaggerate a fragile improvement."},{"id":84,"category":"Experimental design and research engineering","question":"What should be done when a claimed gain disappears under a stronger baseline?","options":["Change the metric silently","Hide the baseline","Reassess the claim and investigate what remains","Report only the original result"],"correctIndex":2,"explanation":"Scientific value depends on fair comparisons rather than preserving a preferred conclusion."},{"id":85,"category":"Experimental design and research engineering","question":"What is an efficient first step when implementing a complex paper?","options":["Reproduce a small verifiable component or baseline","Launch the largest available training run","Skip data checks","Change every architectural detail"],"correctIndex":0,"explanation":"Small tests expose misunderstandings before expensive experiments."},{"id":86,"category":"Experimental design and research engineering","question":"Why record unsuccessful experiments?","options":["They lower all future scores","They prove the idea is impossible","They preserve evidence about what did not work and under which conditions","They replace successful replications"],"correctIndex":2,"explanation":"Negative results reduce repeated effort and clarify the limits of a hypothesis."},{"id":87,"category":"Experimental design and research engineering","question":"What does a Pareto frontier represent for quality, latency, and memory objectives?","options":["Solutions not dominated by another feasible solution","Every trained checkpoint","Only the largest model","Only solutions with equal scores"],"correctIndex":0,"explanation":"A nondominated solution offers a trade-off that no other compared option improves in all objectives."},{"id":88,"category":"Experimental design and research engineering","question":"What is a reproducible experiment configuration?","options":["A screenshot alone","An edited notebook with hidden state","A memory of the best values","Versioned settings linked to code, data, and artifacts"],"correctIndex":3,"explanation":"Explicit configurations reduce ambiguity when rerunning or reviewing results."},{"id":89,"category":"Experimental design and research engineering","question":"Why inspect raw examples behind aggregate metrics?","options":["To prove causality","To select only successes","To identify failure patterns and measurement defects","To replace all quantitative evidence"],"correctIndex":2,"explanation":"Qualitative analysis complements statistics by showing what errors actually look like."},{"id":90,"category":"Experimental design and research engineering","question":"What should an empirical claim distinguish?","options":["Only the author's confidence","Only the strongest possible interpretation","Observed evidence, assumptions, and untested extrapolation","Only future plans"],"correctIndex":2,"explanation":"Clear boundaries make research conclusions useful and defensible."},{"id":91,"category":"Serving generative image systems","question":"Why place long image-generation requests behind a job queue?","options":["To guarantee identical images","To manage capacity, status, cancellation, and retries","To avoid storing outputs","To remove every timeout"],"correctIndex":1,"explanation":"A queue supports bounded asynchronous work when generation exceeds normal request latency."},{"id":92,"category":"Serving generative image systems","question":"What should a generation record include for reproducibility?","options":["Only the output filename","Only the user-visible title","Model, adapter, prompt, seed, sampler, and key settings","Only the GPU temperature"],"correctIndex":2,"explanation":"Reproducing an output requires the full relevant inference configuration."},{"id":93,"category":"Serving generative image systems","question":"What should a cancellation mechanism avoid?","options":["Leaving expensive work running unnecessarily","Checking authorization","Returning a job ID","Recording any job state"],"correctIndex":0,"explanation":"Cancellation must be propagated to actual work where supported and accounted for reliably."},{"id":94,"category":"Serving generative image systems","question":"Why validate image dimensions and upload size at the service boundary?","options":["To guarantee useful prompts","To establish material truth","To remove all decoding errors","To bound memory and processing cost"],"correctIndex":3,"explanation":"Unbounded inputs can exhaust resources before the model runs."},{"id":95,"category":"Serving generative image systems","question":"When should a generated result be published as complete?","options":["Before inference starts","When the first temporary file appears","As soon as a queue accepts it","After output persistence and integrity checks succeed"],"correctIndex":3,"explanation":"Completion should mean the promised usable artifact is durably available."},{"id":96,"category":"Serving generative image systems","question":"Why version adapters separately from the base generator?","options":["Versioning replaces testing","Adapter changes can alter outputs without changing base weights","Adapters cannot be combined","Adapters have no effect at inference"],"correctIndex":1,"explanation":"Independent identities make output provenance and rollback possible."},{"id":97,"category":"Serving generative image systems","question":"What is a practical approach to GPU out-of-memory errors in production?","options":["Infinite automatic retries","Accept every resolution","Bounded admission control and tested workload limits","Delete all model versions"],"correctIndex":2,"explanation":"Know resource limits and reject, queue, or adapt workloads predictably."},{"id":98,"category":"Serving generative image systems","question":"Why test the UI-to-model region coordinate conversion?","options":["Every UI uses model pixels","Resizing or cropping can move the intended edit region","Masks are resolution independent","Coordinates affect only captions"],"correctIndex":1,"explanation":"The displayed selection must map correctly to the model's actual input space."},{"id":99,"category":"Serving generative image systems","question":"What should a generation service report when a requested control is unsupported?","options":["A random image without notice","A clear limitation or supported alternative","Silent apparent success","A fabricated capability"],"correctIndex":1,"explanation":"Users need accurate expectations about what the system can control."},{"id":100,"category":"Serving generative image systems","question":"What makes research-to-product handoff actionable?","options":["A tested artifact, inference contract, evaluation, limits, and operating guidance","Only a paper draft","Only a promising seed","Only training screenshots"],"correctIndex":0,"explanation":"Product teams need executable and maintainable evidence, not just a research result."}]},{"stem":"research_engineer_audio_ai","title":"Research Engineer","subtitle":"Audio AI","company":"ElevenLabs","questions":[{"id":1,"category":"Audio signals and representations","question":"A mono recording contains 16,000 samples per second. How many samples are in 2.5 seconds?","options":["40,000","6,400","400,000","16,000"],"correctIndex":0,"explanation":"Multiply sample rate by duration: 16,000 times 2.5."},{"id":2,"category":"Audio signals and representations","question":"For a 16 kHz sample rate, what is the Nyquist frequency?","options":["8 kHz","4 kHz","16 kHz","32 kHz"],"correctIndex":0,"explanation":"The highest uniquely representable frequency is half the sampling rate under the sampling assumptions."},{"id":3,"category":"Audio signals and representations","question":"What does a short-time Fourier transform describe?","options":["Only speaker identity","Only a text transcript","Only total recording duration","How frequency content varies over time windows"],"correctIndex":3,"explanation":"The STFT applies a frequency analysis to successive windows of the signal."},{"id":4,"category":"Audio signals and representations","question":"What is the usual time-frequency trade-off of a longer STFT window?","options":["Better resolution in both without cost","Lower sample rate automatically","No effect on representation","Better frequency resolution and poorer time localization"],"correctIndex":3,"explanation":"A longer window resolves closer frequencies while averaging over a longer time span."},{"id":5,"category":"Audio signals and representations","question":"What does a mel spectrogram apply to spectral information?","options":["A conversion of phase into word tokens","A filter removing every low frequency","A uniform gain on waveform amplitude","A perceptually motivated frequency filterbank"],"correctIndex":3,"explanation":"Mel-frequency bins emphasize resolution in a way motivated by human hearing."},{"id":6,"category":"Audio signals and representations","question":"What is audio clipping?","options":["A transcript is shortened","Amplitudes exceed the representable range and are truncated","The sample rate doubles","Every silent segment is removed"],"correctIndex":1,"explanation":"Saturation distorts the waveform and can introduce unwanted spectral content."},{"id":7,"category":"Audio signals and representations","question":"Why low-pass filter before downsampling a signal?","options":["To reduce aliasing from frequencies above the new Nyquist limit","To add missing words","To preserve every frequency unchanged","To increase duration"],"correctIndex":0,"explanation":"Frequencies unsupported by the lower sample rate can fold into lower bands."},{"id":8,"category":"Audio signals and representations","question":"What is the duration of 48,000 samples at 24 kHz?","options":["2 seconds","48 seconds","24 seconds","0.5 seconds"],"correctIndex":0,"explanation":"Duration equals sample count divided by samples per second."},{"id":9,"category":"Audio signals and representations","question":"Why distinguish loudness normalization from denoising?","options":["They are identical operations","Normalization always removes background speech","They address level and unwanted signal content respectively","Denoising fixes all gain problems"],"correctIndex":2,"explanation":"Changing amplitude does not separate desired speech from noise."},{"id":10,"category":"Audio signals and representations","question":"What does signal-to-noise ratio compare?","options":["Sample rate to highest speech frequency","Desired signal power to noise power","Peak amplitude to RMS amplitude","Output duration to processing duration"],"correctIndex":1,"explanation":"SNR quantifies relative power, often expressed in decibels."},{"id":11,"category":"Speech and audio model architectures","question":"What is the goal of automatic speech recognition?","options":["Identify speakers without transcribing words","Convert spoken audio into text","Convert text into a speech waveform","Remove noise without recognizing words"],"correctIndex":1,"explanation":"ASR models recognize linguistic content from acoustic input."},{"id":12,"category":"Speech and audio model architectures","question":"What does a neural vocoder typically synthesize?","options":["A speaker label from a spectrogram","A transcript from a waveform","A waveform from an acoustic representation","A forced alignment from known text"],"correctIndex":2,"explanation":"Vocoders connect acoustic features or codes to audible waveform output."},{"id":13,"category":"Speech and audio model architectures","question":"What does a neural audio codec compress into?","options":["Only a word-level transcript","Learned discrete or continuous audio representations","Only a sequence of silence boundaries","Only a speaker-identity vector"],"correctIndex":1,"explanation":"Codec representations can serve compression or generative modeling tasks."},{"id":14,"category":"Speech and audio model architectures","question":"Why are duration or alignment mechanisms useful in text-to-speech?","options":["Every word takes equal time","Text tokens and audio frames have different lengths","Text already specifies every sample","Audio has no temporal structure"],"correctIndex":1,"explanation":"Synthesis must align linguistic content with a longer acoustic sequence."},{"id":15,"category":"Speech and audio model architectures","question":"What is a benefit of CTC for sequence recognition?","options":["Training without a fixed frame-level alignment","Learning only from pairwise audio preferences","Requiring exactly one label per audio frame","Eliminating the need for target sequences"],"correctIndex":0,"explanation":"CTC sums over allowed alignments using a blank symbol and collapse rules."},{"id":16,"category":"Speech and audio model architectures","question":"What distinguishes autoregressive generation from fully parallel output prediction?","options":["It conditions new output steps on previous generated steps","It requires no inference loop","It never uses a prompt","It cannot use attention"],"correctIndex":0,"explanation":"Sequential dependence affects latency, caching, and error propagation."},{"id":17,"category":"Speech and audio model architectures","question":"What information does a speaker embedding aim to capture?","options":["Every background object","The exact transcript only","The recording's filename","Speaker characteristics useful for conditioning or comparison"],"correctIndex":3,"explanation":"Speaker identity features should be assessed separately from content and recording conditions."},{"id":18,"category":"Speech and audio model architectures","question":"Why can prosody be underdetermined by a plain transcript?","options":["Punctuation fully specifies every waveform","Every transcript fixes pitch exactly","The same words allow different rhythm, stress, and intonation","Prosody is only sample rate"],"correctIndex":2,"explanation":"Expressive speech requires information beyond lexical content alone."},{"id":19,"category":"Speech and audio model architectures","question":"What is a benefit of self-supervised audio pretraining?","options":["Removing all dataset bias","Eliminating acoustic variation","Guaranteeing correct transcripts without evaluation","Learning useful representations from audio with limited manual labels"],"correctIndex":3,"explanation":"Pretraining can reduce downstream label needs without removing domain-specific validation."},{"id":20,"category":"Speech and audio model architectures","question":"What must a streaming acoustic model restrict to be truly causal?","options":["Use of numeric features","Use of any hidden state","Dependence on future audio beyond its allowed lookahead","Access to all past audio"],"correctIndex":2,"explanation":"A full-utterance model may rely on future context unavailable during live processing."},{"id":21,"category":"Audio data and alignment","question":"What split best measures generalization to unseen speakers?","options":["Separate speakers across training and test","Split only by file extension","Randomly split clips from each speaker","Duplicate every speaker in both sets"],"correctIndex":0,"explanation":"Speaker separation prevents identity-specific memorization from inflating results."},{"id":22,"category":"Audio data and alignment","question":"Why can a transcript-audio mismatch damage supervised speech training?","options":["It changes only file size","It always improves robustness","The model receives contradictory content targets","It removes the need for alignment"],"correctIndex":2,"explanation":"Incorrect pairings teach associations unsupported by the acoustic evidence."},{"id":23,"category":"Audio data and alignment","question":"What should be reviewed before using a voice dataset for generation?","options":["Only microphone color","Only its download speed","Permissions, intended uses, provenance, and speaker coverage","Only the number of hours"],"correctIndex":2,"explanation":"Voice data needs appropriate use authorization as well as technical quality."},{"id":24,"category":"Audio data and alignment","question":"Why preserve language and accent metadata when reliable and permitted?","options":["To infer personal traits freely","To evaluate coverage and subgroup behavior","To guarantee equal error rates","To replace transcripts"],"correctIndex":1,"explanation":"Meaningful metadata supports targeted quality checks without making performance assumptions."},{"id":25,"category":"Audio data and alignment","question":"What can duplicate podcast segments cause across train and test?","options":["Guaranteed independent testing","Leakage that inflates recognition or generation evaluation","Elimination of noise","Better causal identification"],"correctIndex":1,"explanation":"Repeated content may occur in different encodings or edited files."},{"id":26,"category":"Audio data and alignment","question":"Why inspect silence and background-only segments?","options":["They contain no useful evaluation information","They can expose hallucination or segmentation problems","They should all be labeled as speech","They always imply a broken microphone"],"correctIndex":1,"explanation":"Systems need appropriate behavior when no target speech is present."},{"id":27,"category":"Audio data and alignment","question":"What is a risk of filtering all low-SNR speech from training?","options":["Losing coverage of realistic noisy deployment conditions","Making all speakers identical","Guaranteed better field accuracy","Eliminating every label error"],"correctIndex":0,"explanation":"Quality filtering should balance label reliability with real-world coverage."},{"id":28,"category":"Audio data and alignment","question":"What does forced alignment estimate given audio and a known transcript?","options":["Whether the transcript is legally authorized","The correct speaker's age","A new language translation","Where transcript units occur in time"],"correctIndex":3,"explanation":"Alignment assumes the supplied transcript and estimates temporal correspondence."},{"id":29,"category":"Audio data and alignment","question":"Why track the segmentation policy used to cut recordings?","options":["Every clip boundary is equivalent","Boundary decisions change context and target alignment","Segmentation affects only filenames","It guarantees zero leakage"],"correctIndex":1,"explanation":"Cuts can remove words, mix speakers, or alter usable context."},{"id":30,"category":"Audio data and alignment","question":"What should a multilingual sampling strategy consider?","options":["Only alphabetical language order","Only total recording bytes","Only the dominant language","Language coverage, quality, and desired deployment distribution"],"correctIndex":3,"explanation":"Naive proportional sampling may overwhelm lower-resource languages."},{"id":31,"category":"Speech quality and audio benchmarks","question":"A transcript has 100 reference words, 8 substitutions, 4 deletions, and 3 insertions. What is WER?","options":["12%","8%","15%","85%"],"correctIndex":2,"explanation":"Word error rate is (substitutions + deletions + insertions) divided by reference word count."},{"id":32,"category":"Speech quality and audio benchmarks","question":"Can word error rate exceed 100%?","options":["Only with an empty hypothesis","No, it is always a probability","Yes, sufficiently many insertions can cause it","Only if the sample rate is wrong"],"correctIndex":2,"explanation":"Insertions are not bounded by the number of reference words."},{"id":33,"category":"Speech quality and audio benchmarks","question":"What does mean opinion score summarize in a listening test?","options":["The number of training samples","Exact transcript correctness","Model parameter count","Human ratings under a specified scale and protocol"],"correctIndex":3,"explanation":"MOS depends on listener instructions, stimuli, raters, and the evaluation design."},{"id":34,"category":"Speech quality and audio benchmarks","question":"Why evaluate intelligibility separately from naturalness?","options":["They are mathematically identical","Naturalness guarantees every word is correct","Understandable speech can still sound unnatural","Intelligibility is only a latency metric"],"correctIndex":2,"explanation":"Different quality dimensions can improve or degrade independently."},{"id":35,"category":"Speech quality and audio benchmarks","question":"What should be held consistent in an ASR benchmark's text normalization?","options":["Only audio duration","Only model names","Only file ordering","Case, punctuation, number handling, and tokenization policy"],"correctIndex":3,"explanation":"WER can change because of normalization choices rather than recognition differences."},{"id":36,"category":"Speech quality and audio benchmarks","question":"Why report audio-quality results by language and speaker conditions?","options":["Language has no effect","Aggregate scores can conceal uneven performance","Every subgroup has equal difficulty","Slicing removes all uncertainty"],"correctIndex":1,"explanation":"Coverage and sample sizes determine how much confidence to place in each slice."},{"id":37,"category":"Speech quality and audio benchmarks","question":"What does speaker-similarity evaluation fail to establish alone?","options":["Whether two vectors can be compared","Whether embeddings can be computed","Whether spoken content and prosody are correct","Whether the audio is digital"],"correctIndex":2,"explanation":"Voice similarity is only one dimension of synthesis quality."},{"id":38,"category":"Speech quality and audio benchmarks","question":"Why use randomized presentation order in a paired listening test?","options":["To avoid collecting ratings","To reduce systematic order effects","To guarantee all listeners agree","To make samples longer"],"correctIndex":1,"explanation":"A/B order can influence judgments and should be controlled."},{"id":39,"category":"Speech quality and audio benchmarks","question":"What should a speech model's silence test assess?","options":["Unsupported transcription or generated content","Only sampling temperature","Only the number of speakers","Only voice similarity"],"correctIndex":0,"explanation":"Models should not invent linguistic content when the input provides no such evidence."},{"id":40,"category":"Speech quality and audio benchmarks","question":"Why accompany average quality scores with uncertainty estimates?","options":["Rater and item variation can make small differences unreliable","Means are always wrong","Intervals prove all users prefer one model","Uncertainty removes the need for examples"],"correctIndex":0,"explanation":"A measured advantage may be indistinguishable from sampling variation."},{"id":41,"category":"Streaming audio and inference","question":"What is time to first audio?","options":["Total training duration","Only vocoder throughput","The duration of the reference recording","Delay from request to the first playable output"],"correctIndex":3,"explanation":"Users perceive initial responsiveness separately from total completion time."},{"id":42,"category":"Streaming audio and inference","question":"A model generates 10 seconds of audio in 2 seconds. What is real-time factor?","options":["10","0.2","2","5"],"correctIndex":1,"explanation":"RTF is processing time divided by audio duration; below one means faster than real time."},{"id":43,"category":"Streaming audio and inference","question":"Why can short output chunks reduce perceived latency?","options":["They require no networking","They guarantee better prosody","They remove all buffering","Playback can start before the whole utterance is generated"],"correctIndex":3,"explanation":"Streaming starts delivery early but introduces boundary and scheduling trade-offs."},{"id":44,"category":"Streaming audio and inference","question":"What can happen when audio chunks are joined without continuity handling?","options":["Clicks, gaps, or prosodic discontinuities","Automatic improvement in speaker identity","Higher sample precision","Perfect boundary alignment"],"correctIndex":0,"explanation":"Chunk boundaries need coherent waveform and timing behavior."},{"id":45,"category":"Streaming audio and inference","question":"What does a jitter buffer trade?","options":["Added delay for smoother playback under network variation","Higher pitch for lower volume","More training data for less compute","More labels for better alignment"],"correctIndex":0,"explanation":"Buffering absorbs arrival variability at the cost of latency."},{"id":46,"category":"Streaming audio and inference","question":"Why is voice endpoint detection a latency-quality trade-off?","options":["The last word is always predictable","Waiting longer can avoid cutting speech but delays response","Endpoints never affect user experience","More waiting always improves all metrics"],"correctIndex":1,"explanation":"The system must decide when the user has finished without excessive delay."},{"id":47,"category":"Streaming audio and inference","question":"What should happen when a user interrupts a voice assistant?","options":["Stop or redirect ongoing output and manage stale work","Ignore the interruption","Finish every queued response regardless","Increase volume automatically"],"correctIndex":0,"explanation":"Barge-in handling prevents obsolete speech and supports a coherent interaction."},{"id":48,"category":"Streaming audio and inference","question":"Why benchmark streaming under concurrent load?","options":["A single request proves all capacity","Load affects only logs","Concurrent users have identical audio","Queueing and shared resources can change tail latency"],"correctIndex":3,"explanation":"User-perceived performance depends on system contention as well as model speed."},{"id":49,"category":"Streaming audio and inference","question":"What is a safe response to a dropped audio connection?","options":["Replay every side effect blindly","Keep all resources forever","Pretend the interaction completed","A defined reconnection or failure path without duplicate actions"],"correctIndex":3,"explanation":"Recovery should preserve state and distinguish delivered output from unfinished work."},{"id":50,"category":"Streaming audio and inference","question":"Why report first-audio latency and real-time factor together?","options":["Either proves naturalness","Both measure only sample rate","They are identical metrics","Startup responsiveness and sustained generation speed differ"],"correctIndex":3,"explanation":"A system may start quickly yet fail to sustain playback, or the reverse."},{"id":51,"category":"Preference learning and post-training","question":"What does a pairwise preference example contain?","options":["Only a training timestamp","Only a model size","A context and preferred versus dispreferred outputs","Only one unlabeled input"],"correctIndex":2,"explanation":"The comparison supplies a relative quality signal under a shared task context."},{"id":52,"category":"Preference learning and post-training","question":"What is reward hacking?","options":["Reducing GPU usage","Improving a proxy score without improving the intended outcome","Correctly optimizing a faithful metric","Randomizing model weights"],"correctIndex":1,"explanation":"An imperfect reward can favor exploitable shortcuts rather than actual task success."},{"id":53,"category":"Preference learning and post-training","question":"Why maintain a reference behavior or regularization during post-training?","options":["To eliminate all learning","To freeze every output forever","To guarantee factuality","To limit uncontrolled divergence from useful behavior"],"correctIndex":3,"explanation":"Constraints can balance optimization pressure against preserving prior capabilities."},{"id":54,"category":"Preference learning and post-training","question":"What distinguishes standard DPO from a typical reward-model-plus-PPO pipeline?","options":["It never uses a reference policy","It learns from preference pairs without separately fitting a reward model for PPO","It requires no preference data","It performs only image retrieval"],"correctIndex":1,"explanation":"DPO reformulates the preference objective into direct policy optimization."},{"id":55,"category":"Preference learning and post-training","question":"Why can preference-label inconsistency hurt learning?","options":["It automatically improves calibration","It removes model bias","The same behavior receives conflicting optimization signals","It makes all outputs equally valid"],"correctIndex":2,"explanation":"Clear rubrics and adjudication improve the meaning of preference supervision."},{"id":56,"category":"Preference learning and post-training","question":"What should be checked when a judge model favors longer responses?","options":["Whether short outputs can be deleted","Whether every long answer is correct","Whether length is confounded with actual task quality","Whether latency is irrelevant"],"correctIndex":2,"explanation":"Judge shortcuts can distort
